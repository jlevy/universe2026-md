  activities:
  - kind: project
    title: Student Professional Awareness Conference (SPAC-IEEE)
    detail: 'Organized a 5 hour professional conference with engineers from around the United States.
      We had an engineer, and CEO of 3 different companies, Mike Andrews, from Arizona speak first, and
      then had 2 workshops (How to teach yourself Matlab, Negotiation Job Offers) going simultaneously,
      then again 2 workshops (Consulting How to''s: Do-s and Don''t-s, Finding Internships).Afterwards
      we had a panel of 5 experienced engineers Jonathan Chew, from Disney, Christine Hailey, Dean of
      Engineering at Utah State University, Mike Andrews from earlier, Peijung Tsai from L3 Communications,
      and Kelly Wigington from VPI Engineering. They each spoke of their experiences and how they got
      to where they are now.Lastly, motivational speaker Jonathan Chew and current employee at Disney
      presented on becoming the best you.Overall we had 175 registrants, where our Dean of Electrical
      Engineering called it "The most attended engineering conference I have ever seen since working at
      this school." · Mar 2014'
    evidence:
