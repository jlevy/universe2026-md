  - title: Visualizing the Underlying Trends of Component Latencies affecting Service Operation Performance
    venue: ACTEA 2009, Advances in Computational Tools for Engineering Applications
    date: July 15, 2009
    description: This paper presents a technology agnostic method for extracting the underlying distinct
      patterns of variations in the overall performance of a service operation for changes to different
      application components supporting the service operation in a computer based service provider to
      consumer contract. This short paper advocates that visualizing these patterns would help in early
      projection of the operation's performance due to modification of the application components/processing
      catering to the operation, without the need of repetitive performance and load testing of the whole
      service. Lookup datasets against different component configurations are created to associate the
      variability of component processing impedances to the service operation's performance and best fit
      regression types are applied to enable trend extrapolation and interpolation.
    evidence:
      url: https://www.linkedin.com/in/sueblack
      observed_at: '2026-10-24T08:16:46Z'
  - title: Service Operation Impedance and its role in projecting some key features in Service Contracts
    venue: ICWE 2009 International Conference on Web Engineering
    date: June 29, 2009
    description: This paper introduces the notion of implicit Operation Impedance (I)and Operation Potential
      (V) in Service Provider-Consumer contracts. ‘I’ is theruntime composite resultant of all the activity
      delays of the componentssupporting the Service Operation. This work establishes that ‘I’, which
      impactsthe overall Operation Performance (P), is influenced by the underlyingapplication components’
      activities in distinct patterns. A high-level runtimeabstract model is empirically deduced between
      ‘I’, ‘V’ and ‘P’ by applyingestablished mathematical techniques. Model based indicative values of
      somefeatures are computed against variability of the operation’s components.Lookup datasets against
      different system configurations are created to associatethese computed values to the actual empirical
      values of other features.Established mathematical techniques applied with appropriate regression
      typesto enable trend extrapolation/interpolation. The datasets/patterns affirmedeffectiveness of
      the ‘I’ based model as a means of decoupled, bidirectional i.e.top-down and bottom-up impact assessment
      of modifications to the operation’sunderlying application components on ‘P’ (‘V’ constant) or ‘V’
      (‘P’ constant)without repetitive full scale external performance/benchmark testing. This alsoenables
      fine tuning of application components to retrofit prescribed Quality ofService (QoS). The paper
      briefly mentions a Matrix Transpose/Inversetechnique for future assessment of multiple component
      changes simultaneously
    evidence:
