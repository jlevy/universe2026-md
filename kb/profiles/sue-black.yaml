      of technology, and enable everyone to use, benefit from and enjoy the powerful… Show more Computing
      and technology is utterly pervasive throughout our world today, but public understanding of technology
      remains very poor, public perception of computer science is often negative, and many people struggle
      with or avoid technologies which have the power to help them hugely in their daily lives. The <goto>
      Foundation aspires to rebrand computer science, raise public awareness and knowledge of technology,
      and enable everyone to use, benefit from and enjoy the powerful computing systems in our lives today.
      The <goto> Foundation will catalyse rapid change in these areas, through direct strategic action.
      <goto>’s aims are to excite, engage, empower and enlighten. We want to bring together existing projects,
      people and organisations working in this field – we’re not reinventing the wheel – and <goto> will
      connect groups with the individuals and resources they need to operate most effectively. At the
      same time, <goto> is attempting something new and unique – to raise the profile of technology with
      the general public through national scale campaigns and events, taking computer science outreach
      beyond schools and making it relevant to people’s everyday lives. This isn’t about getting everyone
      coding – it’s also about design, hardware, security, user experience and more. It’s about empowering
      everyone to make the most of the technologies available to them; exciting and enlightening them
      about the power of computer science and its impact on our daily lives; and engaging people with
      computing and the issues around it. Show less · Nov 2011
