      observed_at: '2026-10-24T08:16:46Z'
  - title: Deriving an approximation algorithm for automatic computation of ripple effect measures
    venue: Journal of Information and Software Technology
    date: June 1, 2008
    description: The ripple effect measures impact, or how likely it is that a change to a particular
      module may cause problems in the rest of a program. It can also be used as an indicator of the complexity
      of a particular module or program. Central to this paper is a reformulation in terms of matrix arithmetic
      of the original ripple effect algorithm produced by Yau and Collofello in 1978. The main aim of
      the reformulation is to clarify the component parts of the algorithm making the calculation more
      explicit. The reformulated algorithm has been used to implement REST (Ripple Effect and Stability
      Tool) which produces ripple effect measures for C programs. This paper describes the reformulation
      of Yau and Collofello's ripple effect algorithm focusing on the computation of matrix Zm which holds
      intramodule change propagation information. The reformulation of the ripple effect algorithm is
      validated using fifteen programs which have been grouped by type. Due to the approximation spurious
      1s are contained within matrix Zm. It is discussed whether this has an impact on the accuracy of
      the reformulated algorithm. The conclusion of this research is that the approximated algorithm is
      valid and as such can replace Yau and Collofello's original algorithm.
    evidence:
      url: https://www.linkedin.com/in/sueblack
      observed_at: '2026-10-24T08:16:46Z'
  - title: An introduction of new UML design metrics for web applications
    venue: International Journal of Computer and Information Science
    date: December 1, 2007
    description: 'Many World Wide Web applications incorporate important business assets and offer a convenient
      way for businesses to promote their services through the Internet. Many of these web applications
      evolved from simple HTML pages to complex applications which are difficult to maintain. In order
      to control the maintenance of web applications quantitative metrics and models for predicting web
      applications’ maintainability must be used. This paper introduces new design metrics for measuring
      the maintainability of web applications from class diagrams. The metrics are based on Web Application
      Extension (WAE) for UML and will measure the following design attributes: size, complexity, coupling
      and reusability. The paper provides a classification of the metrics based on the measurement structure
      proposed by Kitchenham for theoretical metrics validation. In addition to that, an exploratory experiment
      at the university of Illinois is carried out in order to show the relationship between the metrics
      and understandability and modifiability time'
    evidence:
      url: https://www.linkedin.com/in/sueblack
      observed_at: '2026-10-24T08:16:46Z'
  - title: Computing ripple effect for software maintenance
    venue: 'Journal of Software Maintenance and Evolution: Research and Practice'
    date: August 31, 2006
    description: Recent software maintenance models have included impact analysis and accounting for ripple
      effect as one of their stages. This paper describes and explains the reformulation of Yau and Collofello's
      ripple-effect algorithm and its validity within the software-maintenance process. Completely automatic
      computation of ripple effect has until now proved troublesome; we show how our approximation algorithm
      helps to overcome this. Our Ripple Effect and Stability Tool (REST) which uses our approximated
      algorithm to compute ripple effect for C programs, is described. Eleven C programs are used in an
      initial investigation into whether our approximated algorithm can replace Yau and Collofello's original
      algorithm for the purpose of automatic computation of ripple effect. The Pearson correlation coefficient
      for the two versions of the algorithm across the eleven programs shows a high correlation.
    evidence:
      url: https://www.linkedin.com/in/sueblack
      observed_at: '2026-10-24T08:16:46Z'
  - title: Is ripple effect intuitive? A pilot study
    venue: 'NASA: Innovations in Systems and Software Engineering'
    date: July 1, 2006
    description: 'The computation of ripple effect is based on the effect that a change to a single variable
      will have on the rest of a program; it determines the scope of the change and provides a measure
      of the program’s complexity. The original algorithm used to compute ripple effect has been reformulated
      mainly to provide clarity in the operations involved. The reformulation involved some approximation
      which was shown not to affect the measures produced. The reformulated, approximated algorithm has
      been implemented as the software tool: Ripple Effect and Stability Tool (REST). This paper uses
      a software development project as a case study to look at the relationship between the approximated
      ripple effect and a programmer’s intuitive idea of ripple effect. Four versions of a mutation testing
      software tool were written in C over a period of several months. After the completion of each version
      the programmer was asked to detail his predicted/intuitive ripple effect for each module of code.
      The predictions are compared with the approximated ripple effect measures for each module and some
      surprising conclusions drawn.'
    evidence:
      url: https://www.linkedin.com/in/sueblack
      observed_at: '2026-10-24T08:16:46Z'
