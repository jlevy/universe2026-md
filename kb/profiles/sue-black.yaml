  publications:
  - title: 'Twitter Acceptance: The Role of Intrinsic Motivation'
    venue: 'Proceedings of ALPIS, Sprouts: Working Papers on Information Systems'
    date: September 10, 2010
    description: The aim of this study has been to investigate the process of acceptance and use of technology
      by users, focusing on the role of intrinsic and extrinsic motivation in determining it. The key
      role of user's motivation in determining the usage behavior has been already investigated from previous
      research, but they have not focused on the process of microblogging acceptance. On the contrary
      of other work tools, microblogging is an informal communication medium that allows to balance work
      and socially life. Therefore, we believe users that use this tool, and specifically Twitter, may
      be more intrinsically motivated than users that use other technologies. A survey methodology was
      used to gather data, whilst Partial Least Squares technique has been used to analyze them. Findings
      show that intrinsic and extrinsic motivation positively affect behavioral intention to Twitter use,
      but first is more explanatory variable than second.
    evidence:
      url: https://www.linkedin.com/in/sueblack
      observed_at: '2026-10-24T08:16:46Z'
  - title: A Survey of Social Media Use in Global Systems Development
    venue: Web2SE Workshop at IEEE International Conference on Software Engineering (ICSE
    date: May 4, 2010
    description: In this paper, we describe the preliminary results of a pilot survey conducted to collect
      information on social media use in global software systems development. We created an on-line survey
      for developers who are using social media to communicate at work and whose work falls within the
      domain of software systems development, including web applications. Our results show that social
      media can enable better communication through the software system development process. 91% of respondents
      said that using social media has improved their working life.
    evidence:
      url: https://www.linkedin.com/in/sueblack
      observed_at: '2026-10-24T08:16:46Z'
  - title: Can Twitter Save Bletchley Park?
    venue: Museums and the Web 2010
    date: April 15, 2010
    description: 'Bletchley Park is the historic site of secret British codebreaking activities during
      World War II and birthplace of the modern computer. The work carried out there is said to have shortened
      WWII by two years, saving possibly 22 million lives. The Park is now a museum, with a 26 acre site,
      many exhibitions and working rebuilds of machines such as the Colossus, a forerunner of today''s
      computers, invented to mechanize codebreaking. The museum is staffed by a 75% volunteer workforce
      and is grossly underfunded compared to its historical importance.After a visit by Sue Black to Bletchley
      Park in July 2008, a campaign was launched to save it. A letter to the UK broadsheet newspaper The
      Times signed by 97 eminent UK computer scientists was published and highlighted in a BBC news broadcast.
      Following traditional media coverage, a blog was established, and then social media, (particularly
      Twitter), which have been used to great effect to raise awareness and support for the campaign.
      Other Web 2.0 technologies, including Facebook, have also been used as part of the campaign.This
      paper explores the effectiveness of this approach, using statistical evidence as appropriate, highlighting
      how the use of social media has contributed greatly to campaign success. Since the Saving Bletchley
      Park campaign started, visitor numbers have increased, along with public awareness of the contribution
      of the site to world heritage and the history of the computer.Campaign efforts have received national
      coverage on television, on radio, and in the press and have contributed to the Park recently receiving
      £460K funding and a potential further £4 million funding from the UK Heritage Lottery Fund.Keywords:
      blogging, fundraising, heritage, virtual community, United Kingdom, Web 2.0, social media, Twitter'
    evidence:
      url: https://www.linkedin.com/in/sueblack
      observed_at: '2026-10-24T08:16:46Z'
