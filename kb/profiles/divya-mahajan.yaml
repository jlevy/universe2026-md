  publications:
  - title: 'AADF: Agentic Application Delivery Framework — A Staged Methodology for Building Durable AI
      Agentic Systems'
    venue: Zenodo
    date: March 23, 2026
    description: 'Most teams building agentic AI are solving the wrong problem — adding complexity before
      validating necessity.This preprint introduces the 𝗔𝗴𝗲𝗻𝘁𝗶𝗰 𝗔𝗽𝗽𝗹𝗶𝗰𝗮𝘁𝗶𝗼𝗻 𝗗𝗲𝗹𝗶𝘃𝗲𝗿𝘆 𝗙𝗿𝗮𝗺𝗲𝘄𝗼𝗿𝗸 (𝗔𝗔𝗗𝗙)
      — a 9-stage, 3-phase methodology for designing, building, and hardening agentic systems that are
      𝘀𝘁𝗮𝗰𝗸-𝗶𝗻𝗱𝗲𝗽𝗲𝗻𝗱𝗲𝗻𝘁 and 𝗳𝗿𝗮𝗺𝗲𝘄𝗼𝗿𝗸-𝗮𝗴𝗻𝗼𝘀𝘁𝗶𝗰.━━━━━━━━━━━━━━━━━━━━━━━𝟯 𝗖𝗼𝗿𝗲 𝗖𝗼𝗻𝘁𝗿𝗶𝗯𝘂𝘁𝗶𝗼𝗻𝘀━━━━━━━━━━━━━━━━━━━━━━━𝟭.
      𝗧𝗵𝗲 𝗜𝗻𝗳𝗹𝗲𝗰𝘁𝗶𝗼𝗻 𝗣𝗼𝗶𝗻𝘁 𝗦𝘁𝗮𝗶𝗿𝗰𝗮𝘀𝗲Start at the lowest viable complexity — Raw LLM → Tool Use → Agency
      → RAG → Memory → Multi-Agent → Orchestration → Swarm — and climb only when evaluation proves you
      must. Complexity is debt. Take it on only when failure demands it.𝟮. 𝗠𝗶𝗻𝗶𝗺𝗮𝗹 𝗘𝘃𝗮𝗹𝘂𝗮𝘁𝗶𝗼𝗻 𝗙𝗿𝗮𝗺𝗲𝘄𝗼𝗿𝗸
      (𝗠𝗘𝗙)Structure your datasets, metrics, and enforcement alerts 𝗯𝗲𝗳𝗼𝗿𝗲 writing a line of code.𝟯. 𝗖𝗼𝗻𝘁𝗿𝗼𝗹𝗹𝗲𝗱
      𝗗𝗲𝗴𝗿𝗮𝗱𝗮𝘁𝗶𝗼𝗻 𝗟𝗮𝗱𝗱𝗲𝗿When systems fail, they should land gracefully: Full Operation → Cheaper Model
      → Cached Results → Human Handoff → Graceful Error.━━━━━━━━━━━━━━━━━━━━━━━That’s the framework working
      as designed.The paper also introduces the 𝗖𝗵𝘂𝗿𝗻 𝗠𝗮𝗽 and a four-layer swappability architecture that
      keeps business logic stable while isolating volatile framework dependencies at the bottom.𝗜𝗳 𝘆𝗼𝘂’𝗿𝗲
      𝗯𝘂𝗶𝗹𝗱𝗶𝗻𝗴 𝗮𝗴𝗲𝗻𝘁𝗶𝗰 𝘀𝘆𝘀𝘁𝗲𝗺𝘀 𝗮𝗻𝗱 𝘄𝗮𝗻𝘁 𝘁𝗵𝗲𝗺 𝘁𝗼 𝘀𝘂𝗿𝘃𝗶𝘃𝗲 𝗽𝗿𝗼𝗱𝘂𝗰𝘁𝗶𝗼𝗻 — this framework is for you.𝗔𝗔𝗗𝗙 #𝗔𝗜𝗔𝗴𝗲𝗻𝘁𝘀
      #𝗟𝗟𝗠𝗢𝗽𝘀 #𝗔𝗿𝘁𝗶𝗳𝗶𝗰𝗶𝗮𝗹𝗜𝗻𝘁𝗲𝗹𝗹𝗶𝗴𝗲𝗻𝗰𝗲 #𝗠𝗟𝗘𝗻𝗴𝗶𝗻𝗲𝗲𝗿𝗶𝗻𝗴 #𝗔𝗜𝗘𝗻𝗴𝗶𝗻𝗲𝗲𝗿𝗶𝗻𝗴​​​​​​​​​​​​​​​​'
