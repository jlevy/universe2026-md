      budget of around $3 million. Mozilla was born out of and remains a part of this movement, and we
      prosper because of its technology and activism. And we know that open source software remains a
      key part of the Internet and is essential for the online life of choice, innovation and opportunity
      we seek to build. The Mozilla Open Source Support program recognizes and celebrates open source
      projects that contribute to our work and the health of the Internet. It encompasses “giving back”
      to projects that Mozilla already relies on (“Foundational Technology”), “giving forward” to projects
      whose goals are in alignment with ours (“Mission Partners”), and improving the security of the open
