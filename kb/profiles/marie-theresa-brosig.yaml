    title: Putting cybersecurity advocacy into action with GitHub Advanced Security
    detail: 'This is the repository for my GitHub Universe 2023 session Putting cybersecurity advocacy
      into action with GitHub Advanced Security SEC1808M. It contains all the additional information shown
      in the session.What is this about?If you haven''t watched the session yet, here''s a quick explainer:
      a lot of corporate cybersecurity is asking other people to change. But change is kind of hard1.
      Corporate cybersecurity teams2 can (and probably should) do better when it comes to helping people
      change. Science can tell us how to do that3! In my session I talk a lot about how to put science-based
      strategies into action by suggesting concrete steps you can take.https://github.com/marietheresa/improved-lamp'
