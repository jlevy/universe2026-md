    channel: x
  - title: |-
      This is simply a post about how you can't predict the JIT compiler.

      Caveats:
      - The code needs to run often enough to be JIT'd. A React render block is a great example.

      - Depending on the use case the readability of using Array.from might still be preferred.
    url: https://twitter.com/3274745054/status/1753556668439535818
    published: '2024-02-02T23:11:03Z'
    channel: x
  - title: |-
      On stream we started looking at Mac mini upgrades. Mine is a 2015.
      A Mac Studio with 192GB of RAM is tempting.

      Just imagine... with all that RAM, I would be able to run TWO next.js dev servers AT THE SAME TIME!
    url: https://twitter.com/3274745054/status/1747429778297348129
    published: '2024-01-17T01:24:59Z'
    channel: x
  - title: |-
      Many people are reading the DHH article about TypeScript and taking an all or nothing stance about it.

      Hint: Some of the libraries we tout as "type-safe" mainly focus on external type-safety. They ALL use "any" internally when the type system gets in their way.

      tRPC? Zod? Yup.
    url: https://twitter.com/3274745054/status/1699522878730010714
    published: '2023-09-06T20:40:04Z'
    channel: x
  - title: |-
      I think the debate around "passion" in programming is so contentious because passion is seen as a very strong emotion.

      If we reframed it as "curious", I doubt as many people would push back.

      The best devs we all know are probably the most curious.
    url: https://twitter.com/3274745054/status/1691562288371888201
    published: '2023-08-15T21:27:31Z'
    channel: x
  - title: |-
