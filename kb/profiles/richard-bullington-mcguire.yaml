  publications:
  - title: Docker for Developers
    venue: Packt Publishing
    date: September 1, 2020
    description: Docker is the de facto standard for containerizing apps, and with an increasing number
      of software projects migrating to containers, it is crucial for engineers and DevOps teams to understand
      how to build, deploy, and secure Docker environments effectively. Docker for Developers will help
      you understand Docker containers from scratch while taking you through best practices and showing
      you how to address security concerns.Starting with an introduction to Docker, you’ll learn how to
      use containers and VirtualBox for development. You’ll explore how containers work and develop projects
      within them after you’ve explored different ways to deploy and run containers. The book will also
      show you how to use Docker containers in production in both single-host set-ups and in clusters
      and deploy them using Jenkins, Kubernetes, and Spinnaker. As you advance, you’ll get to grips with
      monitoring, securing, and scaling Docker using tools such as Prometheus and Grafana. Later, you’ll
      be able to deploy Docker containers to a variety of environments, including the cloud-native Amazon
      Elastic Kubernetes Service (Amazon EKS), before finally delving into Docker security concepts and
      best practices.By the end of the Docker book, you’ll be able to not only work in a container-driven
      environment confidently but also use Docker for both new and existing projects.
    evidence:
      url: https://www.linkedin.com/in/richardbullingtonmcguire
      observed_at: '2026-10-24T08:47:10Z'
  - title: Real World SELinux
    venue: Linux Journal
    date: Jul 2007
    description: This case study of an intrusion attempt shows how SELinux can stop intruders from escalating
      the privileges they already have. The article explains the tools and methods used for investigating
      the intrusion attempt, along with the forensic information gathered.
