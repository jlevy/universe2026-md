  - title: Don't Disrupt Agile. Drop it!
    venue: Cutter Business Technology Journal
    date: April 29, 2020
    description: 'Jeff Doolittle helps us to set out on our own path to disruption. He suggests the most
      drastically disruptive action: don’t do Agile. At the very least, don’t do Agile the way too many
      others are doing Agile. Doolittle invokes the same line of thinking that started our thought experiment
      to begin with — what has Agile become? Has it grown in unintended ways? Have we lost what it is
      supposed to be? What else is there if not Agile? Should we completely abandon Agile? Wouldn’t that
      be disruptive!'
    evidence:
      url: https://www.linkedin.com/in/jeffdoolittle
      observed_at: '2026-10-24T08:11:33Z'
