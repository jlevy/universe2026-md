  activities:
  - kind: project
    title: AI-Native Product Delivery Lifecycle
    detail: Helped lead the design of an AI-native software delivery model that allows autonomous agents
      to participate across the product development lifecycle without bypassing engineering controls.
      Built around dependency-aware work decomposition, orchestration workflows, architecture-first implementation
      constraints, multi-perspective AI critique, acceptance-criteria traceability, and test-backed quality
      gates, the model increases throughput and safe parallelism while preserving human review, architectural
      coherence, and delivery quality. The result is a scalable operating approach for helping teams adopt
      AI effectively, move faster, and maintain high standards at enterprise scale. · Jul 2025
    evidence:
      url: https://www.linkedin.com/in/jeffdoolittle
      observed_at: '2026-10-24T08:11:33Z'
  - kind: project
    title: Architecture Clinics
    detail: I regularly lead five-day architecture clinics designed to strengthen architectural judgment,
      design quality, and peer review capability across engineering teams. Combined instruction, collaborative
      system design, critique, and review practices to help participants move beyond ad hoc solutioning
      into more rigorous systems thinking. The clinic accelerated learning, created shared design language,
      and gave teams practical architecture skills that typically take years to develop through experience
      alone. Achieved significant process acceleration through the use of AI tools and workflows to augment
      the system design process. · Mar 2025
    evidence:
      url: https://www.linkedin.com/in/jeffdoolittle
      observed_at: '2026-10-24T08:11:33Z'
  - kind: project
    title: OSS Compliance at Trimble
    detail: I oversee open source compliance for most of my company's open source offerings. This is a
      laborious task. To greatly simplify the process, I led the design and implementation of an AI-assisted
      open and inner source compliance initiative that transformed repository governance from a manual
      bottleneck into a scalable, self-service operating model. Built a weekly audit and remediation workflow
      that combined policy automation, reversible enforcement, and AI-guided maintainer support to improve
      compliance across a large engineering footprint. Within the first four days, compliant repositories
      increased ten-fold, and all public repositories were made fully compliant in less than three weeks.
      Lapses result in automatic notification and the ability for maintainers to kick off an agentic workflow
      to remediate any violations. The effort demonstrated how experienced architectural judgment plus
      AI can act as a force multiplier for enterprise governance. · Nov 2019
    evidence:
      url: https://www.linkedin.com/in/jeffdoolittle
      observed_at: '2026-10-24T08:11:33Z'
  - kind: project
    title: AI Workflow Proving Ground
    detail: Built a production-grade AI workflow proving ground to evaluate emerging multi-model patterns
      before they became customer-facing risks. Designed a pipeline that turns public research, PDFs,
      and web sources into finished multi-speaker podcast episodes using human-in-the-loop approvals,
      transcript validation, fact-checking, audio verification, observability, and cost controls. The
      result was a living reference architecture for AI workflows that helped teams learn latency, quality,
      orchestration, and operational discipline in a controlled environment without risking customer outages
      on production systems. · Apr 2026
    evidence:
      url: https://www.linkedin.com/in/jeffdoolittle
      observed_at: '2026-10-24T08:11:33Z'
  - kind: project
    title: 360 Construction Site Capture
    detail: Provided architectural leadership and direct mentorship for a 360 site capture initiative
      that needed to move from vision to market-deliverable system. Focused on training and advising the
      lead architect in systems thinking, design review rigor, and the practical discipline required to
      translate a complex concept into reusable building blocks and viable product capabilities. The effort
      resulted in both a shipped system and stronger internal architecture leadership capacity. This product
      greatly enhances the go-to-market offering for my companies portfolio of construction project management
      capabilities. · Jan 2025
    evidence:
      url: https://www.linkedin.com/in/jeffdoolittle
      observed_at: '2026-10-24T08:11:33Z'
  - kind: project
    title: Contributor to NancyFX Open Source Web Framework
    detail: Mar 2014
    evidence:
