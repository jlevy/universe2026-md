      observed_at: '2026-10-24T08:11:33Z'
  - kind: project
    title: Contributor to JasperFx/Marten PostgreSQL Document DB and Event Store for .NET
    detail: The Marten library provides .NET developers with the ability to use the proven PostgreSQL
      database engine and its fantastic JSON support as a fully fledged document database. The Marten
      team believes that a document database has far reaching benefits for developer productivity over
      relational databases with or without an ORM tool.Marten also provides .NET developers with an ACID-compliant
      event store with user-defined projections against event streams. · Nov 2015
