  activities:
  - kind: project
    title: Hospital Quality Reporting (HQR), Project Management & Business Requirements (PMBR)
    detail: 'Hospital Quality Reporting Responsibilities: Worked in the CMS environment as a Business
      Analyst for PMBR, specifically for the Centers for Medicare & Medicaid Services (CMS) Center for
      Clinical Standards and Quality (CCSQ). Facilitated Requirements/User Story elicitation sessions
      between cross functional groups to identify CMS program needs for system releases. Documented change
      requests as needed by working with stakeholders and development organization. Analyzed defects and
      provided production support during the various HQR testing cycles. Public Reporting of Quality Data
      on Hospital Compare (PR): Create product backlog items and involved in daily Scrum team activities.
      Elicited business needs for Inpatient and Outpatient Quality Reporting preview reports. Elicited
      business needs for data files transmitted to the web contractor for display on Hospital Compare.
      Created process documentation for how PR User Story development would operate in an Agile environment
      and created BPMs for the PR system. External Data Files: Responsible for the functional and technical
      requirements of the External Data Files application for HQR and PR. This included the creation of
      data file layouts that stakeholders would utilize to submit quality data for designated submission
      periods. · Jul 2013'
    evidence:
      url: https://www.linkedin.com/in/sglass1
      observed_at: '2026-10-24T08:15:33Z'
  - kind: project
    title: PECOS Project Management Office (PMO)
    detail: Started to work on the PECOS PMO on a part time basis in September 2011 and moved to the PMO
      full time in November 2012. Operationalized project management reporting and took ownership of project
      management reports. Worked on process improvement initiatives to improve efficiency and performance
      within the project. Gained experience in Earned Value Management. Familiar with Integrated Master
      Schedules (IMS), Work Breakdown Structure (WBS), Project Workbook (PW), Implementing BCRs, creating
      project codes for time keeping, and Contract Performance Reporting (CPR). Understanding of reporting
      thresholds and documenting/explanation of variances in schedule. Managed monthly project deliverables
      by creating a calendar for managers to reference. Gained an understanding of the projects statement
      of work (SOW) and contact deliverables. Assisted the project in preparing for an integrated baseline
      review. · Dec 2012
    evidence:
      url: https://www.linkedin.com/in/sglass1
      observed_at: '2026-10-24T08:15:33Z'
  - kind: project
    title: External User Services (EUS)
    detail: The EUS service desk supports PECOS and other CMS systems such as PS&R, STAR, and MED, by
      taking calls and emails from users reporting application issues experienced while using the applications.
      Served as a liaison between the client and the service desk.Performed tasks such generating process
      and procedure documentation for the systems EUS supports. Provided application support by working
      with the leads from the service desk to develop solutions for issues occurring in production. Used
      system knowledge and understanding of business rules to develop solutions. Worked with members of
      development team to identify technical solutions for complex issues. Wrote change requests for issues
      encountered in production as long term resolutions. Proposed functionality and design changes in
      the system based on errors reported by users. Performed data analysis of trouble ticket data and
      wrote reports on issues occurring in production for the client. Responsible for managing the service
      desk application training program. Gathered requirements for quarterly updates by analyzing system
      enhancements from the previous quarter. Created schedules in MS project to manage the timeline and
      resources. Worked with the learning management team on deployment schedules and held weekly meetings
      to discuss open issues, action items, and variances in schedule. Managed the migration of content
      from “e-path” to the “Skillsoft PDK” with no supervision. Responsible for maintenance of EUS website
      (www.eushelpdesk.com). Used knowledge of XHTML and CSS to perform updates such as announcements,
      FAQs, and other content as needed. Lead weekly meetings with the client to report status, discuss
      open issues, and action items. · Jun 2011
    evidence:
      url: https://www.linkedin.com/in/sglass1
      observed_at: '2026-10-24T08:15:33Z'
  - kind: project
    title: PECOS Support Center
    detail: Documented requirements and specifications for the new tool and how it would integrate with
      the processes and procedures. Created business process models to depict the manner in which incidents
      would be managed through the service center. Developed new processes and standard operating procedures
      (SOPs) for a new service desk incident management tool. Participated in the vendor selection process
      to identify which tool would be most suitable for the project. · Feb 2012
    evidence:
      url: https://www.linkedin.com/in/sglass1
      observed_at: '2026-10-24T08:15:33Z'
  - kind: project
    title: PECOS E-Signature Project
    detail: Member of the e-signature team, which was tasked to implement electronic signature functionality
      into PECOS. Gathered requirements from the client and SME’s for design.Created process diagrams
      for proposed business process. Designed mockups/wireframes for enhancements. Performed system design
      document updates.Wrote test scripts/cases and executed test scenarios as well. Participated in system
      testing, validation testing, and UAT. Assisted with addressing UAT incidents and post production
      issues. · Sep 2011
    evidence:
      url: https://www.linkedin.com/in/sglass1
