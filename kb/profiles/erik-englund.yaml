  publications:
  - title: 'From 1,400 Users to Zero Tickets: How WEX Scaled JFrog with Fabric and an AI-Powered Gemini
      Gem'
    venue: SwampUp 2026
    date: September 2, 2026
    description: 'SwampUp 2026From 1,400 Users to Zero Tickets: How WEX Scaled JFrog with Fabric and an
      AI-Powered Gemini GemAbout this sessionManaging JFrog Artifactory for 1,400+ developers across dozens
      of teams and hundreds of repositories is a massive operational challenge. At WEX Inc., our PaaS
      Engineering team solved this by building the Fabric ecosystem — a centralized, Terraform-driven
      platform that automates every aspect of Artifactory: repository provisioning, OIDC authentication,
      permissions, and CI/CD integration — all governed by a single "Fabric ID" per team.But infrastructure
      automation alone didn''t eliminate the support burden. Developers still filed hundreds of tickets
      asking how to authenticate, push artifacts, configure their pipelines, or debug 403 errors. So we
      built an AI-powered frontline support agent — a Google Gemini Gem — grounded entirely in our internal
      documentation and Fabric operational rules. Using GitHub Copilot and Confluence, we authored a comprehensive
      markdown knowledge base covering every JFrog workflow at WEX, then embedded it as the Gem''s system
      prompt with strict guardrails: enforce WEX-specific policies over generic JFrog answers, never hallucinate
      URLs, and always direct users to the correct self-service path.The result an 80%+ reduction in internal
      JFrog support tickets. Developers now get instant, accurate, policy-compliant answers — from OIDC
      setup to repository provisioning to troubleshooting pipeline failures — without waiting for a human.In
      this session, you''ll learn (1) how we architected Fabric to make JFrog administration scalable
      for a small platform team, (2) how we built and grounded the Gemini Gem with real operational knowledge,
      (3) the prompt engineering and guardrails that keep AI answers accurate and policy-safe, and (4)
      the measurable impact on developer experience and support load. Walk away with a playbook for combining
      JFrog platform automation with agentic AI support at enterprise scale.'
    evidence:
      url: https://www.linkedin.com/in/erik-englund-8298949b
      observed_at: '2026-10-24T08:45:24Z'
  - title: 'Scaling identity: How to migrate a large enterprise to Enterprise Managed Users (EMU)'
    venue: GitHub Universe 2025
    date: October 28, 2025
    description: GitHub Universe 2025Learn how WEX migrated thousands of developers to GitHub Enterprise
      Managed Users (EMU), integrating Azure Active Directory, SCIM provisioning, and automated repository
      access management. During the session, you'll also discover how WEX minimized disruption while building
      a secure, automated foundation for developer productivity at scale, resulting in measurable time
      and cost savings, reduced manual support, and an improved security posture. The team will share
      hard-earned lessons on scaling identity, cleaning up legacy access, and creating audit-ready workflows
      that streamline compliance and reduce operational overhead.
    evidence:
      url: https://www.linkedin.com/in/erik-englund-8298949b
      observed_at: '2026-10-24T08:45:24Z'
  - title: Git-Notes Your CI Process
    venue: Medium
    date: July 11, 2021
    description: Git has a little utilized feature known as Git Notes that allows you to attach meta-data
      to any commit without changing the original commit hash. This is perfect for us since we try to
      kick off a build on every commit and would like to know the result of those builds in-line with
      the original commits. Now, git-notes is not without its detractors, but with a little work we can
      utilize this feature to store build information for all builds within the Git Repository itself.
    evidence:
      url: https://www.linkedin.com/in/erik-englund-8298949b
      observed_at: '2026-10-24T08:45:24Z'
