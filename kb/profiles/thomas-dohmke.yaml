  - title: 'Test-driven development of embedded control systems: application in an automotive collision
      prevention system'
    venue: University of Glasgow
    date: June 26, 2008
    description: With test-driven development (TDD) new code is not written until an automated test has
      failed, and duplications of functions, tests, or simply code fragments are always removed. TDD can
      lead to a better design and a higher quality of the developed system, but to date it has mainly
      been applied to the development of traditional software systems such as payroll applications. The
      thesis describes the novel application of TDD to the development of embedded control systems using
      an automotive safety system for preventing collisions as an example.
    evidence:
      url: https://www.linkedin.com/in/ashtom
      observed_at: '2026-10-24T08:43:05Z'
  - title: Test-Driven Development of a PID Controller
    venue: IEEE
    date: May 1, 2007
    description: With test-driven development, developers don't write new code until an automated test
      has failed, and duplicate functions, tests, or code fragments are always removed. TDD can lead to
      better-designed, higher-quality systems. slUnit combines the features of the xUnit testing frameworks
      and the Simulink graphical programming language to apply TDD to control-system design. Development
      of a controller for a simplified vehicle system illustrates this approach.
    evidence:
      url: https://www.linkedin.com/in/ashtom
      observed_at: '2026-10-24T08:43:05Z'
  patents:
  - title: Method and Apparatus for Avoiding or Mitigating Vehicle Collisions
    number: US US20090037055 A1
    description: In a method and apparatus for collision avoidance or collision mitigation for a vehicle,
      an existing driving space between the vehicle and a potential collision object is detected. A first
      warning function and/or an information function is activated when a first threshold value is reached.
      A system intervention with autonomous partial braking combined with at least one further safety
      measure is activated when a second threshold value is reached.
    evidence:
      url: https://www.linkedin.com/in/ashtom
      observed_at: '2026-10-24T08:43:05Z'
  - title: Method and vehicle assistance system for preventing collisions or reducing the severity of
      a vehicle collision
    number: DE WO2006053652 A1
    description: 'The invention relates to a method for preventing collisions or reducing the severity
      of a vehicle collision with the following steps: detecting the velocity and direction of motion
      of the vehicle; detecting the position of objects in the surroundings of the vehicle; detecting
      the speed and the direction of motion of the objects relative to the vehicle; precalculating the
      future position of the objects relative to the vehicle; evaluating the present and future positions
      of the objects relative to the vehicle; outputting a warning to the driver and/or carrying out an
      automatic steering and/or braking intervention by means of a vehicle assistance system according
      to the evaluation in the event it has been determined according to the evaluation that a collision
      with the object is unavoidable without intervention by the system. The invention also relates to
      a vehicle assistance system for preventing collisions or reducing the severity of a vehicle collision.'
    evidence:
      url: https://www.linkedin.com/in/ashtom
      observed_at: '2026-10-24T08:43:05Z'
  - title: Method for asynchronous communication by means of an internet platform, and internet platform
    number: US US8457284 B2
    description: The invention relates to a method for asynchronous communication by means of an internet
      platform (2), wherein registered users of the internet platform (2) can receive mail by means of
      the internet platform (2), wherein the mail is transmitted for at least part of the postal path
      thereof in electronic form by means of the internet and the internet platform (2), and further relates
      to an internet platform (2). In order to provide the users (N) expanded communication capabilities
      and a greater level of comfort, according to the invention, one of a plurality of presettable transmission
      paths is preset by the users (N) on the internet platform (2), said paths including the transmission
      of the mail as a letter, as a fax, and as electronic mail, and the transmission of the mail to the
      users (N) is performed or initiated by the internet platform (2) according to each preset transmission
      path.
    evidence:
      url: https://www.linkedin.com/in/ashtom
      observed_at: '2026-10-24T08:43:05Z'
  - title: Method for avoiding a collision or for reducing the consequences of a collision and device
      for carrying out said method
    number: DE WO2006053655 A1
    description: The invention relates to a method for avoiding a collision or for reducing the consequences
      of a collision during a journey, over the course of which a motor vehicle (10) approaches an obstacle
      (20), in particular a preceding vehicle. According to said method, at least the relative speed (vrel)
      of the motor vehicle (10) is determined in relation to the obstacle (20), the time period that remains
      until the latest commencement of evasive action to avoid a collision is determined as the evasive
      time period (TTA) and action is taken to avoid the collision or reduce the consequences of a collision
      in accordance with the determined evasive time period (TTA). Said evasive time period (TTA) is calculated
      as the time period that is required to reduce the distance (s) between the motor vehicle (10) and
      the obstacle (20) at the current relative speed (vrel) to a limit distance (sA) that can be predefined
      in accordance with the relative speed (vrel) and the speed (vego) of the motor vehicle (10).
    evidence:
      url: https://www.linkedin.com/in/ashtom
      observed_at: '2026-10-24T08:43:05Z'
  - title: Method for determining and adapting a steering handle angle wheel turning angle characteristic
      curve
    number: DE WO2005085042 A1
    description: The invention relates to methods for determining and adapting a (28) steering handle
      angle-wheel turning angle characteristic curve consisting in determining the actual wheel turning
      angle(β) or a quantity (RO) defining said turning angle, in detecting an actual steering handle
      angle and in correcting existing characteristic curve (28) by co-ordinating the actual wheel turning
      angle (β) of the quantity (RO) defining said turning angle with the actual steering handle angle
      or the characteristic curve (28). Steering handle angle wheel turning angle is produced on the basis
      of several coordinations thereof. The thus produced or adjusted characteristic curve takes into
      account the co-ordination modifications during a motor vehicle service life.
    evidence:
      url: https://www.linkedin.com/in/ashtom
      observed_at: '2026-10-24T08:43:05Z'
  - title: Method for determining relative speed between two vehicles, involves receiving distance signal
      from distance sensor, where rear end of vehicle is provided at distance sensor transverse to travel
      direction of another vehicle
    number: DE DE102009002383 A1
    description: 'The method involves receiving a distance signal from a distance sensor (16). A rear
      end of a vehicle (14) is provided at distance sensor transverse to a travel direction (12) of another
      vehicle (10). The distance signal represents a distance of the former vehicle from the distance
      sensor. Another distance signal is obtained from another distance sensor (18). Another distance
      signal represents a distance of the former vehicle from another distance sensor. Independent claims
      are also included for the following: (1) a control device for the execution of the method; and (2)
      a computer program product with a program code.'
    evidence:
      url: https://www.linkedin.com/in/ashtom
      observed_at: '2026-10-24T08:43:05Z'
  - title: Method for identifying critical collision situations from the rear
    number: DE WO2006040032 A1
    description: The invention concerns a method for avoiding collision between a vehicle (1) and an object,
      in particular a vehicle (3) preceding the vehicle (1), or for reducing the consequences of the collision,
      which consists in detecting at least one quantity describing the movements of objects in the surroundings
      located downstream of the vehicle (1), in particular in the downstream traffic, and in triggering
      a driver alarm triggered when a predetermined alert condition is fulfilled. An assessment of the
      situation is performed at least based on the quantity/quantities detected, describing the movements
      of objects in the surroundings located downstream of the vehicle. A braking time (TTB) is determined
      relative to the situation assessment time, the driver having to brake completely at that particular
      time to avoid a collision from the rear, a driver alarm being triggered when the interval between
      the situation assessment time and the complete braking time, that is, the value of the braking time
      (TTB) determined relative to the situation assessment time, is lower than a first threshold. Thus
      traffic safety is enhanced.
    evidence:
      url: https://www.linkedin.com/in/ashtom
      observed_at: '2026-10-24T08:43:05Z'
  - title: Method for operating a braking assistance system in a vehicle
    number: DE WO2006053667 A1
    description: The invention relates to a method for operating a braking assistance system in a vehicle,
      enabling braking to be assisted when emergency braking occurs. According to the invention, a threshold
      (10) for a braking intervention by the brake assister is determined at least from the brake torque
      (11) and brake torque gradient (12) characteristics in order to decide between emergency braking
      and normal braking.
    evidence:
      url: https://www.linkedin.com/in/ashtom
      observed_at: '2026-10-24T08:43:05Z'
  - title: Method for operating a collision avoidance system of a vehicle and associated collision avoidance
      system
    number: DE WO2006053654 A1
    description: The invention relates to a method for operating a collision avoidance system of a vehicle,
      said system comprising means for detecting the existing gap between the vehicle and a potential
      collision partner, in addition to means for defining the time of a system intervention to avoid
      a collision. According to the invention, if defined threshold values of the system intervention
      are not met, said values having been defined using the means, for a first time (12), at which a
      collision (20) can be avoided by evasive action and for a second time (13), at which a braking manoeuvre
      must be initiated, a partial deceleration (10) is introduced for an actual system intervention.
      The invention also relates to a collision avoidance system of a vehicle.
    evidence:
      url: https://www.linkedin.com/in/ashtom
      observed_at: '2026-10-24T08:43:05Z'
  - title: Method for operating a collision avoidance system or collision sequence reducing system of
      a vehicle, and collision avoidance system or collision sequence reducing system
    number: DE WO2006072342 A1
    description: The invention relates to a method for operating a collision avoidance system of a collision
      sequence reducing system of a vehicle (10). An available driving area which is between the vehicle
      (10) and a potential collision object (11, 20) is detected and a first warning signal and/or information
      function is activated when a first threshold value (12) is reached. According to the invention,
      system intervention with autonomous partial braking combined with at least one additional safety
      measure is actuated when a second threshold value (13) is reached. The invention also relates to
      a collision avoidance system or collision sequence reducing system for a vehicle.
    evidence:
      url: https://www.linkedin.com/in/ashtom
      observed_at: '2026-10-24T08:43:05Z'
