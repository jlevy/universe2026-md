    title: COVID-19 HRCT Image Classifier
    detail: ➢ Developed and trained a highly accurate Convolutional Neural Network model utilizing high-resolution
      computed tomography lung scans to predict the probability of COVID-19 infection with an accuracy
      of 82.11%, F1-score of 82.25%, and AUC of 0.857➢ Achieved model's high accuracy by sampling 64 image
      slices from a total of 700+ slices per patient and applying a pre-trained 3D U-net (R-231) model
      for lung segmentation➢ Built the model using Keras with an input tensor of 164128*128 and Binary
      Cross-Entropy loss function to effectively avoid model overfitting
    evidence:
