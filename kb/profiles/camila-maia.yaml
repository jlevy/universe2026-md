  publications:
  - title: Adaptações em um HSM para homologação na ICP-Brasil
    date: '2012'
    description: A confiabilidade de uma ICP depende da segurança de suas chaves privadas. O HSM é um
      dispositivo que gerencia e protege chaves criptográficas, próprio para guardar as chaves privadas
      de uma ICP. HSMs também são utilizados em ICPs brasileiras. Para que um HSM possa guardar chaves
      privadas da ICP-Brasil, o dispositivo deve ser homologado pela ICP-Brasil. Este artigo descreve
      um conjunto de adaptações necessárias para que um HSM possa ser homologado na ICP-Brasil.
    evidence:
