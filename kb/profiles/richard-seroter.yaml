  publications:
  - title: Using Force.com Integration APIs to Connect Your Applications
    venue: Pluralsight
    date: March 9, 2016
    description: Salesforce.com continues grow in usage, and it's more important than ever to connect
      your applications to your cloud environment. In this course, we look at the various integration
      APIs that Salesforce offers. We'll go deep on the SOAP API, REST API, Bulk API, Streaming API, Outbound
      Messaging and Apex Callouts. Along the way, I'll help you decide when to use which API, and how
      to develop solutions based on each one.
    evidence:
      url: https://www.linkedin.com/in/seroter
      observed_at: '2026-10-24T08:15:08Z'
  - title: Amazon Web Services Databases in Depth
    venue: Pluralsight
    date: June 23, 2015
    description: AWS developers have a lot of different databases to choose from, and this course helps
      you learn how to use their relational database (Amazon RDS), NoSQL database (Dynamo DB), and data
      warehouse (Amazon Redshift). For each database, we look at how to provision it, what the costs are,
      how to scale it, how to handle failures, and how to administer it. By the end of it, you should
      be comfortable with when to use which type of database, and how to set them up successfully.
    evidence:
      url: https://www.linkedin.com/in/seroter
      observed_at: '2026-10-24T08:15:08Z'
  - title: Cloud Foundry for Developers
    venue: Pluralsight
    date: January 7, 2015
    description: Building, deploying and managing modern web applications? Cloud Foundry is a leading
      open source public/private Platform-as-a-Service (PaaS) for running container-based web apps. In
      this course, we look at everything you need to know to be a successful Cloud Foundry user. The course
      covers PaaS application best practices, Cloud Foundry architecture, deploying applications, scaling
      applications, gracefully handling application failures, and much more.
    evidence:
      url: https://www.linkedin.com/in/seroter
      observed_at: '2026-10-24T08:15:08Z'
  - title: 'DevOps: The Big Picture'
    venue: Pluralsight
    date: July 28, 2014
    description: DevOps has the potential to completely transform how an organization delivers technology
      services to its customers. But what does “DevOps” really mean? How can you get started on this transformation?
      What tools and technologies can assist in the adoption of a DevOps culture? This course looks at
      the core principles of DevOps, how to transform to a DevOps culture, and which technologies can
      help you along the way.
    evidence:
      url: https://www.linkedin.com/in/seroter
      observed_at: '2026-10-24T08:15:08Z'
  - title: Productivity Tips for the Busy Tech Professional
    venue: Pluralsight
    date: January 8, 2014
    description: A course that looks at how to introduce efficiency and strategic thinking into daily
      activities. Includes 17 tips dealing with time management, planning, building relationships, and
      more. Each tip looks at a myth about productivity, the reality of the situation, and a series of
      examples of the principle in action.
    evidence:
      url: https://www.linkedin.com/in/seroter
      observed_at: '2026-10-24T08:15:08Z'
  - title: Optimizing and Managing Distributed Systems on AWS
    venue: Pluralsight
    date: August 30, 2013
    description: A continuation of the previous course where we look at how to improve application performance
      while focusing on maintainability. Students introduce application monitoring to the system and see
      how to AutoScale based on performance metrics. Application deployment strategies are discussed and
      we see how to use AWS Elastic Beanstalk to quickly deploy and update application code. Then students
      focus on performance by introducing Content Delivery Networks (CDNs) and application cache to the
      solution. In each module, students learn about the core AWS technologies and best practices for
      each.
    evidence:
      url: https://www.linkedin.com/in/seroter
      observed_at: '2026-10-24T08:15:08Z'
  - title: Architecting Highly Available Systems on AWS
    venue: Pluralsight
    date: July 31, 2013
    description: A thorough walkthrough of how to build fault tolerance, resilient cloud systems on AWS.
      Students construct a solution made up of redundant storage in EBS, databases with RDS and DynamoDB,
      queues with SQS, compute with EC2, load balancing through ELB, and DNS via Route 53. Each individual
      module focuses on best practices and deployment guidance for deploying bullet-proof, secure cloud
      systems.
    evidence:
      url: https://www.linkedin.com/in/seroter
      observed_at: '2026-10-24T08:15:08Z'
  - title: Patterns of Cloud Integration
    venue: Pluralsight
    date: April 9, 2013
    description: This course looks at how to do application and data integration with cloud endpoints.
      I cover a wide range of technologies as I investigate patterns for remote procedure calls, asynchronous
      messaging, shared databases, and file transfers. We look at how to securely share information in
      scenarios featuring “ground to cloud”, “cloud to cloud” and “cloud to ground.” Technologies include
      Windows Azure, Force.com, Mulesoft Cloud Hub, Informatica Cloud, AWS, and more.
    evidence:
      url: https://www.linkedin.com/in/seroter
      observed_at: '2026-10-24T08:15:08Z'
  - title: Force.com for Developers
    venue: Pluralsight
    date: August 24, 2012
    description: In this course, I walk through the core capabilities of the popular platform that sits
      beneath Salesforce.com. We see how to configure the application and then customize it. In the configuration-oriented
      modules, I show you how to model data, build reports, apply security and invoke native SOAP/REST
      interfaces. In the customization-oriented modules, I highlight how to build custom Visualforce UI
      screens, write custom Apex code, and develop custom SOAP/REST services.
    evidence:
      url: https://www.linkedin.com/in/seroter
      observed_at: '2026-10-24T08:15:08Z'
  - title: AWS Developer Fundamentals
    venue: Pluralsight
    date: February 23, 2012
    description: In this course, I took a look at Amazon Web Services and how developers can use this
      cloud platform for building rich applications. I covered compute services (EC2), storage services
      (EBS, S3), database services (SimpleDB, RDS, DynamoDB), messaging services (SQS, SNS) and management
      services (Management Console, IAM, CloudFormation, Elastic Beanstalk). A key aspect of the course
      is that each technology is demonstrated first in the Management Console, then the native API, and
      finally in the .NET SDK. I did this so that course viewers could see all the ways to interact with
      each service.
    evidence:
      url: https://www.linkedin.com/in/seroter
      observed_at: '2026-10-24T08:15:08Z'
