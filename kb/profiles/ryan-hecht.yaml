  activities:
  - kind: project
    title: GitHub Copilot CLI
    detail: GitHub Copilot CLI brings AI-powered coding assistance directly to your command line, enabling
      you to build, debug, and understand code through natural language conversations. Powered by the
      same agentic harness as GitHub's Copilot coding agent, it provides intelligent assistance while
      staying deeply integrated with your GitHub workflow. · Jul 2025
    evidence:
      url: https://www.linkedin.com/in/ryanahecht
      observed_at: '2026-10-24T08:16:34Z'
  - kind: project
    title: Achievables - Open source Java library for specifying video game achievement-like "Achievables"
      complete with a Groovy-based programming language for defining them
    detail: A Java library that defines "Achievables," a system that can be used to define Achievements,
      Daily Challenges, Quests, and other things that players can "achieve" in a video game-like setting.This
      codebase also includes an extensible Groovy-based programming language called BIGAL (BigAl's Integrated
      Groovy Achievement Language) that allows you to define Achievables (with other metadata necessary
      to define an Achievement) in a human-readable and version-controllable format.We use Achievables
      on MCParks to power Daily Challenges and Achievements. · Jan 2024
    evidence:
      url: https://www.linkedin.com/in/ryanahecht
      observed_at: '2026-10-24T08:16:34Z'
  - kind: project
    title: ShowScript - Open source programming language to scheudule and program commands to be run at
      specified timecodes
    detail: 'ShowScript is a Spigot plugin that defines a programming language (v2 is backed by YAML and
      v3 is a Groovy DSL) that allows console commands and other actions to be scheduled to run at specified
      timecodes. A file that defines a series of timecodes and actions is called a "Show." The technicians
      on MCParks use ShowScript to make our fireworks shows, theatre attractions, ambient effects, and
      to schedule effects to run on our ridesFeatures include:- Turn miles of Command Blocks into just
      one command that''s easy to share, extend, and run!- A simple YAML schema enabling beginners to
      easily schedule any commands to run at specified times- A rich Groovy DSL that brings all the functionality
      of the YAML schema and allows you to add programming constructs like conditionals, loops, functions,
      etc- Add arguments to your shows to make them reusable in different situations- Seamlessly interact
      with server constructs like Players, Entitys Locations, and more!- Set global variables and export
      data and functions to share data between shows- Access any Java class loaded in your Classpath for
      easily extending functionality to custom plugins- Region Shows: Have a show loop ambiently as long
      as there are players in a WorldGuard region · Jan 2015'
    evidence:
      url: https://www.linkedin.com/in/ryanahecht
      observed_at: '2026-10-24T08:16:34Z'
  - kind: project
    title: 'BrYOUno: Dorm Room Personal Assistant'
    detail: Digital voice-activated assistant powered by Python, running on a Raspberry Pi. Communicates
      via Bluetooth to an Arduino to automate my lightswitch, and performs a variety of other tasks, such
      as managing my Todoist tasks, playing music via Google Play Music, and more. · Sep 2016
    evidence:
      url: https://www.linkedin.com/in/ryanahecht
      observed_at: '2026-10-24T08:16:34Z'
  - kind: project
    title: 'Cardstone: The Shattering'
    detail: 'Together with three other students in Brown University''s Spring 2017 Introduction to Software
      Engineering course, created a digital card game inspired by Hearthstone and Magic: The Gathering.The
      game''s backend is powered by a Spark/Jetty webserver, with frontend user interface being primarily
      created with FTL, save for the game screen itself, which was loving crafted with CSS and ES6 galore
      (check out https://pbs.twimg.com/media/C_V4HzUXsAE3RmM.jpg for a preview of the game board). The
      frontend and backend communicate through WebSockets, powered by the API in Spark.The website has
      features such as lobbies, spectating, interactive deck building, replays of past games, and a tutorial
      to guide new users through the operation of the site.Design techniques were used to ensure that
      we can easily add new cards to the library with a variety of effects that "bend" the rules of the
      game.Source code: https://github.com/RyanHecht/cardstone · Feb 2017'
    evidence:
      url: https://www.linkedin.com/in/ryanahecht
      observed_at: '2026-10-24T08:16:34Z'
  - kind: project
    title: Websocket powered audio system to play music based on events on a Minecraft server
    detail: A Minecraft server proxy runs a Websocket server, and clients connect via the MCParks website
      in a web browser. Upon connecting, they are prompted to enter their Minecraft username. Audio is
      sent to them based on events that occur on the Minecraft server. Authentic in-park audio loops,
      show soundtracks, and ride effects are played in real time (and loops/shows sync with other users).
      · May 2016
    evidence:
      url: https://www.linkedin.com/in/ryanahecht
      observed_at: '2026-10-24T08:16:34Z'
  - kind: project
    title: Codebase that will be used to create MMO elements in a Minecraft server
    detail: Implementing the software engineering skills I've learned in the classroom, I've begun a multi-layered
      codebase that will be used to create MMO elements on MCParks.The codebase is used in two pieces
      of software--a Spigot plugin, and a BungeeCord plugin. Communication is accomplished via the Bukkit-Bungee
      Plugin Messaging API, with a custom wrapper to abstract away low level code.Data persistence is
      accomplished via a MySQL database, connection to which is handled by the Hikari connection pool.
      Only the BungeeCord plugin has access to the database, so a client-server relationship is formed
      between Spigot and BungeeCord.Using Java 8's embedded JavaScrip scripting API, I can run arbitrary
      code on the BungeeCord plugin from Spigot at runtime.This code base has been implemented to handle
      the server's kicks, bans, teleportation, Cast Member two-step authentication, and a basic Attraction
      Manager. Attractions are stored in the database, and a GUI is created in the form of a MagicBand
      to browse the information contained in the database.
    evidence:
      url: https://www.linkedin.com/in/ryanahecht
      observed_at: '2026-10-24T08:16:34Z'
