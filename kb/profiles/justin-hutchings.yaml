  - title: Bidi Extension for Connected Devices
    number: US 20130067120
    date: March 13, 2013
    description: Bidirectional (bidi) extension techniques for USB and/or other similar busses/connections
      are described in which an interface is provided to enable bidirectional communication with connected
      devices. The interface may be implemented as an operating system component to handle bidi communication
      for devices from multiple different independent hardware vendors (IHVs). Device drivers for different
      devices can be configured to include extension files in accordance with an established schema for
      bidi communication. The extension files describe supported bidi attributes, capabilities of the
      device, and how to make calls into the device. The interface operates to detect the extension files
      and set-up a corresponding device for bidi communication. Applications then interact through the
      interface to access, retrieve, and set configuration and status data for connected devices. The
      use of extension files enable creation of architecture independent devices drivers that can be used
      across different platforms with substantially no changes.
    evidence:
      url: https://www.linkedin.com/in/hutchingsjustin
      observed_at: '2026-10-24T08:44:35Z'
  - title: Platform Neutral Device Protocols
    number: US 20130346654
    date: June 22, 2012
    description: Platform neutral device protocol techniques are described in which functionality to customize
      device interactions through communication busses is made accessible through platform independent
      script-based infrastructure. Functionality provided by an operating system to manipulate standard
      protocols of a communication bus used to interact with a connected device is exposed as script-based
      objects. Script-based protocol definition files associated with connected device may be employed
      to customize device protocols for the communications using the functionality exposed through the
      script-based objects. A computing device may acquire a protocol definition file for a particular
      device in various ways and host the protocol definition file via a suitable run-time platform. Requests
      for interaction with the particular device may then be handled using the custom protocols defined
      by the hosted protocol definition file.
    evidence:
      url: https://www.linkedin.com/in/hutchingsjustin
      observed_at: '2026-10-24T08:44:35Z'
  - title: Printing using a Platform-Independent Driver
    number: US 20120307288
    date: May 31, 2011
    description: In one or more embodiments, a print server can publish, to client devices, capabilities
      and configurations of one or more print devices utilizing a device-independent "personality." Client
      devices can then use an associated device-independent print driver to select print job settings
      and record print job content for a particular print job, in a device-independent format, that is
      then to be sent to the print server. The print server can then process the device-independent format
      that describes the print job, and convert the print job into a print device-specific format that
      can be consumed by a particular specific print device. In at least some embodiments, the client
      device can cause a print job to be printed on a print device, via a print server, without downloading,
      utilizing or otherwise accessing a print driver that is specific to the print device.
    evidence:
      url: https://www.linkedin.com/in/hutchingsjustin
      observed_at: '2026-10-24T08:44:35Z'
  - title: Multi-layered printer driver model
    number: US 20120147416
    date: December 14, 2010
    description: Embodiments of the invention provide a layered printer driver model in which, at the
      "bottom layer," a rendering component provides rendering functionality to format information constituting
      a print job initiated according to a page description language that a printer device is designed
      to process, and one or more other components that provide configuration and/or user experience functionality
      may "sit atop" the bottom layer. Any or all of these higher-level components may support not just
      a single printer device, but a class of printer devices defined by one or more shared characteristics.
    evidence:
      url: https://www.linkedin.com/in/hutchingsjustin
      observed_at: '2026-10-24T08:44:35Z'
  - title: Multisource, adaptive printer configuration
    number: US 20120147414
    date: December 13, 2010
    description: Some embodiments of the invention provide techniques whereby a printer driver may be
      modified and supplemented over time. For example, a framework may be provided which enables a printer
      driver's functionality to be supplemented over time to include new and/or enhanced features, such
      as features relating to the manner in which the capabilities of a printer are configured, print
      settings are manipulated, information is presented to users, print-related system events are handled,
      etc. In some embodiments, one or more components (which may be included in a print subsystem provided
      by an operating system of a computing device, in a printer driver, and/or some other system element)
      may be configured to automatically seek and acquire configuration data from any of various sources,
      including the printer device, one or more online sources, and/or other sources.
    evidence:
      url: https://www.linkedin.com/in/hutchingsjustin
      observed_at: '2026-10-24T08:44:35Z'
  - title: Printer driver and application decoupling using event centric registration model
    number: US 20120147415
    date: December 13, 2010
    description: Some embodiments of the invention provide a printer user interface (UI) component configured
      to handle presentation of information to a user during printing operations. The printer UI component
      may de-couple the rendering and configuration functionality provided by a printer driver from the
      presentation of information to end users, thereby reducing the risk that applications may crash
      or hang due to printer driver malfunction. In some embodiments, a registry of events upon which
      information should be presented to the user is established, and the printer UI component may be
      registered for some or all of these events, so that when the specified events occur the printer
      UI component may be invoked to cause information to be presented to the user.
    evidence:
      url: https://www.linkedin.com/in/hutchingsjustin
      observed_at: '2026-10-24T08:44:35Z'
