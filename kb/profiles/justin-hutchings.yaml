  patents:
  - title: Device-described natural language control
    number: US US10229678B2
    date: March 12, 2019
    description: A remote device has an associated natural language description that includes a record
      of commands supported by the remote device. This record of commands includes command names, the
      command functions to which those names correspond, and natural language strings that are the natural
      language words or phrases that correspond to the command. A computing device includes a device control
      module that obtains the natural language description for the remote device and provides the natural
      language strings to a natural language assistant on the computing device. The natural language assistant
      monitors the natural language inputs to the computing device, and notifies the device control module
      when a natural language input matches one of the natural language strings. The device control module
      uses the natural language description to determine the command name that corresponds to the matching
      natural language string, and communicates the command name to the remote device.
    evidence:
      url: https://www.linkedin.com/in/hutchingsjustin
      observed_at: '2026-10-24T08:44:35Z'
  - title: Graphics primitive and color channels
    number: US 9659387
    date: May 23, 2017
    description: Graphics primitive and color channel techniques are described. In one or more implementations,
      image data is processed by a computing device to form a plurality of pixels and corresponding one
      or more color channels usable to define a color for a respective said pixel. A graphics primitive
      type is identified by the computing device associated with one or more of the pixels in the processed
      image data. The graphics primitive type is assigned by the computing device to the one or more pixels
      using at least one color channel.
    url: https://patents.google.com/patent/US9659387
    evidence:
      url: https://www.linkedin.com/in/hutchingsjustin
      observed_at: '2026-10-24T08:44:35Z'
  - title: Synchronizing device association data among computing devices
    number: US 9311109
    date: April 12, 2016
    description: Device association data for peripheral devices, which is data used to connect to the
      peripheral devices, is maintained and synchronized across multiple computing devices associated
      with a user account on a service. When a new peripheral device is associated with a computing device,
      device association data for the new peripheral device is added to the computing device. The device
      association data for the new peripheral device is also sent to the service, which provides the device
      association to the other computing devices from which the user logs into his or her account, and
      those other computing devices in turn automatically associate themselves with the peripheral device.
      Device use data describing how a user desires to use the peripheral device on one computing device,
      as well as changes to the device association data on one computing device, can similarly be synchronized
      across the multiple computing devices.
    url: https://patents.google.com/patent/US9311109
    evidence:
      url: https://www.linkedin.com/in/hutchingsjustin
      observed_at: '2026-10-24T08:44:35Z'
