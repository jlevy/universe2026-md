  publications:
  - title: Uni-Modal Sensing using Embedded Weight Sensors for Fully-Autonomous Store Checkout
    venue: CPS-IoT Week 2020
    date: March 18, 2020
    description: Cashierless automated store checkout is becoming more common and can save time for consumers
      and reduce costs for stores. Previous state-of-the-art for cashierless systems use RFID tagging
      on items and require human intervention to count inventory, disqualifying them as fully-automated
      systems. While previous work by Ruiz, et al. has demonstrated over 90% accuracy in a multi-modal
      sensing approach through combined weight sensing and object classification techniques, there is
      still a gap in accuracy before fully autonomous store checkout is possible. This research proposes
      a uni-modal approach using only weight sensing techniques, foregoing the use of object classification.
      We also make the same 4 assumptions on customer behavior as Ruiz, et al.’s approach, reducing the
      problem to systematically determining which items are removed by customers through the weight sensory
      data of each shelf.
    evidence:
      url: https://www.linkedin.com/in/nishnha
      observed_at: '2026-10-24T08:15:32Z'
  - title: In-situ Water-Quality Monitoring System through Ultraviolet Sensing using off-the-shelf Cameras
    venue: MobiCom '19
    date: October 21, 2019
    description: Contaminants can leach into drinking water in transport from water-treatment facilities
      or treated water storage to consumer taps. In this work, we design a low-cost mobile system that
      can use off-the-shelf web-cameras as an ultraviolet (UV) spectrometer. We posit to analyze and categorize
      impurities present in water by using fundamental image processing and computer vision techniques.
      In this poster paper, we qualitatively and quantitatively analyze the ultraviolet absorption and
      scattering through images captured of an UV light source (at 385nm wavelength) transmitted through
      de-ionized water containing varying contaminants and at different concentrations. We particularly
      explore the tests for lead, arsenic, table salt, charcoal, and coconut oil, and run a pilot-study
      on ground-truth analysis of tap water from five counties around Atlanta, Georgia, USA.
    evidence:
      url: https://www.linkedin.com/in/nishnha
      observed_at: '2026-10-24T08:15:32Z'
  - title: 'Oral: A Mobile and Low-Cost Spectrophotometry-Based Water-Quality Monitoring System Using
      Off-the-Shelf Cameras'
    venue: Georgia State University
    date: Apr 2019
    description: By designing affordable and portable spectrophotometry equipment, Nishant is revolutionizing
      the way that water quality can be tested. Incorporating light sensing and computing enables users
      to test impurities in water, specifically Lead, Arsenic, and Oil in water, opening the doors to
      a new era of water quality awareness and optimization.
    evidence:
