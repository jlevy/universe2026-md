      web application technical security controls and also provides developers with a list of requirements
      for secure development.The primary aim of the OWASP Application Security Verification Standard (ASVS)
      Project is to normalize the range in the coverage and level of rigor available in the market when
      it comes to performing Web application security verification using a commercially-workable open
      standard · May 2014
