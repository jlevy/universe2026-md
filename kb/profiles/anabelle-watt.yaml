    title: MSc Dissertation
    detail: This project aims to enhance the project allocation process by integrating social choice theory
      to better align student and supervisor preferences with available projects. Addressing inefficiencies
      and fairness, the study will evaluate various preference elicitation methods and advanced algorithms
      through experiments using both real and synthetic datasets. Outcomes are expected to not only benefit
      academic settings but also extend to other sectors like healthcare and corporate environments, potentially
      transforming how entities approach and implement matching systems. This interdisciplinary approach
      promises to significantly advance the understanding and application of project allocation, ensuring
      more efficient and fair results. · Apr 2024
