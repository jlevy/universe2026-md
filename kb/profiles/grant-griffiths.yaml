  patents:
  - title: Controlling Public Access Of Resources In A Secure Distributed Storage System
    number: '11531467'
    date: December 20, 2022
    description: A method for controlling public access of resources in a secure distributed storage system
      using an API level model. A request to access a volume is checked for authentication. If the request
      does not include an authentication token ID, a guest role is created and assigned to the requestor.
      The guest role can only access public volumes or owned volumes that specifically allow public access.
      The guest role can be updated using API management.
