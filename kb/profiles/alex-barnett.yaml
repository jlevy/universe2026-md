  patents:
  - title: OUT OF BAND DATA AUGMENTATION
    number: US 7958489
    date: June 7, 2011
    description: Collections of data, such as executable code or information in a word document, are conventionally
      modified directly. However, in some instances it is not possible or desirable to directly change
      data. The invention is a mechanism for out-of-band augmentation that stores data separately from
      the original data and then applies one or more augmentations to the data when it is requested. Claims
      are directed to an interface that acquires data and a collections of augmentations and an application
      that applies the augmentations to the data and returns the result.
    url: https://patents.google.com/patent/US7958489
    evidence:
      url: https://www.linkedin.com/in/alexbarnett
      observed_at: '2026-10-24T08:42:12Z'
  - title: REST FOR ENTITIES
    number: US 20080201338
    date: August 21, 2008
    description: The claimed subject matter provides a representational state transfer (REST) interface
      over a data store characterized by an entity data model (EDM) architecture. Such characterization
      can be presented by way of an Entity Framework that can transform data characterized in one manner
      at a relational database into an EDM characterization that can further be exposed to an external
      process or device. A REST interface over EDM stores can provide an end-to-end framework to expose
      data, modeled in a highly-expressive fashion, to the Internet or a web-scale intranet.
    evidence:
      url: https://www.linkedin.com/in/alexbarnett
      observed_at: '2026-10-24T08:42:12Z'
  - title: LIVE ENTITIES INTERNET STORE SERVICE
    number: US 20080201234
    date: August 1, 2008
    description: The claimed subject matter provides for an online, Internet-class service that can correlate
      between an application interface utilizing a highly expressive, EDM conceptual format and a data
      store structured in an efficient, highly scalable storage format. Such a service can include components
      that map between an EDM schema and a data structure format. Additionally, a query reply can include
      data presented with a payload format distinct from an EDM query format.
    evidence:
      url: https://www.linkedin.com/in/alexbarnett
      observed_at: '2026-10-24T08:42:12Z'
