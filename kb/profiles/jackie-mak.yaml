  publications:
  - title: Defending Against API Abuse
    venue: KPMG Insights
    date: December 31, 2024
    description: Application Programming Interfaces (APIs) are critical for enabling various web applications
      to communicate and share data seamlessly, but they have also become significant targets for cyber-attacks.
      Understanding API abuse and recognizing its threat is crucial for businesses.
    evidence:
      url: https://www.linkedin.com/in/jackie-mak
      observed_at: '2026-10-24T08:45:24Z'
  - title: Unlocking the Power of GitHub Actions for Streamlined Governance
    venue: KPMG Insights
    date: September 20, 2024
    description: Dive deep into how organizations today can leverage GitHub Actions to bolster security
      within their source code management.
    evidence:
      url: https://www.linkedin.com/in/jackie-mak
      observed_at: '2026-10-24T08:45:24Z'
  - title: Code Signing in GitHub
    venue: KPMG Insights
    date: August 2, 2024
    description: The software that powers enterprises' innovations, products, and services today has established
      itself as one of the top assets for businesses, increasing the importance of taking appropriate
      measures to secure and govern source code repositories. With the growing adoption of AI-powered
      source code management platforms like GitHub, it's essential to review the code repository security
      features to reduce the likelihood and impact of these crown jewels being compromised.
    evidence:
      url: https://www.linkedin.com/in/jackie-mak
      observed_at: '2026-10-24T08:45:24Z'
  - title: How Automakers Can Inspire Trust in their Software
    venue: KPMG Insights
    date: July 29, 2024
    description: In an era of connected vehicles, automakers must prioritize cybersecurity. By becoming
      CVE Numbering Authorities (CNAs), they can manage vulnerability disclosures, collaborate with the
      cybersecurity community, comply with regulations, and gain a competitive edge.
    evidence:
      url: https://www.linkedin.com/in/jackie-mak
      observed_at: '2026-10-24T08:45:24Z'
  - title: Security Monitoring in GitHub
    venue: KPMG Insights
    date: June 20, 2024
    description: Over the years, SCM platforms have increasingly become of interest to malicious actors
      who seek to exploit vulnerabilities and gain unauthorized access to a company's intellectual property
      or sensitive information. When a breach occurs, SCM logs can be an essential tool for determining
      the scope of the attack, assessing the damage, and tracing the source of the intrusion back to its
      origin.
    evidence:
      url: https://www.linkedin.com/in/jackie-mak
      observed_at: '2026-10-24T08:45:24Z'
  - title: Elevating Your AppSec Program with Metrics
    venue: KPMG Insights
    date: November 30, 2023
    description: AppSec metrics should be top of mind for organizations looking to secure their Software
      Development Lifecycle (SDLC). Metrics play a pivotal role in evaluating, improving, and maintaining
      an organization's security posture, demonstrating compliance, driving informed decisions, and fostering
      a culture of security awareness. Organizations can proactively safeguard their applications from
      cyber threats by assessing and monitoring key security indicators and embracing metrics as an essential
      part of their AppSec programs.
    evidence:
      url: https://www.linkedin.com/in/jackie-mak
      observed_at: '2026-10-24T08:45:24Z'
  - title: Remediating Vulnerabilities at the Source
    venue: KPMG Insights
    date: November 30, 2023
    description: Today’s organizations struggle to keep their vulnerability management programs above
      the consistent waves of new threats. Alert prioritization and remediation are areas where companies
      search for creative solutions to get ahead of the never-ending game of vulnerability whack-a-mole.
    evidence:
      url: https://www.linkedin.com/in/jackie-mak
      observed_at: '2026-10-24T08:45:24Z'
  - title: The False Positive Conundrum
    venue: KPMG Insights
    date: November 30, 2023
    description: In today's rapidly evolving digital landscape, false positive alerts have emerged as
      a persistent challenge that organizations and security teams grapple with in their application security
      journey. These erroneous warnings not only disrupt the workflow of security professionals but also,
      more critically, divert their attention and resources away from genuine threats. However, by implementing
      these strategies, security teams can focus on genuine threats and respond effectively.
    evidence:
      url: https://www.linkedin.com/in/jackie-mak
      observed_at: '2026-10-24T08:45:24Z'
  - title: Bringing Auditors to a DevOps World
    venue: Reality Check
    date: October 7, 2022
    description: Explore the characteristics that make up Automated Governance in DevOps, as well as the
      short-term and long-term activities to consider to begin your journey toward Automated Governance.
    evidence:
      url: https://www.linkedin.com/in/jackie-mak
      observed_at: '2026-10-24T08:45:24Z'
  - title: Adopting Automated Governance
    venue: Reality Check
    date: September 30, 2022
    description: Understanding how to adopt and implement an Automated Governance framework may be vital
      for organizations that wish to have a trustworthy, repeatable approach to build, protect, and deliver
      their products and services.
