  - title: 'The Road to Modern Delivery: Low code development, market speed, and the Future of IT'
    venue: KPMG
    date: August 21, 2020
    description: We hear a lot of CIO interest in adopting market speed operating models, coupled with
      questions about next steps to get there. For those seeking to rapidly modernize their IT estate
      to support digital transformation, while at the same time remaining cost competitive, the challenges
      are real. Enter low code application methodology, an accelerator that offers CIOs an alternative
      option, as they consider ways to replatform hundreds or even thousands of custom or legacy applications
      to be digitally native.
    evidence:
      url: https://www.linkedin.com/in/james-williams-0352b5
      observed_at: '2026-10-24T08:45:51Z'
  - title: The Hybrid Cloud Survival Kit
    venue: KPMG
    date: Dec 2017
    description: IT organizations can vastly improve hybrid cloud performance even before they must invest
      in the full transformation of their technology operations to support multiple cloud delivery models.Discover
      how to establish a near-term strategy for managing hybrid cloud delivery that allows organizations
      to better realize the benefits of hybrid cloud today while helping IT remain relevant through the
      technology and marketplace changes to come.
