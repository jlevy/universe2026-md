  publications:
  - title: 'Social Norms and Selectivity: Effects of Norms of Open-Mindedness on Unbiased Content Selection
      and Affective Polarization'
    venue: International Communication Association
    date: May 2018
    description: Given the polarizing effects of exposure to like-minded political information and the
      alleged societal benefits of exposure to diverse and dissimilar political perspectives, this study
      examines how to promote more unbiased content selection and thereby minimize affective polarization.
      We focus on social norms promoting open-mindedness. Using an online experiment on a systematic sample
      of American partisans (N = 389), we demonstrate that highlighting the social norm of open-mindedness
      can promote greater attention to balanced news about divisive political issues than highlighting
      close-mindedness and than not offering any information about social norms. It does not, however,
      influence counter-attitudinal exposure. Also, contrary to expectations, exposure to balanced news
      does not lower affective polarization toward the political out-group. Results also show that highlighting
      close-mindedness tends to encourage attention to pro-attitudinal news among Trump supporters. Theoretical
      and practical implications for an informed citizenship in an era of abundant media choice are discussed.
    evidence:
      url: https://www.linkedin.com/in/timrogers1
      observed_at: '2026-10-24T08:15:13Z'
