  publications:
  - title: 'DevOps Tools for Java Developers: Best Practices from Source Code to Production Containers'
    venue: O'Reilly
    date: May 1, 2021
    description: With the rise of DevOps, low-cost cloud computing, and container technologies, the way
      Java developers approach development today has changed dramatically. This practical guide helps
      you take advantage of microservices, serverless, and cloud-native technologies using the latest
      DevOps techniques to simplify your build process and create hyperproductive teams.Stephen Chin,
      Baruch Sadogursky, Ixchel Ruiz, and Melissa McKay help you evaluate an array of options. The list
      includes source control with Git, build declaration with Maven and Gradle, CI/CD with CircleCI,
      package management with Artifactory, containerization with Docker and Kubernetes, and much more.
      Whether you're building applications with Jakarta EE, Spring Boot, Dropwizard, MicroProfile, Micronaut,
      or Quarkus, this comprehensive guide has you covered.
    evidence:
      url: https://www.linkedin.com/in/jbaruch
      observed_at: '2026-10-24T08:11:36Z'
  - title: 'Liquid Software: How to Achieve Trusted Continuous Updates in the DevOps World'
    date: May 1, 2018
    description: Software affects everything in our lives.Imagine that software could be constantly updated
      without our involvement! No need to figure out hardware specifications. Nothing to interrupt our
      digital activities. No waiting for lengthy downloads and reboots. What if it all just happened in
      the background, and we could simply enjoy the benefits?Liquid Software explores a future in which
      developers code high-quality applications that securely flow to end-users with zero downtime. The
      authors bring insights from their more than 50 years of collective experience in building software
      in modern development environments. They explain that what sounds like Software Utopia is possible
      and practical!We’re at the dawn of the next great leap forward in computing – the achievement of
      continuous software updates. The Liquid Software revolution has begun!
    evidence:
      url: https://www.linkedin.com/in/jbaruch
      observed_at: '2026-10-24T08:11:36Z'
  - title: Spring in a Nutshell
    venue: O'Reilly Media
    description: The most complete reference available for the Spring 3.x framework, Spring in a Nutshell
      provides all of the details you need to configure and build lightweight enterprise applications
      on the Java platform -- ideal whether you're new to Spring or familiar with previous versions of
