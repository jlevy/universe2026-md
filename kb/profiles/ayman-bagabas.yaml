  publications:
  - title: A Methodological Framework for Validating ZKP Authentication Process
    venue: IEEE HONET 2020
    date: December 14, 2020
    description: The Internet of Things (IoT) is completely transforming the way network-connected devices
      are made. Manufacturers and intelligent transportation systems are using thousands of IoT devices
      and machine-to-machine communication to drive industrial automation. Existing access control schemes
      for IoT authentication fail to support user anonymity. They rely on the surrendering of the device/user
      authentication parameters to the trusted server, which hence can be utilized by the IoT infrastructure
      to track users' behavioral patterns. Furthermore, existing access control mechanisms lack the support
      of run-time integrity assessment capabilities that are used to verify the authenticity of an authentication
      process during execution. This paper presents a parametrized crypto-based privacy-preserving authentication
      protocol that support anonymity, it is based on Zero Knowledge Proof (ZKP). Without the loss of
      anonymity, a methodological framework for bootstrapping a parametrized authentication process's
      integrity is introduced herein. We show that run-time integrity assessment of an authentication
      process running on an IoT device can be achieved through the utilization of the IoT device's physical
      characteristics, specifically energy consumption and computation time. Behavioral patterns based
      on the device's power/energy consumption for the ZKP-based protocol were captured and recorded during
      this effort. In addition, fine-grained behavioral patterns that capture the authentication protocol's
      processing time were collected and analyzed. To validate the proposed scheme, it was fully implemented
      and deployed on an IoT testbed. We have tested the performance of the proposed scheme in terms of
      power consumption and computation time.
    evidence:
      url: https://www.linkedin.com/in/aymanbagabas
      observed_at: '2026-10-24T08:11:38Z'
  - title: Configurable Anonymous Authentication Schemes For The Internet of Things (IoT)
    venue: 2019 IEEE International Conference on RFID (RFID)
    date: February 4, 2019
    description: The Internet of Things (IoT) has revolutionized the way of how pervasive computing devices
      communicate and disseminate information over the global network. A plethora of user data is collected
      and logged daily into cloud-based servers. Such data can be analyzed by the IoT infrastructure to
      capture users' behaviors (e.g. users' location, tagging of smart home occupancy). This brings a
      new set of security challenges, specifically user anonymity. Existing access control and authentication
      technologies failed to support user anonymity. They relied on the surrendering of the device/user
      authentication parameters to the trusted server, which hence could be utilized by the IoT infrastructure
      to track users' behavioral patterns. This paper, presents two novel configurable privacy-preserving
      authentication schemes. User anonymity capabilities were incorporated into our proposed authentication
      schemes through the implementation of two crypto-based approaches (i) Zero Knowledge Proof (ZKP)
      and (ii) Verifiable Common Secret Encoding (VCSE). We consider a user-oriented approach when determining
      user anonymity. The proposed authentication schemes are dynamically capable of supporting various
      levels of user privacy based on the user preferences. To validate the two schemes, they were fully
      implemented and deployed on an IoT testbed. We have tested the performance of each proposed schemes
      in terms of power consumption and computation time. Based on our performance evaluation results,
      the proposed ZKP-based approach provides better performance compared to the VCSE-based approach.
    evidence:
      url: https://www.linkedin.com/in/aymanbagabas
      observed_at: '2026-10-24T08:11:38Z'
