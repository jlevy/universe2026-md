  publications:
  - title: 'Android Forensics: Investigation, Analysis and Mobile Security for Google Android'
    venue: Syngress
    date: May 28, 2011
    description: Android is now the world's most popular mobile device platform and still growing at an
      astonishing rate. Android Forensics provides a thorough review of the Android platform, including
      the core hardware and software components, file systems and data structures, data security considerations,
      a detailed review of forensic acquisition techniques and strategies for the subsequent analysis
      required. A heavy emphasis on open source tools and step-by-step examples are a primary focus on
      this book.* Learn techniques to forensically acquire Android devices* Includes information about
      Android applications needed for forensics investigations* Entire chapter focused on Android Device,
      Data and App Security, which can assist not only forensic investigators but also for app developers
      and IT security managers
    evidence:
      url: https://www.linkedin.com/in/andrewhoog
      observed_at: '2026-10-24T08:44:03Z'
  - title: 'iPhone and iOS Forensics: Investigation, Analysis and Mobile Security for Apple iPhone, iPad
      and iOS Devices'
    venue: Syngress
    date: May 28, 2011
    description: This book takes an in-depth look at methods and processes that analyze the iPhone/iPad
      in an official legal manner. The following topics are covered:* An overview of various Apple devices
      and their features/functions* Review of the data and file types stored on these devices* iPhone/iPad
      data security* Forensic imaging process (backup, logical, and physical)* Analysis of default and
      third party applications, with a heavy emphasis on the use of open source tools
    evidence:
