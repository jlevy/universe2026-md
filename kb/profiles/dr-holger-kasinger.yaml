  publications:
  - title: Design and Operation of Efficient Self-Organizing Systems
    venue: Universität Augsburg
    date: July 8, 2011
    description: 'At the beginning of this 21st century, companies are faced with two key challenges with
      regard to their IT systems: first, the increasing complexity of IT systems gives rise to escalating
      operational expenditures for their administration and maintenance. Second, the intensifying, worldwide
      competition in all markets requires IT systems providing more agility, flexibility, scalability,
      robustness, and adaptivity in tackling daily businesses. Consequently, companies call for IT solutions
      with a high degree of autonomy - in order to manage themselves - as well as a high degree of decentralization
      - in order to provide the required, beneficial properties. Self-organizing emergent systems are
      generally acknowledged as a potential solution able to cover both of these requirements. They consist
      of many, simple elements (e.g. agents, servers, mobile devices, or robots), which have only partial
      or even no global system knowledge and make their decisions solely based on locally available information.
      The global coherent system behavior is achieved only by means of the local actions and interactions
      between the elements, each unaware of the system''s goals. The problem-solving power of a self-organizing
      emergent system hence mainly resides in the interactions between its elements instead of the internal
      reasoning of individual elements. However, there exist several problems and challenges, which hinder
      the acceptance of self-organizing emergent systems by industry. This thesis tackles two of them:
      first, the design of efficient self-organizing emergent systems today is too complex, time-consuming,
      and costly. Second, an acceptable efficiency of self-organizing emergent systems during the operation
      cannot be guaranteed for all situations. This thesis presents several artifacts that on the one
      hand simplify the design of effective as well as efficient self-organizing emergent systems and
      on the other hand facilitate their efficient operation even in unforeseeable situations.'
    evidence:
      url: https://www.linkedin.com/in/holger-kasinger
