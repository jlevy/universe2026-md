  publications:
  - title: Practical MLOps
    venue: O'Reilly
    date: February 1, 2021
    description: Getting your models into production is the fundamental challenge of machine learning.
      MLOps offers a set of proven principles aimed at solving this problem in a reliable and automated
      way. This insightful guide takes you through what MLOps is (and how it differs from DevOps) and
      shows you how to put it into practice to operationalize your machine learning models.Current and
      aspiring machine learning engineers--or anyone familiar with data science and Python--will build
      a foundation in MLOps tools and methods (along with AutoML and monitoring and logging), then learn
      how to implement them in AWS, Microsoft Azure, and Google Cloud. The faster you deliver a machine
      learning system that works, the faster you can focus on the business problems you're trying to crack.
      This book gives you a head start.
    evidence:
      url: https://www.linkedin.com/in/alfredodeza
      observed_at: '2026-10-24T08:42:58Z'
  - title: Operationalizing Machine Learning with Azure
    venue: Udacity
    date: October 1, 2020
    description: In this program, students will enhance their skills by building and deploying sophisticated
      machine learning solutions using popular open source tools and frameworks, and gain practical experience
      running complex machine learning tasks using the built-in Azure labs accessible inside the Udacity
      classroom.
    evidence:
      url: https://www.linkedin.com/in/alfredodeza
      observed_at: '2026-10-24T08:42:58Z'
  - title: Jenkins For DevOps
    venue: Pearson
    date: December 15, 2019
    description: Cloud technology advancement has changed the face of the tech world, with more emphasis
      on continuous integration and delivery. Learn how to deploy, configure, and take advantage of Jenkins
      for Continuous Integration and Continuous Delivery (CI/CD) and pipeline-like workflows.This LiveLesson
      walks you through the industry standard best practices of deploying Jenkins in a continuous testing
      environment. Learn to create fully functional Jenkins servers based on Infrastructure as Code (IaC)
      as well as deploy Jenkins in both AWS and Google Cloud. Learn the advanced features of Jenkins,
      including the Jenkins Job Builder. Finally, learn several real-world Jenkins deployment case studies.
    evidence:
      url: https://www.linkedin.com/in/alfredodeza
      observed_at: '2026-10-24T08:42:58Z'
  - title: Python For DevOps
    venue: O'Reilly
    date: December 1, 2019
    description: Much has changed in technology over the past decade. Data is hot, the cloud is ubiquitous,
      and many organizations need some form of automation. Throughout these transformations, Python has
      become one of the most popular languages in the world. This practical resource shows you how to
      use Python for everyday Linux systems administration tasks with today’s most useful DevOps tools,
      including Docker, Kubernetes, and Terraform.Learning how to interact and automate with Linux is
      essential for millions of professionals. Python makes it much easier. With this book, you’ll learn
      how to develop software and solve problems using containers, as well as how to monitor, instrument,
      load-test, and operationalize your software. Looking for effective ways to "get stuff done" in Python?
      This is your guide.
    evidence:
      url: https://www.linkedin.com/in/alfredodeza
      observed_at: '2026-10-24T08:42:58Z'
