  publications:
  - title: Systemic Controls for Managing Risk in AI/ML Systems
    venue: IT Revolution Press
    date: August 13, 2024
    description: This paper, published in the Fall 2024 Enterprise Technology Leadership Journal, addresses
      the challenges of managing risks associated with artificial intelligence (AI) and machine learning
      (ML) systems. The authors aim to educate auditors, internal risk directors, and software leaders
      on the differences between existing risk management controls and those needed for new AI/ML systems,
      including generative AI. The paper provides an overview of the control environment for AI/ML systems,
      focusing on six unique assets and suggesting controls for managing associated risks throughout the
      AI/ML development life cycle.
    evidence:
      url: https://www.linkedin.com/in/michaeledenzon
      observed_at: '2026-10-24T08:47:31Z'
  - title: Reinventing Software Asset Inventory
    venue: IT Revolution Press
    date: September 26, 2023
    description: As digital systems expand in scope, mission-criticality, and reach, organizations find
      themselves challenged to understand and account for them. The digital estate presents an information
      management problem that has increased dramatically in scale and complexity since the early days
      of computing. Digital systems support financial, supply chain, and even healthcare outcomes, among
      many other uses. Understanding the resources and their configurations and interplay is essential
      to sustaining their smooth and secure operation.Drawing from the principles of automated governance,
      we propose a methodology and approach to maintaining software asset inventory that allows for granular
      and reproducible metadata captured and updated in real-time throughout the software life cycle.
    evidence:
      url: https://www.linkedin.com/in/michaeledenzon
      observed_at: '2026-10-24T08:47:31Z'
  - title: Automated Governance Changed What We Believe In
    venue: IT Revolution
    date: October 19, 2022
    evidence:
      url: https://www.linkedin.com/in/michaeledenzon
      observed_at: '2026-10-24T08:47:31Z'
  - title: 'Investments Unlimited: A Novel About DevOps, Security, Audit Compliance, and Thriving in the
      Digital Age'
    venue: IT Revolution Press
    date: September 12, 2022
    description: In the vein of bestselling titles The Phoenix Project and The Unicorn Project, Investments
      Unlimited helps organizations radically rethink how they handle audit compliance and security for
      their software systems. By introducing concepts, tools, and ideas to reimagine governance, this
      book catalyzes a more humane way to enable high-velocity software delivery that inspires trust and
      is inherently more secure.
    evidence:
