  publications:
  - title: 'Docker in Production: Lessons from the Trenches'
    venue: Bleeding Edge Press
    description: Docker is the new sliced bread of infrastructure. Few emerging technologies compare to
      how fast it swept the DevOps and infrastructure scenes. In less than two years, Google, Amazon,
      Microsoft, IBM, and nearly every cloud provider announced support for running Docker containers.
      Readers with intermediate to advanced DevOps and ops backgrounds will likely gain the most from
      this book. Previous experience with both the basics of running servers in production as well as
      the basics of creating and managing containers is highly recommended. Many books and blog posts
      already cover individual topics related to installing and running Docker, but few resources exist
      to weave together the myriad and sometimes forehead-to-wall-thumping concerns of running Docker
      in production.
    evidence:
      url: https://www.linkedin.com/in/justincormack
