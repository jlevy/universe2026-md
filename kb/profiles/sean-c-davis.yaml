  activities:
  - kind: project
    title: Sapwood
    detail: Sapwood began as an open-source, multi-site, self-hosted content management system (CMS).That
      project (what I now call "Sapwood Classic"), I abandoned for Sapwood 2, a complete rewrite of the
      original Sapwood system.Sapwood 2 is more than a site-based content management system. It is a content
      hub. It makes no assumptions about the organization of your data. And it doesn't come with all the
      overhead of a traditional CMS.But Sapwood 2 also doesn't have a "public" side to it. Instead, the
      data you enter is available via an API to be used however you desire. This follows the belief that
      you should only have to write content once, and then you can repurpose it how it needs to be depending
      on the application.Sapwood is expected to be in alpha/beta until 2017. · Oct 2014
    evidence:
      url: https://www.linkedin.com/in/seancdavis29
      observed_at: '2026-10-24T08:46:56Z'
  - kind: project
    title: Cambium
    detail: Cambium is a ruby gem that helps bootstrap Ruby on Rails projects by adding some custom configuration
      and adjustments on top of a standard Rails application.However, Cambium's power is in its CMS-based
      generators. A Rails developer can sculpt a fully-functional CMS in a matter of minutes using Cambium's
      generators.Given my work on Sapwood recently, I'm unsure of the future of Cambium, but it has been
      a useful resource and I would love for it to stick around. · Jul 2014
    evidence:
      url: https://www.linkedin.com/in/seancdavis29
      observed_at: '2026-10-24T08:46:56Z'
  - kind: project
    title: Bones CSS Framework
    detail: Bones is a lightweight and flexible framework to help you create great-looking websites right
      out of the box.I had built Bones from the ground up to provide myself more flexibility in writing
      custom CSS. I'm no longer actively developing Bones, and have begun exploring various CSS frameworks
      as an alternative. · Jun 2013
