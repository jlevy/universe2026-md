  - kind: project
    title: Partner Offer Package Acceleration
    detail: Challenged to rapidly create offer package for VMware to co-develop simpler virtual desktop
      management product. Organized blueprint with Sales, Offering Management, Delivery, and Support teams
      working collaboratively to reduce timeline from nine months to only eight weeks, enabling company
      to begin selling the offer to clients ahead of schedule. Product generated $250K in recurring revenue
      in two fiscal quarters ($5M annually), vastly outpacing projected $100K revenue plan. · Sep 2017
    evidence:
      url: https://www.linkedin.com/in/shruti-corbett
      observed_at: '2026-10-24T08:47:26Z'
  - kind: project
    title: Multi-Team Effort to Boost Efficiency of Watson App
    detail: 'Watson-based app struggled to handle traffic compared to client’s legacy application, and
      end-user response times suffered. Launched three major work streams: Infrastructure team implemented
      updates to hardware, VIOS, and DB2 database; application team optimized code to enhance logging
      and transaction tracing abilities and minimize query generation; operations team simultaneously
      tested and analyzed changes in load environment. Within four weeks, Watson’s overall response time
      decreased by 65% and outperformed legacy application. Suite of improvements was then expanded company-wide.
      · Mar 2017'
    evidence:
      url: https://www.linkedin.com/in/shruti-corbett
      observed_at: '2026-10-24T08:47:26Z'
  - kind: project
    title: Systems to Expedite Issue Resolution Workflow
    detail: Team lacked proactive workflow to monitor issues and alert support engineers, relying on slower
      client feedback to begin response. Introduced Grafana dashboard utilizing Zabbix backend to visually
      observe system health and automatic Pager Duty program to notify on-call resource. To further improve
      efficiency, tasked team to create playbooks of recurring ticket scenarios for wiki platform. Instead
      of consulting a product expert, solutions were searchable and immediately available, conserving
      more than four hours per support engineer. Issue resolution times decreased dramatically and led
      to higher client satisfaction. · Mar 2017
    evidence:
      url: https://www.linkedin.com/in/shruti-corbett
      observed_at: '2026-10-24T08:47:26Z'
