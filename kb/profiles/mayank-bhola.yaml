  - kind: project
    title: Brain wave authentication and gaming
    detail: Brainwave authentication and gaming uses Epoc emotive brainwave headset. This project basically
      deals with EEG signals captured from scalp which gives insight to cognitive activities inside brain
      and signals whenever any emotive or affective activity is carried out. This project uses these signals
