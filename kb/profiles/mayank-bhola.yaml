  - kind: project
    title: 'Resumizr : Web based resume suite augmented with social media'
    detail: Resumizr is a smart resume management tool, which harnesses the power of social data to make
      crisp resumes. It allows users to maintain several versions resumes and edit them on the fly. Smart
      validation gives intuitive error validation on each field and is updated in real time with key-ups.
      Resumizr provides seamless integration with multiple social websites and a rich data set is maintained
      for each user, which is easily accessible using RESTFul API. This rich dataset can be used to generate
      a lot of meaningful information about the user’s working habits , skills and similar users using
      artificial intelligence . The application provides various ways of signing in and associates different
      social accounts into one main account. · Feb 2014
