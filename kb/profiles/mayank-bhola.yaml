  - kind: project
    title: mayankbhola.in
    detail: This website, mayankbhola.in is my web programming project built on open source technologies.
      I have tried to build it as more of a portfolio website where I can display my projects and write
      about myself. Here, like always I have given major attention to look and feel for a great experience.
      This website is built over Django for server-side support and uses bootstrap along with jquery for
      a frontend. Further pygments and markdown modules for python are used for content editing such as
      blog posts etc. It uses scrollorama , greensock , jquery knob for home page UI and disqus powered
      comments for a blog post. Further, it uses require.js for lazy loading of website resources. · Sep
      2013
    evidence:
