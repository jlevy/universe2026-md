  - kind: project
    title: dbaseView
    detail: dBaseView is a PHP based CRUD(Create, Read, Update, Delete) application , for basic contact
      management purposes. Designed with companies’ requirement in mind. It provides record (contact)
      management for client and companies And stores various fields like PAN, DIN (relevant for tax purposes).
      It also provides basic search functionality for client and Company record based on few key values
      such as first name, last name, PAN number and DIN number. It is a lightweight alternative for basic
      contact management that can be run on local PHP server such as XAMPP Project repo contains config
      file that needs to be edited before use. Project readme provides relevant details. · Jun 2013
    evidence:
      url: https://www.linkedin.com/in/mayankbhola
      observed_at: '2026-10-24T08:47:13Z'
  - kind: project
    title: PHP mysqli adapter
    detail: PHP mysqli adapter is an abstraction of basic database functions such as select, insert, update
      and delete, into easy to use and flexible classes. It provides a hassle-free interface for database
      interaction with the flexible argument list. In addition, it wraps the result of select queries
      in arrays with column name as indexes for easy access information and includes Sufficient error
      handling and support for pagination using SQL limit functionality. Project repo has nice Readme
      file depicting usage examples. · Jun 2013
    evidence:
      url: https://www.linkedin.com/in/mayankbhola
      observed_at: '2026-10-24T08:47:13Z'
  - kind: project
    title: PyShare
    detail: Pyshare is a local network based file sharing suite, built over the twisted library for asynchronous
      communication. It is multiuser server-client based application, which runs over TCP/IP and provides
      file sharing functionalities. It includes support for assigning nicknames to peer systems in a local
      network and accessing those hosts using that nickname. Pyshare features folder sync functionality
      which can determine which file to update at the run time. The best part of Pyshare is that clients
      don’t need to be manually configured to connected to the server. This process is automated with
      local network discovery tools like ping and handles the connection between client and server. Project
      readme further describes the functionality of the project. · Feb 2013
    evidence:
      url: https://www.linkedin.com/in/mayankbhola
      observed_at: '2026-10-24T08:47:13Z'
  - kind: project
    title: Design-Room
    detail: Design room is an open source web page designer tool , built on HTML5, CSS3, and JavaScript
      and uses PHP for authentication and file download purposes. It allows a user to design and tweak
      every possible CSS property to change look and feel of the element. This is beta version and supports
      <p>,<aside>,<img>,<div> tags. A user can insert text and images and apply various styling options.
      The canvas provides drag and drop capabilities and dynamic repositioning of elements. Elements can
      be resized dynamically using size extenders, appended at the bottom right of the elements. Elements
      can also be removed from canvas by dragging them to the trashcan. Ajax image uploader provided with
      Design room is also 'drag and drop' based. Just drop the images you want to upload and they will
      be on canvas in no time. Design room generates the code at the backend for the design you created.
      Any time user can view the source code by clicking in the status bar at the top. The code will be
      formatted and syntax highlighted (using jquery libraries). Also, the code can be downloaded at any
      time. · Aug 2012
    evidence:
      url: https://www.linkedin.com/in/mayankbhola
      observed_at: '2026-10-24T08:47:13Z'
  - kind: project
    title: tecneed.com
    detail: Tecneed is PHP based forum for a wide variety of discussions. It allows active user participation
      and allows a user to create different topics and comment on them. Notification emails are automatically
      sent to users if someone replied to their post for the first time along with post link. Tecneed
      has custom admin dashboard that manages user access roles and post and comments. Admin can change
