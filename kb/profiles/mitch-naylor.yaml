  publications:
  - title: Using Machine Learning to Accelerate Identification of Pancreatic Incidentalomas
    venue: Journal of Oncology Navigation and Survivorship
    date: October 2, 2023
    description: Pancreatic cancer is among the deadliest forms of cancer, with a 5-year relative survival
      rate of 12.5%. Pancreatic cancer presents symptoms later than many other cancer types, leading to
      delayed identification and poorer outcomes. Additionally, certain pancreatic lesions, such as intraductal
      papillary mucinous neoplasms (IPMNs), carry a malignancy risk of up to 73%. Since pancreatic cancer
      is difficult to diagnose early, prompt diagnosis and workup of premalignant conditions leads to
      better patient outcomes. Furthermore, incidentally identified disease may fall through the cracks,
      leaving the patient to self-manage their diagnosis and treatment. We used cutting-edge techniques
      in natural language processing to identify occurrences of suspicious pancreatic findings in radiology
      reports. Our fine-tuned language model produced an F1 score of 87.1% in a heavily imbalanced task
      (0.4% positivity). We prioritized higher recall (90.1%) over precision (83.9%) due to the efficacy
      of early detection and intervention.
    evidence:
      url: https://www.linkedin.com/in/mitchnaylor
      observed_at: '2026-10-24T08:47:12Z'
  - title: Applied Causal Inference
    date: August 25, 2023
    description: Recent advancements in causal inference have made it possible to gain profound insight
      about our world and the complex systems which operate in it. While industry professionals and academics
      in every domain ask questions of their data, traditional statistical methods often fall short of
      providing conclusive answers. This is where causality can help.
    evidence:
      url: https://www.linkedin.com/in/mitchnaylor
      observed_at: '2026-10-24T08:47:12Z'
  - title: 'PsychBERT: A Mental Health Language Model for Social Media Mental Health Behavioral Analysis'
    venue: IEEE BIBM
    date: December 9, 2021
    description: Domain-adapative pretraining of BERT on a combination of formal and informal language
      focused on mental and behavioral health
    evidence:
      url: https://www.linkedin.com/in/mitchnaylor
      observed_at: '2026-10-24T08:47:12Z'
  - title: Quantifying Explainability in NLP and Analyzing Algorithms for Performance-Explainability Tradeoff
    venue: International Conference on Machine Learning (ICML)
    description: The healthcare domain is one of the most exciting application areas for machine learning,
      but a lack of model transparency contributes to a lag in adoption within the industry. In this work,
      we explore the current art of explainability and interpretability within a case study in clinical
      text classification, using a task of mortality prediction within MIMIC-III clinical notes. We demonstrate
      various visualization techniques for fully interpretable methods as well as model-agnostic post
      hoc attributions, and we provide a generalized method for evaluating the quality of explanations
      using infidelity and local Lipschitz across model types from logistic regression to BERT variants.
      With these metrics, we introduce a framework through which practitioners and researchers can assess
      the frontier between a model's predictive performance and the quality of its available explanations.
      We make our code available to encourage continued refinement of these methods.
    evidence:
      url: https://www.linkedin.com/in/mitchnaylor
      observed_at: '2026-10-24T08:47:12Z'
