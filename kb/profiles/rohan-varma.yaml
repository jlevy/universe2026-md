  publications:
  - title: The Bogart Effect
    venue: The Oxford Journal
    date: August 15, 2012
    description: A paper focusing on the way that humans recognize the direction that other people are
      gazing in. My main contribution to the paper was designing and running and experiment that was run
      over several subjects to determine the main factor that the body used to determine gaze direction.
      My experiment determined that the contrast between the iris and the schlera was the main determinant
      that humans use to determine gaze direction.
