  publications:
  - title: 'Automating Root Cause Analysis: An Agentic Framework for Evidence-Led Reasoning over Distributed
      System Observability'
    venue: Zenodo
    date: May 20, 2026
    description: A reference architecture and working implementation for autonomous root cause analysis
      (RCA) that combines deterministic signal processing with budgeted LLM reasoning. The system ingests
      Prometheus alerts, fetches metrics, logs, and traces in parallel, correlates signals deterministically,
      generates ranked hypotheses via LLM, and validates them with a budgeted agent loop (max 5 iterations).
    evidence:
      url: https://www.linkedin.com/in/guptaachin
      observed_at: '2026-10-24T08:11:33Z'
  - title: 'AADF: Agentic Application Delivery Framework — A Staged Methodology for Building Durable AI
      Agentic Systems'
    venue: Zenodo
    date: March 24, 2026
    description: 'The rapid proliferation of AI agent frameworks has created a paradox: more tools, but
      less clarity on how to build systems that survive production. Teams routinely over-engineer toward
      multi-agent architectures before validating simpler approaches, couple business logic tightly to
