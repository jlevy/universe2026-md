  - kind: project
    title: DIY metrics observability pipeline in Docker
    detail: 'End-to-End Metrics Observability Pipeline Developed a high-performance metrics pipeline to
      monitor distributed services and infrastructure vitals. The project streamlines the "Three Pillars
      of Observability" (focusing on Metrics) by integrating industry-standard open-source tools into
      a single, deployable environment.Data Collection: Leveraged Telegraf and VMAgent to ingest Prometheus
      and StatsD format metrics.Storage & Querying: Utilized VictoriaMetrics as a high-efficiency time-series
      database with MetricsQL for advanced querying.Visualization & Alerting: Configured Grafana dashboards
      for real-time monitoring and integrated Prometheus Alert Manager for proactive incident notification.Infrastructure:
      Fully containerized using Docker, ensuring easy deployment and scalability.AI-Ready with Grafana
      MCP: Includes native Model Context Protocol (MCP) support, serving as a perfect sandbox for those
      exploring AI Agents. This integration allows LLMs (like Claude or Cursor) to securely query your
      metrics and explore dashboards using natural language.'
