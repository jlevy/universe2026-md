  activities:
  - kind: project
    title: Lilly's InnerSourcing Journey - GitHub Universe 2018 Presentation
    detail: Eli Lilly has been on a culture shift with the way it adopts technology and modern processes
      and practices. Being the product owner multiple emerging technologies within Lilly (Heroku, GitHub,
      Jenkins, etc), there was a fantastic opportunity to help embed new services/platforms across the
      enterprise by creating an innersourcing community. I was responsible for coming up with a strategy
      on how to start an innersourcing practice within Lilly and how to increase adoption of modern platforms
      whilst maintaining a good level of customer experience. Please see the attached youtube link for
      more information, where I got the fantastic opportunity to present at GitHub Universe 2018 on Lilly's
      InnerSourcing journey. · Nov 2016
    evidence:
      url: https://www.linkedin.com/in/nickliffen
      observed_at: '2026-10-24T08:15:09Z'
  - kind: organization
    title: Eli Lilly & Company
    detail: Between October 2017 & 2018, I was fortunate enough to be accepted for a 12 month assignment
      at Eli Lilly's headquarters in Indianapolis; to help drive the adoption of emerging technologies.
      I was responsible for driving & implementing the roadmap for Heroku, GitHub, Artifactory, Contentful,
      and towards the end of my assignment, Jenkins. During this assignment I was also responsible for
      helping implement the InnerSourcing strategy. · Oct 2017 · Oct 2018
    evidence:
      url: https://www.linkedin.com/in/nickliffen
      observed_at: '2026-10-24T08:15:09Z'
