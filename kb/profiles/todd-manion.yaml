  patents:
  - title: Computing Application Instant Replay
    number: US 9,498,717
    date: November 22, 2016
    description: Various embodiments relating to providing video game instant replays are disclosed. In
      one embodiment, a currently playing video game is overseen by a platform-level instant replay companion
      that executes separately from any of a plurality of different video games. A most recently played
      portion of rendered gameplay from the currently playing video game is automatically and continuously
      recorded with the platform-level instant replay companion. A recorded gameplay segment from the
      most recently played portion of rendered gameplay is displayed with the platform-level instant replay
      companion.
    url: https://patents.google.com/patent/US9498717
    evidence:
      url: https://www.linkedin.com/in/toddrmanion
      observed_at: '2026-10-24T08:50:01Z'
  - title: DISTRIBUTED ROUTING TABLE ARCHITECTURE AND DESIGN
    number: US 9,270,585
    date: February 23, 2016
    description: A Distributed Routing Table (DRT) mesh can comprise two or more nodes, each of which
      maintains its own routing table that represents some or all of the overall routing knowledge of
      the DRT mesh. Each node can be comprised of modular components that can perform various defined
      functions such that the features and abilities of the node can be customized by an application based
      on which modular components are instantiated. A routing table management module can maintain individual
      routing tables at each node, and can ensure that only entries that are close to the node, in a network
      topology sense, are maintained in the routing table. In addition, a security module can verify received
      messages based on an agreed-upon root certificate.
    url: https://patents.google.com/patent/US9270585
    evidence:
      url: https://www.linkedin.com/in/toddrmanion
      observed_at: '2026-10-24T08:50:01Z'
  - title: LOCATING AND ORIENTING DEVICE IN SPACE
    number: US 9,144,744
    date: September 29, 2015
    description: Example apparatus and methods concern an improved immersive experience for a video gamer
      that is provided by controlling a game based on the three dimensional location and orientation of
      a control and display device held by or otherwise associated with the gamer. The location is determined
      from data comprising a three dimensional position and an orientation of a portion of a player in
      a three dimensional space associated with a computerized game. The facing and rotation of the device
      is determined as a function of both the location of the device and the orientation of the device.
      The orientation may be determined by data from motion sensors in or on the device. Example apparatus
      and methods control the computerized game based, at least in part, on the position of the device,
      the facing of the device, and the rotation of the device.
    url: https://patents.google.com/patent/US9144744
    evidence:
      url: https://www.linkedin.com/in/toddrmanion
      observed_at: '2026-10-24T08:50:01Z'
  - title: ROAMING APPLICATION SETTINGS ACROSS MULTIPLE COMPUTING DEVICES
    number: US 9,077,733
    date: July 7, 2015
    description: Application settings are roamed across multiple computing devices. Provider modules on
      the computing devices are run to retrieve application settings to be roamed and to roam those application
      settings across the multiple computing devices. Application setting changes initiated on a particular
      computing device are added to a history of application setting changes on the particular computing
      device, and also added to synchronization communication module for communication to one or more
      additional computing devices of the multiple computing devices. Application setting changes initiated
      by one of the one or more additional computing devices are received by the particular computing
      device and added to a history of application setting changes on the particular computing device,
      and are also incorporated into the application settings on the particular computing device.
    url: https://patents.google.com/patent/US9077733
    evidence:
      url: https://www.linkedin.com/in/toddrmanion
      observed_at: '2026-10-24T08:50:01Z'
  - title: Peer-To-Peer Identity Management Interfaces and Methods
    number: US 9,021,106
    date: April 28, 2015
    description: Peer-to-peer (P2P) application programming interfaces (APIs) that allow an application
      to create, import, export, manage, enumerate, and delete P2P identities are presented. Further,
      the management of group identity information is provided. APIs abstract away from low level credential
      and cryptographic functions required to create and manage P2P identities. This management includes
      retrieval and setting of a friendly name, generation of a cryptographic public/private key pair,
      retrieval of security information in the form of an XML fragment, and creation of a new name based
      on an existing identity.
    url: https://patents.google.com/patent/US9021106
    evidence:
      url: https://www.linkedin.com/in/toddrmanion
      observed_at: '2026-10-24T08:50:01Z'
  - title: DISTRIBUTED ROUTING TABLE INTERFACE
    number: US 8,977,686
    date: March 10, 2015
    description: Application programming interface (API) for starting and accessing distributed routing
      table (DRT) functionality. The API facilitates bootstrapping into the DRT by one or more devices
      of a group of devices (a mesh) seeking to collaborate over a serverless connection, establishing
      a node of the DRT, where each node is an instance of an application that is participating in the
      mesh, and node participation by allowing the application to search for keys published by other nodes
      in the mesh, or by becoming part of the mesh by publishing a key. The API facilitates optimization
      of the routing table for quickly finding a root of a specific key in the mesh by finding the key
      directly in a cache or by asking a root node of the key that is in the local routing table that
      is closest numerically to the key being searched.
    url: https://patents.google.com/patent/US8977686
    evidence:
      url: https://www.linkedin.com/in/toddrmanion
      observed_at: '2026-10-24T08:50:01Z'
  - title: REMOTE DEVICE COMMUNICATION PLATFORM USER INTERFACE
    number: US 8,898,321
    date: November 25, 2014
    description: Enabling a user interface (UI) for management of a host device from a client device.
      A connection is established between the host device and the client device via a web portal. The
      host device and the client device are without a host management software installed thereon. A content
      window is displayed on the client device in response to the established connection with the host
      device. A client status display area is displayed on the client device indicating at least a connection
      status with the host device. A corresponding host status display area is displayed on the host device
      indicating a connection status with the client device. The displayed client status display area
      specifically identifies the client device and defines client parameters for receiving messages during
      management of the host device. The displayed host status display area specifically identifies the
      host device and defines host parameters for receiving messages during interaction with the client
      device.
    url: https://patents.google.com/patent/US8898321
    evidence:
      url: https://www.linkedin.com/in/toddrmanion
      observed_at: '2026-10-24T08:50:01Z'
  - title: GROUPING PERSONAL ACCOUNTS TO TAILOR A WEB SERVICE
    number: US 8,839,390
    date: September 16, 2014
    description: Grouping personal accounts to tailor a web service may be accomplished by grouping information
      from two or more personal accounts. In some embodiment's, a personal account may include a set of
      persons. By grouping personal accounts, a service provider may tailor a web service to multiple
      people based on information about those people.
    url: https://patents.google.com/patent/US8839390
    evidence:
      url: https://www.linkedin.com/in/toddrmanion
      observed_at: '2026-10-24T08:50:01Z'
  - title: REMOTE DEVICE COMMUNICATION PLATFORM
    number: US 8,789,151
    date: July 26, 2014
    description: Managing via a web portal a remote device from a source device connected to a communication
      network. A device ID is assigned to the remote device, and a remote management software for remote
      management of the remote device is not installed on the source device or the remote device. Based
      on the assigned device ID, a connection is established with the remote device via the communication
      network. A first instruction is received from a user for authenticating access to the web portal.
      The user is authenticated in response to the received first instruction. An online status is established
      for the authenticated user. A second instruction is received from the authenticated user requesting
      access to the remote device. The device ID of the remote device is validated. The validated device
      ID is associated with the authenticated user. A connection is established between the remote device
      and the web portal.
    url: https://patents.google.com/patent/US8789151
    evidence:
      url: https://www.linkedin.com/in/toddrmanion
      observed_at: '2026-10-24T08:50:01Z'
  - title: REMOTE DESKTOP ACCESS
    number: US 8,776,188
    date: July 8, 2014
    description: A method of accessing a first computing device from a second computing device using a
      remote desktop service is disclosed. The first and second device register are authenticated and
      registered with a remote access gateway. In some embodiment's, the remote access gateway stores
      a copy of the first computer and changes made to the copy are synchronized with the actual first
      computer when it access the remote access gateway. A virtual operating system experience on the
      second computer is virtually the same as the real operating system experience on the first computer.
    url: https://patents.google.com/patent/US8776188
    evidence:
      url: https://www.linkedin.com/in/toddrmanion
      observed_at: '2026-10-24T08:50:01Z'
  - title: Distributed Malicious Software Protection in File Sharing Environments
    number: US 8,756,683
    date: June 17, 2014
    description: Automatic file replication and scanning for malware in a sharing environment is based
      on detection of file system changes. Only one client of the multi-client environment needs to include
      malware protection software for all clients to benefit. A file replication service for each client
      monitors a shared directory, and synchronizes files across clients at the file system driver level.
      When a new file appears in the shared directory of a client system, through this driver, the new
      file automatically gets replicated. A malware protection component operates by monitoring the directory
      for new or modified files. File replication causes automatic malware scanning on the client that
      has protection. When the file has been cleaned and re-written to the directory, the replication
      service senses that the file has changed and replicates the cleaned file to the other clients. Thus,
      the replication behavior produces a multiparty file scanning and cleansing protection scheme.
    url: https://patents.google.com/patent/US8756683
    evidence:
      url: https://www.linkedin.com/in/toddrmanion
      observed_at: '2026-10-24T08:50:01Z'
  - title: PEER-TO-PEER IDENTITY MANAGEMENT INTERFACES AND METHODS
    number: US 8,756,327
    date: June 17, 2014
    description: Peer-to-peer (P2P) application programming interfaces (APIs) that allow an application
