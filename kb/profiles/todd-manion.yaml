  - title: Methodology and System For File Replication Based On a Peer group
    number: US 8,108,548
    date: January 31, 2012
    description: The claimed invention adapts an existing operating system native replication service
      component to interface with a general application running on a peer-to-peer network. The claimed
      invention provides the general application with replication services without the need for coding
      this functionality from scratch. The claimed invention also adapts the replication service functionality
