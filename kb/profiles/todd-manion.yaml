  - title: Peer-to-Peer Authentication and Authorization
    number: US 7,350,074
    date: March 25, 2008
    description: An authentication mechanism uses a trusted people store that can be populated on an individual
      basis by users of computing devices, and can comprise certificates of entities that the user wishes
      to allow to act as certification authorities. Consequently, peer-to-peer connections can be made
      even if neither device presents a certificate or certificate chain signed by a third-party certificate
      authority, so long as each device present a certificate or certificate chain signed by a device
      present in the trusted people store. Once authenticated, a remote user can access trusted resources
      on a host device by having local processes mimic the user and create an appropriate token by changing
      the user's password or password type to a hash of the user's certificate and then logging the user
      on. The token can be referenced in a standard manner to determine whether the remote user is authorized
      to access the trusted resource.
    url: https://patents.google.com/patent/US7350074
    evidence:
      url: https://www.linkedin.com/in/toddrmanion
      observed_at: '2026-10-24T08:50:01Z'
  - title: Peer-to-Peer Record Structure and Query Language for Searching and Discovery Thereof
    number: US 7,139,760
    date: November 21, 2006
    description: A simple record query language (SRQL) is a generic record meta-data query solution that
      can natively describe the information contained in a record and search each against it to find records
      whose meta-data matches a particular set of criteria. SRQL includes both a record data structure
      that includes searchable SRQL attributes that describe the record, and queries that are able to
      search the attributes. The attributes are an XML node that exists in the record header itself. There
      are two types of queries, to wit local to find records in the local data store, and distributed
      to find records that may be stored in a neighbor's data store. As such, SRQL finds particular applicability
      to peer-to-peer networks.
    url: https://patents.google.com/patent/US7139760
    evidence:
      url: https://www.linkedin.com/in/toddrmanion
      observed_at: '2026-10-24T08:50:01Z'
