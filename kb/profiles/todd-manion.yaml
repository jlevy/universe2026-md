  - title: Integrated Network and Application Session Establishment
    number: US 8,244,808
    date: August 14, 2012
    description: A session manager recognizes the creation of a new collaboration session and creates
      a new network connection to host the collaboration session using information about the new collaboration
      session. More specifically, an identifier for the new host network connection is based on the name
