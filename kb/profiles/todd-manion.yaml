  - title: Private Virtual LAN Spanning a Public Network for Connection of Arbitrary Hosts
    number: US 8,489,701
    date: July 16, 2013
    description: Architecture for exposing a virtual private network of peer devices into the public domain
      via an overlay network. Computing devices, peripheral devices, as well as mobile devices can be
      physically distributed, but appear to belong to the same virtual private (or home) network, and
      be accessible from anywhere. Benefits include access to user media/documents from anywhere, searching
      of all connected devices from one location, multicast and broadcast connectivity, management of
      the private network and the associated policies, and device discovery on the private network from
      across public networks. P2P networks and ad-hoc networks can be exposed as a virtual interface,
      as well as the utilization of client operating systems to create the virtual network, grouping,
      graphing, the integration with relay services and other NAT/firewall traversal schemes, and the
      creation of a P2P overlay manager on a physical NIC (network interface card) address rather than
      a virtual address.
    url: https://patents.google.com/patent/US8489701
    evidence:
      url: https://www.linkedin.com/in/toddrmanion
      observed_at: '2026-10-24T08:50:01Z'
  - title: Transparent Access Mechanism for Local and Remote Data
    number: US 8,386,424
    date: February 26, 2013
    description: A unified data access mechanism can provide transparent access to data that is either
      stored locally or remotely. Application programs can direct data requests and data modifications
      to this singular component without foreknowledge of where the data is stored. The unified data access
      mechanism can work in concert with a synchronization mechanism that can maintain data synchronization
      between local data and remote data. Requested or modified data can be identified as stored locally
      or remotely based on the namespace of the data. If the data is stored remotely, the user credentials
      associated with the user's process space within which the application program is executing can be
      utilized to identify, and then provide, relevant authentication information to the remote data store,
      should it be required.
    url: https://patents.google.com/patent/US8386424
    evidence:
      url: https://www.linkedin.com/in/toddrmanion
      observed_at: '2026-10-24T08:50:01Z'
  - title: One to Many Data Projection System and Method
    number: US 8,260,857
    date: September 4, 2012
    description: The system and method of information or presentation projection allows a user to present
      information to single or multiple screens without need of additional cables. Universal Plug and
      Play (UPnP) is used to advertise, find, and control the display devices. A reverse Terminal Service
      (TS) session is used to connect the display to the user's machine. Attendance at and receipt of
      the presentation is addressed from both a presenter side and from an attendee side through a subscription
      model. This subscription model is facilitated and security of the presentation is addressed through
      the use meeting invitations. These invitations are generated by the presenter, and may be requested
      by the attendees.
    url: https://patents.google.com/patent/US8260857
    evidence:
      url: https://www.linkedin.com/in/toddrmanion
      observed_at: '2026-10-24T08:50:01Z'
