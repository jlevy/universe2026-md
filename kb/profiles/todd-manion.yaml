  - title: Application Programming Interface for Inviting Participants in a Serverless Peer to Peer Network
    number: US 8,036,140
    date: October 11, 2011
    description: Methods and computer readable mediums are described that facilitate inviting user entities
      on a network. The method may include initiating a first application for sending an invitation by
