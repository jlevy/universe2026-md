  - title: Distributed Routing Table Architecture and Design
    number: US 7,895,345
    date: February 22, 2011
    description: A Distributed Routing Table (DRT) mesh can comprise two or more nodes, each of which
      maintains its own routing table that represents some or all of the overall routing knowledge of
      the DRT mesh. Each node can be comprised of modular components that can perform various defined
      functions such that the features and abilities of the node can be customized by an application based
      on which modular components are instantiated. A routing table management module can maintain individual
      routing tables at each node, and can ensure that only entries that are close to the node, in a network
      topology sense, are maintained in the routing table. In addition, a security module can verify received
      messages based on an agreed-upon root certificate.
