  - title: Method for Efficient Content Distribution Using a Peer-to-Peer Networking Infrastructure
    number: US 8,688,803
    date: April 1, 2014
    description: Disclosed is a method for efficiently distributing content by leveraging the use of a
      peer-to-peer network infrastructure. In a network of peers, a handful peers can receive content
      from centralized servers. These peers can then flood this content out to more clients who in turn
      can send the content along to others. Ultimately, a request for content can be fulfilled by locating
      the closest peer and obtaining the content from that peer. In one embodiment the method can be used
      to distribute content by creating content distribution groups of one or more client computing devices
      and redirecting requests for content from the server to the content distribution group. A further
      contemplated embodiment efficiently streams time sensitive data through the use of a spanning tree
      architecture of peer-to-peer clients. In yet another embodiment the present invention provides for
      more efficient use of bandwidth for shared residential broadband connections.
    url: https://patents.google.com/patent/US8688803
    evidence:
      url: https://www.linkedin.com/in/toddrmanion
      observed_at: '2026-10-24T08:50:01Z'
