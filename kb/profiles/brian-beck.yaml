  - kind: project
    title: PayPal - Vivo Onboarding Portal
    detail: 'The PayPal-Vivo Onboarding Portal allows Brazilian consumers to sign-up for a PayPal account
      and/or link that account to their Vivo carrier account to facilitate topping up their carrier plan
      via PayPal on their mobile device (feature or smart phone).I was the software development manager
      and lead architect for the project. I worked closely with the Brazilian business unit to design
      the solution and then lead the development effort (dev, qa, release management, system administration,
      deployment) and provide post launch support and maintenance.This project required our team to work
      with external technology partners in Sweden, China, Brazil, Canada, and India. During our final
      launch, I created a launch plan to coordinate with teams in 7 cities across 6 countries.Technology:Languages
      / Libraries : Java, Spring, jQuery, ESAPISystems : Apache, Tomcat, Ubuntu, MySQLBuild / Process
      : Jenkins, Github, Eclipse, Maven, JiraAPIs : PayPal (Adaptive Payments, Adaptive Accounts, Identity),
      Vivo (SMS, Top-Up, Service Registration) · Sep 2012'
    evidence:
      url: https://www.linkedin.com/in/bcbeck
      observed_at: '2026-10-24T08:42:47Z'
  - kind: project
    title: PayPal Mobile Reload Portal
    detail: 'The PayPal Mobile Reload portal allows consumers to purchase minutes for prepaid mobile plans
      via PayPal in 50+ recipient countries around the world. The site has a responsive UI that supports
      mobile, tablet, and web formats.I was the software development manager, working closely with the
      French business unit to design the solution, lead the development effort (dev, qa, release management,
      system administration, deployment) and provide post launch support. I also managed the vendor relationship
      and timeline for the UX design and delivery.Technology:Languages / Libraries : Java, Spring, jQuery,
      ESAPISystems : NGinx, Tomcat, Ubuntu, MySQLBuild / Process : Jenkins, Github, Eclipse, Maven, JiraAPIs
      : PayPal (Payments, Identity), TransferTo (SMS, Mobile Top-Up, Price List) · Mar 2013'
    evidence:
      url: https://www.linkedin.com/in/bcbeck
      observed_at: '2026-10-24T08:42:47Z'
  - kind: project
    title: PayPal Notification Portal
    detail: 'The PayPal notification portal allows PayPal merchants and developers to sign up for outage
      and maintenance information for products which span PayPal’s product portfolio. The site supports
      merchants globally, is localized to support 13 languages and provides strict SLAs on email communication
      to subscribers.In addition, the solution comprises an internal customer service portal which provides
      incident templates across all PayPal products (for simple localization), incident tracking, audit
      trail functionality, and an exposed API to manage this information. I was the software development
      manager who lead development, quality assurance and architectural design for the first phase of
      development and project rollout. I worked closely with the product organization and internal stakeholders
      to help define the solution and managed external vendor selection and timelines for UX design and
      assets.Technology:Languages / Libraries : Java, Spring, jQuery, ESAPISystems : NGinx, Tomcat, Ubuntu,
      MySQLBuild / Process : Jenkins, Github, Eclipse, Maven, JiraAPIs : PayPal (Identity), Google (Identity),
      Yahoo (Identity), Facebook (Identity) · Aug 2012'
    evidence:
      url: https://www.linkedin.com/in/bcbeck
      observed_at: '2026-10-24T08:42:47Z'
  - kind: project
    title: PayPal Enterprise Portal
    detail: 'The PayPal Enterprise Portal is a multi-tenant SaaS solution which enables merchants to manage
      all of their accounts via a single interface. The portal provides dual controls using an Attribute
      Based Access Control permission engine, full auditing of user actions, custom reporting, and PayPal
