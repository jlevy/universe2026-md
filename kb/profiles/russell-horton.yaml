    title: '"Ever since nineteen, had a perfect rhyme scheme": A corpus study of English rap rhyme'
    detail: Used statistical modeling to infer phonetic and phonological similarity between English phonemes
      on the basis of their ability to be substituted for one another in imperfect rhymes. Use corpus
      of lyrics from 50,000 hip-hop songs, identifying rhyme schemes and instances of imperfect rhyme
      to see what segments where most likely to be able to be aligned in imperfect rhymes. Results show
      empirical basis for mapping phonetic similarity from corpus data. · Feb 2011
    evidence:
