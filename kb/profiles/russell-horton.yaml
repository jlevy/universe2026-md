  publications:
  - title: 'Something Borrowed: Sequence Alignment and the Identification of Similar Passages in Large
      Text Collections'
    venue: Digital Studies / Le Champ numérique
    date: '2010'
    description: The following article describes a simple technique to identify lexically-similar passages
      in large collections of text using sequence alignment algorithms. Primarily used in the field of
      bioinformatics to identify similar segments of DNA in genome research, sequence alignment has also
      been employed in many other domains, from plagiarism detection to image processing. While we have
      applied this approach to a wide variety of diverse text collections, we will focus our discussion
      here on the identification of similar passages in the famous 18th-century Encyclopédie of Denis
      Diderot and Jean d'Alembert.
    evidence:
      url: https://www.linkedin.com/in/linguistics
