  - kind: project
    title: Professional Portal Pilot Workflow Wigo4It
    detail: 'For a professional portal pilot we designed and put together a software architecture for
      Human Workflow which is tightly coupled to existing automated processes in BizTalk. The human workflow
      (Microsoft Windows Workflow Foundation) allows the end user to support the automated process by
      further classifying the next steps to be taken when the Business Rule Engine (Microsoft BRE on BizTalk)
      fires rules that could not be further automated.The user classification(s) that gets harvested during
      workflow result in a higher quality data sets before it''s being sent to various back-office applications
      (silo''s). These include, but are not limited to: improved reporting, logging and business intelligence.This
      is the first Pilot for Wigo4it that is launched in the Professional Portal Program. · Sep 2015'
