  - title: Beginning Spring Framework 2
    venue: John Wiley & Sons
    date: December 7, 2007
    description: Beginning Spring Framework 2 shows beginning Java developers how to build serverside
      Java applications using the latest 2.0 release of the Spring Framework. The book does not assume
      any previous knowledge of J2EE--in fact, the authors argue that beginners learn more quickly by
      starting directly with Spring.The authors show readers how to build a working web application using
      Spring with other open source tools and technologies, all of which can be freely downloaded and
      installed via the Internet. Each chapter builds a portion of the application. All the Spring concepts
      and construction techniques are introduced during the design and coding of this application. (With
      minor adaptation, the resulting code can be re-used by readers in their own working applications.)
