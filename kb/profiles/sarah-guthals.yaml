  - title: Children's perceptions of what counts as a programming language
    venue: CCSC-SW
    date: Apr 2014
    description: An educational programming language may be more accessible, less frustrating, and more
      rewarding for young students. However, if a student thinks that the educational language does not
      constitute actual computer programming, it is hard to build interest in the subject and confidence
      in their programming skills. We conducted a study in a summer enrichment program for academically
      high-achieving students entering the sixth grade. Students were interviewed about their perception
      of various computer programming environments and our analysis of their reasoning helps us to better
      understand students' tacit assumptions about computer programming. Half of the students were selected
      to complete a worksheet showing the connections between the programming language Scratch, Java,
      C++, and Python. Using linear regression we found that there were no statistically significant differences
      between students who did and did not complete this worksheet in terms of confidence and perception.
    evidence:
      url: https://www.linkedin.com/in/drguthals
      observed_at: '2026-10-24T08:42:21Z'
  - title: Student Experience in a Student-Centered Peer Instruction Classroom
    venue: ICER
    date: Aug 2013
    description: Although studies have shown Peer Instruction (PI) in computing courses to be beneficial
      for learning and retention, study of the student experience has been limited to attitudinal survey
      results. This study provides a preliminary evaluation of student experiences in a PI course -- specifically
      asking them to reflect on their role as a student in a PI lecture compared to a standard university
      lecture. Student responses to this question are first analyzed using Chi's Interactive-Constructive-Active-Passive
      framework which categorizes student activities by their value in a constructivist learning framework.
      This analysis finds that the majority of students reported activity in a PI lecture as "interactive"
      in contrast with "active" (e.g. taking notes) in a standard lecture. Additionally, a grounded theory
      open-coding analysis provides an initial examination of student perceptions of the PI lecture experience.
      Although students positively value learning-related aspects (feedback and increased understanding)
      a surprising breadth of value was noted around issues of affect and increased sense of community.
      In particular, these experiences invite discussion about PI and issues of STEM retention in post-secondary
      education.
    evidence:
      url: https://www.linkedin.com/in/drguthals
      observed_at: '2026-10-24T08:42:21Z'
  - title: 'CodeSpells: Embodying the Metaphor of Wizardry through Programming'
    venue: ITiCSE
    date: Jul 2013
    description: 'This paper addresses how CodeSpells uses the metaphor of wizardry, along with an embodied
      API to engage students in learning to program in Java. Giving novice programmers a concrete representation
      of code has been encouraged and shown to help students understand the concepts with more ease. There
      have been many attempts to improve the novice learning experience by providing: a visual programming
      language, a hardware component or an application that is more approachable. The benefit of this
      research is that students are better able to understand how abstract code effects the environment.
      We build on this work through CodeSpells by immersing novices in the abstraction of code through
      embodiment to allow them to understand complex and abstract programming problems as if they were
      being affected by what they wrote. In this paper we present a new approach to novice programming
      environments, one that embodies the user and encourages a quick grasp of introductoryconcepts followed
      by a deep understanding through exploration.'
    evidence:
      url: https://www.linkedin.com/in/drguthals
      observed_at: '2026-10-24T08:42:21Z'
  - title: On the Nature of Fires and How to Spark Them When You’re Not There
    venue: SIGCSE
    date: March 6, 2013
    description: Traditionally, computer science education research contributes new tools, techniques,
      and theories to improve institutionalized learning spaces – e.g. classrooms. However, we take the
      position that the study and improvement of computer science learning spaces outside the classroom
      are just as important.We take a step toward illuminating the critical qualities of non-institutional
      computer science learning spaces by engaging in a grounded-theoretical examination of first-hand
      accounts of non-institutional learning. To further study the topic, we attempted to recreate (in
      the lab) a learning environment with many qualities that characterize non-institutional learning.
      To make this possible, we employed a modified version of CodeSpells – a video game designed to teach
      Java programming in a way that engenders the sense of sustained, playful, creative exploration driven
      entirely by the learner. This study introduced 40 girls, ages 10 to 12, to programming for the first
      time. We use the results of both studies to develop a theoretical framework which we use to examine
      existing tools such as Scratch, Alice, and educational games in a new light.
    evidence:
      url: https://www.linkedin.com/in/drguthals
      observed_at: '2026-10-24T08:42:21Z'
  - title: 'A Post-Broccoli Paradigm: Educational Games with Diverse, Sustainable Ecosystems'
    venue: CHI
    date: '2013'
    description: We investigate the unique educational benefits of 1-on-1 competitive games, arguing that
      such games can be just as easy to design as single-player educational games, while yielding a more
      diverse and sustainable learning experience. We present a study of chess and StarCraft II in order
      to inform the design of similar educational games and their communities. We discuss a competitive
      game we designed to teach Java programming. We evaluate the game by discussing its user study. Our
      main contributions are 1) an argument that the use of 1-on-1 competition can solve two existing
      problems inherent to single-player games, 2) an analysis of the features that make competitive games
      effective learning environments, and 3) an early but encouraging description of the emergent learning
      environment one can expect from designing an educational game with these features.
    evidence:
      url: https://www.linkedin.com/in/drguthals
      observed_at: '2026-10-24T08:42:21Z'
  - title: 'Exploratory Homeworks: An Active Learning Tool for Textbook Reading'
    venue: ICER 2012
    date: Sep 2012
    description: Constructivist learning theory suggests that learners must construct their own understandings,
      rather than have understanding passively dumped into their brains. These findings support the US
      National Research Council’s recommendations for the adoption of active learning pedagogies in the
      classroom. However, the “classroom lecture” is only one of the resources students commonly have
      for learning in higher education. In this paper, we present exploratory homeworks -- a tool to support
      active learning for teaching programming languages. By leveraging the opportunity for the student
      to interact with the computer/compiler, we seek to provide a model for students of how to explore
      and understand programming language constructs and concepts. We report on the use of 15 exploratory
      homework assignments used in a CS0 course with 440 students in Winter 2011. We provide a model and
      advice for others wishing to develop exploratory homeworks for their programming courses and present
      quantitative and qualitative evidence regarding students’ positive valuation of the homeworks.
    evidence:
      url: https://www.linkedin.com/in/drguthals
      observed_at: '2026-10-24T08:42:21Z'
  - title: 'The Abstraction Transition Taxonomy: Developing Desired Learning Outcomes through the Lens
      of Situated Cognition'
    venue: ICER 2012
    date: Sep 2012
    description: 'We report on a post-hoc analysis of introductory programming lecture materials. The
      purpose of this analysis is to identify what knowledge and skills we are asking students to acquire,
      as situated in the activity, tools, and culture of what programmers do and how they think. The specific
      materials analyzed are the 133 Peer Instruction questions used in lecture to support cognitive apprenticeship
      – honoring the situated nature of knowledge. We propose an Abstraction Transition Taxonomy for classifying
      the kinds of knowing and practices we engage students in as we seek to apprentice them into the
      programming world. We find students are asked to answer questions expressed using three levels of
      abstraction: English, CS Speak, and Code. Moreover, many questions involve asking students to transition
      between levels of abstraction within the context of a computational problem. Finally, by applying
      our taxonomy in classifying a range of introductory programming exams, we find that summative assessments
      (including our own) tend to emphasize a small range of the skills fostered in students during the
      formative/apprenticeship phase.'
    evidence:
      url: https://www.linkedin.com/in/drguthals
      observed_at: '2026-10-24T08:42:21Z'
  - title: 'Computing as the 4th "R": ageneral education approach to computing education'
    venue: ICER 2011
    date: '2011'
    description: Computing and computation are increasingly pervading our lives, careers, and societies
      –a change driving interest in computing education at the secondary level. But what should define
      a “general education” computing course at this level? That is, what would you want every person
      to know, assuming they never take another computing course? We identify possible outcomes for such
      a course through the experience of designing and implementing a general education university course
      utilizing bestpractice pedagogies. Though we nominally taught programming, the design of the course
      led students to report gaining core, transferable skills and the confidence to employ them in their
      future. We discuss how various aspects of the course likely contributed to these gains. Finally,
      we encourage the community to embrace the challenge of teaching general education computing in contrast
      to and in conjunction with existing curricula designed primarily to interest students in the field.
    evidence:
      url: https://www.linkedin.com/in/drguthals
      observed_at: '2026-10-24T08:42:21Z'
  - title: 'Experience Report: an AP CS Principles AP Requirement'
    venue: Technical Report - UCSD
    date: '2011'
    description: "We report on the development and deployment of a pilot of the new Advanced Placement\
      \ CS Principles course in the United States. The course is designed to introduce core computational\
      \ concepts and instill computational thinking practices. We report on an initial offering with 571\
      \ university students, mostly non-CS majors taking the course as a general education requirement.\
      \ We discuss the instructional design supporting the course, describe how the various components\
      \ were implemented, and review student work and valuation of the course. Though the course appears\
      \ to â€œteach programmingâ€\x9D in Alice, students reported gaining significant analysis and communication\
      \ skills they could use in their daily life. We reflect on how instructional design decisions are\
      \ likely to have supported this experience and consider the implications for other K-12 computing/IT\
      \ education efforts as well as for regular CS1 courses."
