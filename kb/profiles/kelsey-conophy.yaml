  - title: Enhanced search report based on leveraging search engine APIs, large language models, and web
      crawlers
    number: US20250200123A1 IPR-2412870US
    date: December 15, 2023
    description: Systems and methods that generate an enhanced search report, which provides a significant
      improvement over conventional searches are provided. The systems and methods leverage a combination
      of keyword-based searches using search engine APIs to return URLs that are hit by the searches,
      large language models to generate additional keywords based on contextual information, and web crawlers
      to search the returned URLs with the additional keywords. The enhanced search report is not confined
      to the conventional keyword-URL match, but instead provides a sophisticated capture and compilation
      of additional useful information.
