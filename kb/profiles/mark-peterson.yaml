  - title: Software application execution using contextual information
    number: US 12566604
    date: March 3, 2026
    description: Techniques are described for deploying software applications associated with document
      management. The techniques may include receiving a request, by a computing system and from a client
      device, to execute a software application for managing an electronic document, wherein the software
      application is configured to execute using at least a first widget and a second widget. The techniques
      may further include generating, based on the first widget comprising instructions to initiate an
      execution of the second widget, instructions for executing the software application at the client
      device, wherein the instructions are configured to cause the client device to generate contextual
      information for the first widget and wherein the second widget causes the client device to load
      the contextual information when executing the second widget. The techniques may further include
      outputting, by the computing system and to the client device, the instructions to execute the software
      application for managing the electronic document.
