  - kind: project
    title: Online Marketing Strategy Development for Clevis Research GmbH
    detail: 'The 3-month consulting project was conducted for Clevis Research, a medium-sized market research
      and consulting company. The main goal of the project was to develop a holistic online marketing
      strategy that will help Clevis Research to increase the number and quality of customer leads generated
      through online channels.The project encompassed the following main deliverables:- Analysis of various
      online marketing tools and industry best practices for online client acquisition - Customer segmentation-
      Analysis of existing online marketing activities at Clevis Research- Detailed elaboration of an
      SEM-focused online marketing strategy, including: mock-up for landing pages that incorporate best
      practices; detailed recommendations for the setup of corresponding Google Adwords campaigns; appr.
      18,000 proposed keywords to kickoff online marketing efforts- Development of a keyword and ad groups
      generation tool- Strategy implementation plan with detailed cost estimation and business case calculation
      · Apr 2014'
