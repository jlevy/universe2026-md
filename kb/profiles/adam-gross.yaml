  - title: Single sign on for a remote user session
    number: US 8,955,072
    date: February 10, 2015
    description: Abstract:A user accesses a remote session, the connection to which is managed by a connection
      broker, according to a single sign-on (SSO) process. The SSO process includes the user entering
      his or her credentials and being authenticated to the connection broker. In addition to user authentication,
      the SSO process includes connection broker authentication to confirm that the connection broker
      is trustworthy. When the connection broker is authenticated, the user credentials are transmitted
      to the connection broker in a secure manner and the connection broker forwards them onto a machine
      hosting the remote session so that the user can be logged into the remote session without entering
      his or her credentials again.
    url: https://patents.google.com/patent/US8955072
