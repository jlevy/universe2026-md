  patents:
  - title: SYSTEM AND METHOD FOR DYNAMICALLY RECEIVING MORTGAGE INFORMATION VIA TEXT MESSAGING
    number: US 15/690,942
    date: February 28, 2019
    description: A system and method for obtaining mortgage information via text messaging are provided.
      The method includes scanning, via a camera of a mobile terminal, an image of a multi-dimensional
      barcode corresponding to a target real estate property, and extracting a Short Message Service (SMS)
      Uniform Resource Locator (URL), via a processor of the mobile terminal, from the multi-dimensional
      barcode. The method further includes generating and transmitting, via a cellular network, a text
      message to a phone number indicated in the SMS URL. The web server loads a custom code for property
      information of the target real estate property based on the transmission by the mobile terminal.
      The webserver transmitting, via a data network, a first inquiry based on the custom code. The mobile
      terminal transmits a response, and the web server transmits estimated mortgage payment information
      based on the transmitted response.
    evidence:
      url: https://www.linkedin.com/in/jeffreality
      observed_at: '2026-10-24T08:45:04Z'
  - title: Dynamic content delivery based on metadata-seeking behavior
    number: US 14/513,717
    date: October 14, 2014
    description: A media processing system provides services for metadata-seeking behavior. The system
      includes a memory that stores executable instructions and a processor that executes the executable
      instructions. The system also includes a receiver that receives, based on a person initiating capture
      of source input in seeking metadata for an object associated with the source input, source input
      from a requesting device used by the person to initiate the capture of the source input in the metadata-seeking
      behavior. Ultimately, content is dynamically identified for presentation to the person.
    evidence:
      url: https://www.linkedin.com/in/jeffreality
      observed_at: '2026-10-24T08:45:04Z'
  - title: Coded visual information system
    number: US 9008432
    date: December 10, 2010
    description: Information is arranged within a predetermined shape. The predetermined shape is captured
      in an image taken by a tangible image-capturing element of a device which captures images at the
      direction of a user. The device includes a tangible processor that analyzes the image captured by
      the image-capturing element to determine whether a predetermined shape is present in the image.
      The tangible processor determines an alignment of the predetermined shape when the predetermined
      shape is present in the image, and reads data within the predetermined shape in accordance with
      the determined alignment. The device automatically forwards a request for content over a communications
      network in accordance with the data read within the predetermined shape. The device receives the
      content over the network and displays the content.
    url: https://patents.google.com/patent/US9008432
    evidence:
      url: https://www.linkedin.com/in/jeffreality
      observed_at: '2026-10-24T08:45:04Z'
