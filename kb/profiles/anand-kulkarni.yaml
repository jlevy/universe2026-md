  - title: Two Tools for Tollbooth Optimization
    venue: UMAP Journal 26.3 Fall 2005 Edition
    date: '2005'
    description: Tollbooth plazas on freeways have the potential to disrupt the flow of traffic by slowing
      traffic in order to collect tolls in each lane. Freeway designers offset this problem by including
      extra lanes for toll collection, but this causes additional disruption as many lanes of traffic
      attempt to merge back together near the plaza exit. We seek to determine the optimal number of additional
      lanes to include in order to maximize the transit rate of vehicles hrough the system. We utilize
      two totally different approaches, one macroscopic, and one discrete, in modeling traffic throughthe
      toll plaza. In our first approach, we derive a number of theoretical results about flows through
      a sequence of bottlenecks and demonstrate that maximum flow will occur when theflow rate through
      all bottlenecks is equal. We then apply these results to the toll plaza system in order to determine
      the optimal number of toll lanes. At high densities, our model predictsthe optimal result to exhibit
      a roughly linear relationship with the number of toll lanes.
    evidence:
      url: https://www.linkedin.com/in/anandpkulkarni
      observed_at: '2026-10-24T08:43:21Z'
