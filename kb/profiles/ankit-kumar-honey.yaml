  - kind: volunteering
    title: Technical Lead
    detail: Ersilia · Science and Technology · Oct 2022 · - Mar 2023 · 6 months · I had privilege of volunteering
      my software engineering skills with the Ersilia Initiative, a non-profit tech organization that
      equips laboratories, clinics, and universities in low-income countries with Machine Learning (ML)
      tools for infectious disease research. During my time on the project, I worked on automating Ersilia's
      ML models using Actions, with the goal of setting up an ML model contribution pipeline with automated
      checks. Our objective was to add 500 ML models to the Ersilia… Show more I had privilege of volunteering
      my software engineering skills with the Ersilia Initiative, a non-profit tech organization that
      equips laboratories, clinics, and universities in low-income countries with Machine Learning (ML)
      tools for infectious disease research. During my time on the project, I worked on automating Ersilia's
      ML models using Actions, with the goal of setting up an ML model contribution pipeline with automated
      checks. Our objective was to add 500 ML models to the Ersilia Model Hub by the end of the year,
      and I am thrilled to say that we have already contributed 75 new models to the Hub. As part of this
      project, I helped develop a well-designed, easy-to-follow contributor workflow that has made a significant
      impact on scaling our work as an open-source community. Through our collaborative efforts, we were
      able to implement a number of Git Actions workflows that streamlined the process and ensured timely
      completion of tasks. I am honored to have contributed to this project and to have played a role
      in making a meaningful impact in the field of ML. My experience with the Ersilia Initiative has
      allowed me to develop my technical skills and deepen my understanding of ML models, and I look forward
      to continuing to contribute to impactful projects in the future. Show less · Oct 2022
