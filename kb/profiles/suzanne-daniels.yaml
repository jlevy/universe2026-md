  activities:
  - kind: project
    title: Ghost Decisions - How to lead when AI moves faster than you
    detail: 'Fourteen changes deployed overnight. Twelve from AI agents. All approved — by the structure,
      not by a person. The fix was correct. The process was followed.And at the morning sync, nobody could
      say who owned the decision.This is the Agentile condition. Most organisations are already in it.
      The question is no longer whether to adopt AI agents. The question is who governs what they do —
      and what happens when the answer is “nobody, specifically.”ISEE is the four-layer operating model
      that resolves it. Humans own the slow layers — strategic intent, codified structure. Machines run
      the fast ones — continuous execution, real-time evidence. A spine translates between them: human
      judgement rendered once, enforced thousands of times per day.Ghost Decisions addresses the questions
      that arise when AI becomes an integral part of your organisation.'
    evidence:
      url: https://www.linkedin.com/in/suzannedaniels
      observed_at: '2026-10-24T08:47:12Z'
