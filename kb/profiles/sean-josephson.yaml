  publications:
  - title: 'Safeguarding software integrity: VMware''s approach to source code security with GitHub'
    venue: GitHub
    date: November 9, 2023
    description: VMware has a very large software footprint, and currently, all its open source projects
      are hosted on GitHub. GitHub and its services allow VMware's engineering staff to be proactive with
      code security and secret management—two areas, if mishandled, can significantly impact customers
      and revenue. In this session, we will be taking a deep dive into source code security and how VMware
      protects its customers and IP with GitHub SaaS.
    evidence:
