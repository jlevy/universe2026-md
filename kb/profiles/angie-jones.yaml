  - title: Sending related information to indirect email recipients
    number: US 8589493
    date: November 19, 2013
    description: Managing the sending of electronic mail (email) messages and responding to requests from
      indirect recipients for related information. An email message is originated with a first recipient
      and a recipient request prompt, which comprises a unique recipient request identifier (ID) linking
      it to the originator's email address. An empty recipient request list is generated, likewise linked
      to the recipient request ID. The message is then sent to a first recipient, who in turn forwards
      it to a second recipient. The recipient response prompt is displayed to the second recipient, who
      uses it to generate a recipient request for related information. The recipient request ID of the
      originated message and the second recipient's email address are appended to the recipient request,
      which is then sent to the message originator. The recipient request is received by the email system
