  publications:
  - title: Agentic AI and Code Reviews
    venue: IT Revolution
    date: September 29, 2026
    description: 'Code review was already a bottleneck before AI. Now agents generate more change than
      any team of senior engineers can read, and the old rule that every change gets a human review has
      stopped being sustainable. At the same time, nobody wants subtly wrong or needlessly complex code
      merged without supervision. This paper answers the question technology leaders keep asking: how
      do we keep up without giving up the judgment that made review worth doing?Drawing on empirical research
      into what code review actually delivers, the authors propose a pattern language for agentic code
      review: a layered verification strategy that pushes objective checks into deterministic tooling,
      tiers human involvement to risk, and leaves a durable, inspectable record of every agentic decision.
      The patterns are a toolbox, not a maturity ladder, meant to be adopted incrementally as confidence
      in automated verification grows.'
    evidence:
      url: https://www.linkedin.com/in/angiejones
      observed_at: '2026-10-24T08:11:44Z'
  - title: 97 Things Every Java Programmer Should Know
