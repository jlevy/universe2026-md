  - title: 'DevOps: Implementing Cultural Change [Testing in CI chapter]'
    venue: DZone
    date: January 14, 2019
    description: There’s no shortage of developers and enterprises of all sizes who are interested in
      the increased speed, collaboration, and iteration that DevOps promises. And with our research showing
      that more than half of organizations have an officially designated DevOps team, the prevalence of
      DevOps is only going to grow. In this Guide, you’ll learn about cultural shifts within DevOps, how
      to achieve resilient software delivery with CI/CD, the rise of DevXOps, and more.
    evidence:
      url: https://www.linkedin.com/in/angiejones
      observed_at: '2026-10-24T08:11:44Z'
  - title: 'The Digital Quality Handbook: Guide for Achieving Continuous Quality in a DevOps Reality,
      Chapter 18'
    venue: Infinity P
    date: April 28, 2017
    description: As mobile and web technologies continue to expand and basically drives large organizational
      business in virtually every vertical or industry, it is critical to understand how to take existing
      release practices for mobile and web apps to the next level, including software development life
      cycle (SDLC), tools, quality, etc. This book tackles those and provide working best practices to
      overcome them. Each chapter in this book addresses a key challenge and provides practical examples
      and real life “recipes” to overcome the difficulties and eventually help other organizations who
      might be facing the same difficulties.
    evidence:
      url: https://www.linkedin.com/in/angiejones
      observed_at: '2026-10-24T08:11:44Z'
