  publications:
  - title: 'Code Reviews: Compassion vs Criticism'
    venue: AfroTech Conference 2024
    date: February 15, 2025
    description: In software development, code reviews are supposed to be a safe space for learning and
      collaboration amongst the team (especially those in their early career). Why, then, is the process
      so fraught with fear and anxiety nowadays? In this talk, I will provide helpful strategies that
      teams can implement to reduce the stress felt during code reviews and refocus it into the collaborative,
      nurturing space that it was intended to be.
    evidence:
      url: https://www.linkedin.com/in/alexoladele
      observed_at: '2026-10-24T08:42:38Z'
  - title: Python + Discord = Great Bots!
    venue: PyOhio 2024
    date: July 28, 2024
    description: Okay you already enjoy using python, and you already enjoy using Discord, but what if
      you combined both!In this talk we will explore how to build a discord bot using the Pycord library.
      We’ll build a dice rolling bot that utilizes Discord’s native slash commands. At the end of this
      talk you’ll have learned the different ways to invoke discord bot actions, the different lifecycle
      events each bot goes through, structuring the code for maintainability, and how to build for widespread
      adoption.
    evidence:
      url: https://www.linkedin.com/in/alexoladele
      observed_at: '2026-10-24T08:42:38Z'
