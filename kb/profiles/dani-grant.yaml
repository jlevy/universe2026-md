  - title: |-
      OMG!! Someone just created the 10 millionth Jam!!! 🤯

      So excited. Less time fixing, more time building!!

      Thanks y'all for building this with us! 🍓 https://t.co/B3rP8xgFI7
    url: https://twitter.com/480959060/status/1945491196455109098
    published: '2025-07-16T14:30:21Z'
    channel: x
  - title: |-
      My 1st day at Cloudflare, the now CTO gave me 1 big piece of advice:

      Ship small wins early. Like ASAP.

      The easiest way to build trust in a new org is to ship small wins early.

      Ship small and fast (otherwise you're just the new PM working on the same darn feature for 6 months).
    url: https://twitter.com/480959060/status/1912873082198565153
    published: '2025-04-17T14:17:36Z'
    channel: x
  - title: |-
      Best hiring advice I’ve received:

      Hire people who love what they do so much, they listen to podcasts about it.

      Getting to build with these people will make your day. Their obsession, their love for the craft, it’s infectious and awesome 🤩
    url: https://twitter.com/480959060/status/1884263953498529992
    published: '2025-01-28T15:35:09Z'
    channel: x
  - title: |-
      Calendly didn’t have a technical co-founder

      Instead, they built the product with a dev agency

      (Jam too!)

      There’s no one way to build a startup

      Don’t let people tell you you need a technical cofounder to start your company
    url: https://twitter.com/480959060/status/1857083575444590953
    published: '2024-11-14T15:30:01Z'
    channel: x
  - title: |-
      PMF is a lot easier to solve if you split it into 2 steps:

      Promise Market Fit: Will people buy a product with your promise?

      Product Market Fit: Once they buy &amp; sign up, do they stay?

      Once you have a promise people want, keep iterating until your product fulfills the promis
    url: https://twitter.com/480959060/status/1856358797142569383
