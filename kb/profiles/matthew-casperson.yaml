  activities:
  - kind: project
    title: Octopus Extension for GitHub Copilot
    detail: The Octopus extension makes it easier for customers to harness the power of Octopus without
      needing to be an expert. This means that anyone can get answers to deployment-related questions
      quickly and easily. The chat-based agent gives people the ability to simply extract information
      from Octopus about deployments, such as:* Summaries of the state of deployments* Access to reporting
      in logs and security vulnerabilities* Reporting and statistics around deployments* Step-by-step
      instructions straight from Octopus documentationThe Octopus extension also provides a more seamless
      experience for teams using the GitHub UI exclusively. DevOps teams can get the relevant information
      they need for deployments without context switching from GitHub, saving time for developers. It
      makes it easier to streamline workflows and understand the state of deployments using simple text-based
      queries. · Dec 2023
    evidence:
      url: https://www.linkedin.com/in/mattcasperson
      observed_at: '2026-10-24T08:47:09Z'
