  publications:
  - title: DevEx as a Service
    venue: Amazon
    date: February 4, 2024
    description: DevOps teams are innovation engines. Maintaining the passion and productivity of DevOps
      teams at scale requires attention to their lived experience and removing points of friction. Or,
      more simply, by focusing on the developer experience (DevEx). Implementing the practice of platform
      engineering with the explicit goal of improving DevEx is the foundation of DevEx as a Service (DEaaS).This
      book provides practical guidance for teams looking to implement a platform engineering team including:*
      The requirements of Internal Developer Platforms (IDPs)* Insights into the constraints platform
      teams must accommodate* Activities required to support a DEaaS implementation* Non-functional requirements
      a DEaaS implementation can improve to support DevOps teams* Metrics to help platform teams measure
      their impact* Examples of how platform engineering has helped existing DevOps teams
    evidence:
      url: https://www.linkedin.com/in/mattcasperson
      observed_at: '2026-10-24T08:47:09Z'
  - title: The ten pillars of pragmatic Kubernetes deployments with Octopus Deploy
    venue: Amazon
    date: April 29, 2021
    description: As you might imagine, at Octopus, we spend a great deal of time thinking about deployments.
      Octopus was born to manage real world deployment processes and continues to be shaped through conversations
      with customers, support requests, our own internal deployment requirements, and many other discussions
      about what we think good deployments look like.This knowledge has been distilled into the 10 pillars
      of pragmatic deployments.
    evidence:
      url: https://www.linkedin.com/in/mattcasperson
      observed_at: '2026-10-24T08:47:09Z'
  - title: Away3D 3.6 Essentials
