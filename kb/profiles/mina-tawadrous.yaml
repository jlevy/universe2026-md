  publications:
  - title: Stereoscopic 3D video games and their effects on engagement
    venue: IS&amp;T/SPIE Electronic Imaging
    date: February 9, 2012
    description: With television manufacturers developing low-cost stereoscopic 3D displays, a large number
      of consumers will undoubtedly have access to 3D-capable televisions at home. The availability of
      3D technology places the onus on content creators to develop interesting and engaging content. While
      the technology of stereoscopic displays and content generation are well understood, there are many
      questions yet to be answered surrounding its effects on the viewer. Effects of stereoscopic display
      on passive viewers for film are known, however video games are fundamentally different since the
      viewer/player is actively (rather than passively) engaged in the content. Questions of how stereoscopic
      viewing affects interaction mechanics have previously been studied in the context of player performance
      but very few have attempted to quantify the player experience to determine whether stereoscopic
      3D has a positive or negative influence on their overall engagement. In this paper we present a
      preliminary study of the effects stereoscopic 3D have on player engagement in video games. Participants
      played a video game in two conditions, traditional 2D and stereoscopic 3D and their engagement was
      quantified using a previously validated self-reporting tool. The results suggest that S3D has a
      positive effect on immersion, presence, flow, and absorption.
    evidence:
      url: https://www.linkedin.com/in/mina-tawadrous
      observed_at: '2026-10-24T08:15:16Z'
  - title: 'Interactive floating windows: a new technique for stereoscopic video games'
    venue: IS&amp;T/SPIE Electronic Imaging
    date: February 6, 2012
    description: The film industry has a long history of creating compelling experiences in stereoscopic
      3D. Recently, the video game as an artistic medium has matured into an effective way to tell engaging
      and immersive stories. Given the current push to bring stereoscopic 3D technology into the consumer
      market there is considerable interest to develop stereoscopic 3D video games. Game developers have
      largely ignored the need to design their games specifically for stereoscopic 3D and have thus relied
      on automatic conversion and driver technology. Game developers need to evaluate solutions used in
      other media, such as film, to correct perceptual problems such as window violations, and modify
      or create new solutions to work within an interactive framework. In this paper we extend the dynamic
      floating window technique into the interactive domain enabling the player to position a virtual
      window in space. Interactively changing the position, size, and the 3D rotation of the virtual window,
      objects can be made to 'break the mask' dramatically enhancing the stereoscopic effect. By demonstrating
      that solutions from the film industry can be extended into the interactive space, it is our hope
      that this initiates further discussion in the game development community to strengthen their story-telling
      mechanisms in stereoscopic 3D games.
    evidence:
      url: https://www.linkedin.com/in/mina-tawadrous
      observed_at: '2026-10-24T08:15:16Z'
