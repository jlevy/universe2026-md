  - kind: project
    title: Smart Shower
    detail: 'Una regadera inteligente que controla el flujo del agua dependiendo de la temperatura deseada
      por el usuario y su presencia al momento de bañarse. No solo ahorra 80 litros de agua en cada baño,
      también reutiliza esa agua en otros usos dentro del baño como el lavabo y el sanitario. Contamos
      con el diseño adaptado para casas que quieran cambiarse a nuestro sistema, y el sistema nuevo para
      casas en construcción que quieran incluir nuestro proyecto. Ambos diseños totalmente originales,
      construidos, programados y prototipados por nosotras. Hemos ganado distintos reconocimientos: -1er
      Lugar Hackathon Caterpillar 2022 a nivel zona norte -Mención Honorifica en categoría Medio Ambiente
      en el PrepApps del INC Mty 2022 a nivel nacional -Reconocimiento a proyecto de impacto tecnológico
      en el evento Orgullo Prepa Tec 2022 a nivel zona -Invitadas especiales en el programa Bar Emprende
      de Genaro Mejía · Jun 2022'
