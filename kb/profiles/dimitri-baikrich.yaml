  activities:
  - kind: project
    title: 'Palo IT Lab: GreenIT: Carbon Analytics'
    detail: From measuring the power consumption of our laptops to deploying a building management system
      solution, Carbon Analytics is the start of PALO IT's journey towards being a greener company.We've
      developed a powerful tool to retrieve detailed and anonymized power consumption data on laptops
      fleets. Detailed, so we can retrieve information like most power-hungry application, or screen usage
      and provide tips to reduce consumption, and anonymized to prevent this tool from being used to track
      employees. · Apr 2021
    evidence:
      url: https://www.linkedin.com/in/dbaikrich
      observed_at: '2026-10-24T08:43:04Z'
  - kind: project
    title: 'Palo IT Lab: Community E-Commerce'
    detail: Community e-commerce is a positive impact project that aims to redefine how individuals and
      businesses alike buy and sell products or services online, by using distributed web for this.The
      communities can function in isolation or in tandem with other trusted communities, and the trust
      layer is provided by self-sovereign identity. · Jan 2021
    evidence:
      url: https://www.linkedin.com/in/dbaikrich
      observed_at: '2026-10-24T08:43:04Z'
  - kind: project
    title: Self-Sovereign Identity
    detail: Self-Sovereign Identity or SSI provides lifetime, portable identity for any person, organization
      or thing that does not depend on any authority and can never be taken away. Individuals with Self-Sovereign
      Identity (SSI) can keep their electronic identity private while sharing it securely with other people
      and organizations that require it, via Verifiable Credentials protocol. For instance, it allows
      a person to prove that he owns a driving license, or that he's old enough to drive, without exposing
      any information related to the proof to the third party. This is known as zero-knowledge proof.
      And because the network relies on signed credentials by the emitting entities, every credential
      on that system can be trusted, leading to simplify procedures (KYC, bank loans, credit checks, background
      checks, etc.) and greater privacy for end-users. We have decided to work on the Sovrin network.
      Our work in the lab is to simplify the user experience by changing the way credentials are requested,
      developing apps (mobile and desktop) for the end-users, and streamlining the legal and technological
      connections for organizations willing to participate in Sovrin. We've also developed a new protocol
      that provides a way to establish communication in a decentralized way. That protocol can be found
      under https://github.com/hyperledger/aries-rfcs/pull/402. Our work on the OSMA open-source project
      in the lab was presented in a conference called MyData in Finland in September 2019. A demo was
      created using the app on SSI to present the interoperability, connecting our app with IIWbook developed
      by the Govt of British Columbia. Having participated and organized conferences on the subject of
      privacy and digital identity, our work on SSI has been presented in highly publicized events, including
      Identity Week Asia and Singtel Innovfest. · Jun 2019
    evidence:
      url: https://www.linkedin.com/in/dbaikrich
      observed_at: '2026-10-24T08:43:04Z'
  - kind: project
    title: 'Palo-IT Lab: Secure Cloud OS'
    detail: Secure Cloud OS is a DaaS (Desktop as a Service) prototype for the elderly and non-tech savvy.The
      main idea was to build an easy to use OS that would always be kept up-to-date, adequately monitored,
      would reside in the cloud, and would use no password whatsoever, to reduce the risk of phishing.We
      used biometric authentication, with Microsoft's WinBio framework, automatic provisioning for the
      DaaS, PPK to authenticate the connection with the DaaS, a driver to transform the local camera and
      microphone to IP camera to be used on the remote desktop.The OS itself customized by running a Java
      app on top of Ubuntu, remove icons, using labelled action buttons, and handle all authentication
      without user involvement.All actions were logged to an ElasticSearch cluster, to be analyzed to
      find any unusual usage pattern. · Apr 2019
    evidence:
      url: https://www.linkedin.com/in/dbaikrich
      observed_at: '2026-10-24T08:43:04Z'
  - kind: project
    title: MTEP - Murex Test Environment Plateform
    detail: The project aims at improving the management of the DBS Murex UAT (User Acceptance Test) environments,
      specifically to shorten the recycling cycles of UAT environments and releasing them as soon as possible
      in the available pool. The stress was also put on building the system to allow the end user to take
      ownership of actions that were previously performed by technical teams. Finally, the system transforms
      the role of the environment manager from a very technical one to a more business oriented one. ·
      May 2012
    evidence:
      url: https://www.linkedin.com/in/dbaikrich
      observed_at: '2026-10-24T08:43:04Z'
