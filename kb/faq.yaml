faq:
  event: event:github-universe-2026
  entries:
  - question: Where and when is Universe?
    answer: Universe will take place on October 28 - 29, 2026 at [Fort Mason Center for Arts & Culture](https://fortmason.org/)
      in San Francisco, CA. Broadcast times and schedule will be announced in September.
  - question: What is your cancellation policy?
    answer: To receive a refund on your order, please [contact us](https://airtable.com/appfOr0lGpRh28jTk/pagNqg817o65RLZ54/form)
      using the "Registration Support" category. Passes must be cancelled by 11:59pm on October 9. Refunds
      are not available after that deadline.
  - question: Are there sponsorship opportunities for GitHub Universe?
    answer: We have a limited number of sponsorship opportunities available for GitHub Universe. To learn
      more, visit [event-sponsorship.github.com](http://event-sponsorship.github.com/) or [contact us](https://airtable.com/appfOr0lGpRh28jTk/pagNqg817o65RLZ54/form).
  - question: I’m traveling from outside the US. Can you help with my VISA application?
    answer: Please consult our [visa specific FAQ's](https://static.rainfocus.com/github/universe26/static/staticfile/staticfile/Universe%202026%20VISA%20FAQ%27s_1781196981227001qEtb.pdf)
      for additional information about invitation letters and visa applications.
  - question: How long will registration remain open?
    answer: Registration opens in June and will remain open until passes sell out. Don't forget, if you
      can't make it in person you can still join virtually.
  - question: Do you offer discounted passes or discounted pricing for students and non-profits?
    answer: |-
      Yes, we offer group discounts for those that want to bring along their teams! If you purchase 4+ passes, you’ll receive 20% off each pass.

      We also have a limited number of discounted passes for students and non-profit organizations. Please [contact us](https://airtable.com/appfOr0lGpRh28jTk/pagNqg817o65RLZ54/form) for additional details.
  - question: Is there a hotel room block for GitHub Universe?
    answer: You bet! We’ve contracted with several hotels in the Fisherman’s Wharf area.  You will have
      an opportunity to book a room at our conference rate during event registration, or from your Attendee
      Portal once registered. Other parties may solicit you to book at our contracted properties, but
      to ensure that you have a legitimate reservation at our special conference rate, rooms must be booked
      through our online conference portal. A credit card will be required to secure your reservation.
      Rates are subject to availability at time of booking. We recommend you reserve as early as possible.
      See hotel policies related to cancellation, early departures, etc. Do not contact the hotels directly
      to confirm, book, cancel, or amend your reservation.
  - question: Are there speaking opportunities at GitHub Universe?
    answer: Our call for sessions for Universe 2026 is now closed. Keep an eye out early next year for
      the Universe 2027 call for sessions — we’re always excited to hear new voices and ideas from across
      the community.
  - question: Which airports are closest to San Francisco?
    answer: San Francisco International Airport (SFO) is the closest major airport, an easy BART ride,
      or a 25-minute drive from downtown. Alternatively, the Oakland International Airport (OAK) is a
      35-minute drive over the Bay Bridge and is also accessible by BART. Lastly, the San Jose International
      Airport (SJC) is a one-hour drive from the South Bay, accessible by Caltrain.
  - question: What accessibility resources will be available at Universe?
    answer: |-
      All sessions — with the exception of Ship and Tell, Sandbox sessions, and workshops — will have real-time captioning, and our main stage will include American Sign Language (ASL) interpretation. We’ll also have a dedicated quiet space and lactation room onsite.

      Fort Mason is a historic venue that has been retrofitted to meet ADA standards. If you have any accessibility needs or would like assistance planning your on-site experience, please connect with us by completing a [support form](https://airtable.com/appfOr0lGpRh28jTk/pagNqg817o65RLZ54/form) — we're happy to help!
  - question: Who should I contact if I have special dietary needs or allergies?
    answer: We do our best to accommodate a wide range of dietary needs across all meals and snacks and
      will have options for vegan, vegetarian, gluten-free, and dairy-free attendees. If you have a specific
      allergy or concern outside of this, [contact us](https://airtable.com/appfOr0lGpRh28jTk/pagNqg817o65RLZ54/form)
      and we’ll do our best to support you.
  - question: Where can I find information about and make adjustments to my registration details?
    answer: You can download a copy of your receipt and make modifications to your details (including
      pass cancellation) in your registration profile in the [attendee portal](https://reg.githubuniverse.com/flow/github/universe26/attendee-portal).
      If you would like a confirmation email, please [contact us](https://airtable.com/appfOr0lGpRh28jTk/pagNqg817o65RLZ54/form).
  - question: Are certain items prohibited at Universe?
    answer: |-
      The following items are not allowed at Universe:

      - Weapons, including: firearms, knives, tasers, batons and personal defense sprays

      - Bull horns

      - Noise makers

      - Signs, banners, flags, hats or clothing representing political/activist groups or containing derogatory messaging

      - Outside alcoholic beverages

      If any of these items are on your person, you will be asked to surrender them before entering the event.
  - question: Have a specific question that you didn’t find here?
    answer: '[Contact us](https://airtable.com/appfOr0lGpRh28jTk/pagNqg817o65RLZ54/form).'
