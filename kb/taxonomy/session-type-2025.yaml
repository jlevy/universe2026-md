facet:
  id: session-type-2025
  event: event:github-universe-2025
  label: Session type
  multi_valued: false
  terms:
  - id: term:session-type-2025/sandbox-session
    label: Sandbox Session
    description: This session combines both a demo-style and workshop format with practical exercises.
      Facilitators will demonstrate live the fundamental concepts, tools, or techniques they used to solve
      a specific challenge in the software development landscape. This will be followed by an opportunity
      for participants to actively engage in interactive exercises similar to the ones demonstrated to
      solidify their understanding.
    duration_minutes: 60
    source_id: option_1709309491135
    session_count: 9
  - id: term:session-type-2025/breakout-session
    label: Breakout Session
    description: A focused presentation designed to inform and inspire the audience. These sessions typically
      feature a single speaker or co-presenters sharing expertise, insights, and practical takeaways.
      While this session type is primarily in a presentation format, audience engagement through Q&A,
      polls, and/or brief interactions is encouraged to enrich the experience.
    duration_minutes: 40
    source_id: sessionType_breakoutSession
    session_count: 19
  - id: term:session-type-2025/keynote
    label: Keynote
    source_id: sessionType_keynote
    session_count: 2
  - id: term:session-type-2025/fireside-chat
    label: Fireside Chat
    description: While similar to a panel discussion, this is a conversation between a moderator and one
      speaker rather than a group of experts.
    duration_minutes: 40
    source_id: 1681826483038001zW75
    session_count: 1
  - id: term:session-type-2025/product-demo
    label: Product Demo
    description: A presentation focused on tips, tricks, and best practices for working in a specific
      product.
    duration_minutes: 15
    source_id: 1681826483038002ztLL
    session_count: 51
  - id: term:session-type-2025/workshop
    label: Workshop
    description: 'Similar to a sandbox session (but without the demo portion), this session type focuses
      entirely on interactive exercises for a deeper, more immersive learning experience. This is your
      traditional workshop format, where facilitators guide attendees step-by-step through targeted activities.
      Participants will actively engage with the material, gaining practical insights and applying concepts
      in a collaborative setting tailored to enhance their understanding and skills. Note: Workshops require
      an additional fee of $99, which you can add to your registration in the Attendee Portal.'
    duration_minutes: 90
    source_id: 1681826483038003zyr1
    session_count: 5
  - id: term:session-type-2025/panel-discussion
    label: Panel Discussion
    description: A moderated session where a diverse group of experts debate or discuss fresh, timely,
      and thought-provoking topics shaping the industry. Panels should showcase a range of perspectives
      and experiences, challenging conventional wisdom and sparking new ideas. To ensure audience value,
      a significant portion of the session will be dedicated to Q&A and interactive engagement.
    duration_minutes: 40
    source_id: 1682954346052001b9gI
    session_count: 1
  - id: term:session-type-2025/discussions-lounge
    label: Discussions Lounge
    description: A highly interactive gathering where two to three facilitators guides a group of 50+
      attendees through dynamic small-group conversations on a specific topic of interest. Prioritizing
      active participation and collaboration, these discussion-driven sessions do not include slide presentations.
    duration_minutes: 60
    source_id: 1688731625258001P82F
    session_count: 6
