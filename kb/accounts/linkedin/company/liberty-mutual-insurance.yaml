    in 28 countries and economies, we are the ninth largest global property and casualty insurer and generate
    more than $50 billion in annual consolidated revenue. We operate through three strategic business
    units: US Retail Markets, providing auto, home, renters and other personal and small commercial lines
    property and casualty insurance to individuals and small businesses countrywide; Global Risk Solutions,
    delivering a full range of comprehensive commercial and specialty insurance, reinsurance and surety
    solutions to mid-size and large businesses worldwide; and Liberty Mutual Investments, deploying more
    than $100 billion of long-term capital globally across its integrated platform to drive economic growth,
    power innovation and secure Liberty Mutual’s promises. For more information, visit www.libertymutualinsurance.com.'
