  bio: 'Tiger Data is addressing one of the largest challenges (and opportunities) in databases for years
    to come: helping developers, businesses, and society make sense of the data that humans and their
    machines are generating in copious amounts. Tiger Data is the fastest PostgreSQL cloud platform that
    natively supports full-SQL, combining the power, reliability, and ease-of-use of a relational database
    with the scalability typically seen in NoSQL systems. It is built on PostgreSQL and optimized for
    fast ingest and complex queries. Tiger Data is deployed for powering mission-critical applications,
    including industrial data analysis, complex monitoring systems, operational data warehousing, financial
    risk management, and geospatial asset tracking across industries as varied as manufacturing, space,
    utilities, oil & gas, logistics, mining, ad tech, finance, telecom, and more. Tiger Data is backed
    by NEA, Benchmark, Icon Ventures, Redpoint Ventures, Two Sigma Ventures, and Tiger Global. Documentation:
    https://docs.tigerdata.com/ GitHub: https://github.com/timescale/timescaledb Twitter: https://x.com/TimescaleDB'
