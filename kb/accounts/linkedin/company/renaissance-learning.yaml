  bio: As a global leader in assessment, reading, and math solutions for pre-K–12 schools and districts,
    Renaissance is committed to providing educators with insights and resources to accelerate growth and
    help all students build a strong foundation for success. Renaissance solutions are used in over one-third
    of US schools and in more than 100 countries worldwide. The Renaissance portfolio includes Star Assessments,
    for reliable, accurate insights into K–12 student learning; myIGDIs, for accurate assessment of early
    learning; myON, to increase students’ access to high-quality reading materials; Accelerated Reader,
    to support independent reading practice; Freckle, for teacher-led differentiated instruction; and
    Schoolzilla, to give educators actionable insights into trends in student attendance and achievement.
    Why join the Renaissance team? We're award-winning! From employer of choice certifications to EdTech
    awards, Renaissance continues to be praised for our inclusive company culture & top-notch product
    offerings. In 2024, Renaissance earned a consecutive Great Place to Work® certification and was named
    to Fast Company's list of 100 Best Workplaces for Innovators! In 2023, we were also recognized as
    a Best Workplace for Women by Fortune magazine. Join our award-winning team today and help accelerate
    learning for all.
