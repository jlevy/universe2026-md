  bio: 'Pragmatic AI Labs "does well by doing good". We publish cutting edge educational to the top platforms
    in the world including: edX, Coursera, O''Reilly and Linkedin Learning. This is our mission statement:
    Created by globally recognized thought leaders who have taught at elite universities like Duke, Oxford,
    Northwestern, UC Davis, and UC Berkeley, Pragmatic AI Labs has produced content for world-class partners,
    including AWS, Azure, Google, O''Reilly, Pearson, Linkedin Learning, Udacity, Coursera, and others.
    At our core is a commitment to equipping all people, regardless of means or background, with the knowledge
    to transform themselves and uplift their communities. Pragmatic AI Labs strives to democratize education
    and empower lives through innovative, ethical technology. Our programs focus on providing accessible,
    cutting-edge skills that lead to fulfilling careers while avoiding harm and improving humanity''s
    wellbeing. We reject exploitation and instead share profits to fuel positive impact at scale. We create
    enduring value that transcends mere economic measures by building consciously and sustainably. Core
    values include: * Do well by doing good * Democratize cutting-edge education * Build products that
    help humanity. * Avoid harming humans or the earth. * Limit exploitation of technology workers by
    sharing profits in an equal manner. * Build slowly and thoughtfully, focusing on value creation instead
    of user growth.'
