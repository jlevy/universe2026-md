  display_name: InnerSource Commons Foundation
  bio: The InnerSource Commons Foundation is a community of industry professions and researchers founded
    to promote InnerSource - the application of Open Source principles and practices in enterprises. Come
    join us to learn about best practices on how to leverage Open Source principles to enhance cross-team
    collaboration within your company and gain efficiency and build open source skills enabling you to
    meaningfully participate in open source communities. InnerSource Commons Vision The InnerSource Commons
    is a thriving community that empowers organisations and people worldwide to apply and gain the benefits
    of open collaboration in their internal work. Founded in 2015, the InnerSource Commons is now supporting
    and connecting over 3000 individuals from over 750 companies, academic institutions, and government
    agencies. The InnerSource Commons Foundation was incorporated on February 19th, 2020 and is now a
    501(c)(3) public charity. InnerSource Commons Mission We empower developers and organisations to apply
    open collaboration principles in their daily work. We are the neutral hub and central collaboration
    space for InnerSource knowledge. As such, we maintain our independence and operate on a lean budget.
    We build a strong, inclusive community and industry partnerships. Together, we apply open collaboration
    principles to drive the conversation about InnerSource and steward the InnerSource body of knowledge.
