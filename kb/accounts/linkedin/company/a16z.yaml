  bio: 'Founded in 2009 by Marc Andreessen and Ben Horowitz, Andreessen Horowitz (known as "a16z") is
    a venture capital firm that backs bold entrepreneurs building the future through technology. We are
    stage agnostic: We invest in seed to late-stage technology companies, across the consumer, enterprise,
    bio/healthcare, crypto, fintech and games spaces. a16z is defined by respect for the entrepreneur
    and the entrepreneurial company building process; we know what it’s like to be in the founder’s shoes.
    The firm is led by general partners, many of whom are former founders/operators, CEOs, or CTOs of
    successful technology companies, and who have domain expertise ranging from biology to crypto to distributed
    systems to security to marketplaces to financial services. We aim to connect entrepreneurs, investors,
    executives, engineers, academics, industry experts, and others in the technology ecosystem. We have
    built a network of experts including technical and executive talent; top media and marketing resources;
    Fortune 500/Global 2000 companies; as well as other technology decision makers, influencers, and key
    opinion leaders. a16z uses this network as part of our commitment to help our portfolio companies
    grow their business, so our operating teams provide entrepreneurs with access to expertise and insights
    across the entire spectrum of company building. https://a16z.com/portfolio/ https://a16z.com/podcasts/
    https://a16z.com/videos/ http://a16z.com/subscribe See Disclosures: https://a16z.com/disclosures/'
