  display_name: Octopus Deploy
  bio: Octopus Deploy sets the standard for Continuous Delivery (CD), empowering software teams to deliver
    value in an agile way. Globally, more than 4,000 organizations rely on our Continuous Delivery, GitOps,
    and release orchestration solutions to deliver swift value to their customers. At Octopus, we create
    happy deployments, and by extension, happy software teams. Founded in 2012, our vision is for all
    software teams to look forward to deployment time; to be excited about seeing their changes deployed
    and used by their customers. We want them to deploy more and more frequently, and to feel 100% confident
    it will just work. Octopus efficiently orchestrates software delivery across multi-cloud, Kubernetes,
    data centers, and hybrid environments, whether containerized modern apps or heritage applications.
    With governance, risk, and compliance (GRC) at its core, Octopus supports Platform Engineering teams
    in their mission to provide a superior developer experience (DevEx). Octopus also actively contributes
    to the developer community with open-source projects. Handle complex software delivery at any scale
    with Octopus Deploy.
