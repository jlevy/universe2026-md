  bio: 'ZEISS is an internationally leading technology enterprise operating in the fields of optics and
    optoelectronics. In the previous fiscal year, the ZEISS Group generated annual revenue totaling almost
    12 billion euros in its four segments Semiconductor Manufacturing Technology, Industrial Quality &
    Research, Medical Technology, and Consumer Markets (September 30, 2025). For its customers, ZEISS
    develops, produces, and distributes highly innovative solutions for industrial metrology and quality
    assurance, microscopy solutions for the life sciences and materials research, and medical technology
    solutions for diagnostics and treatment in ophthalmology and microsurgery. The name ZEISS is also
    synonymous with the world''s leading lithography optics, which are used by the chip industry to manufacture
    semiconductor components. There is global demand for trendsetting ZEISS brand products such as eyeglass
    lenses, camera lenses, and binoculars. With a portfolio aligned with future growth areas like digitalization,
    healthcare, and Smart Production and a strong brand, ZEISS is shaping the future of technology and
    constantly advancing the world of optics and related fields with its solutions. The company''s significant,
    sustainable investments in research and development lay the foundation for the success and continued
    expansion of ZEISS'' technology and market leadership. ZEISS invests 15 percent of its revenue in
    research and development – this high level of expenditure has a long tradition at ZEISS and is also
    an investment in the future. With over 46,600 employees, ZEISS is active globally in around 50 countries
    with more than 60 sales and service locations, around 40 research and development facilities, and
    30 production facilities worldwide. Learn more about ZEISS: www.zeiss.com/about Data privacy: www.zeiss.com/data-protection
    Imprint: www.zeiss.com/publisher This is ZEISS''s official LinkedIn account. It follows the ZEISS
    Netiquette: www.zeiss.com/netiquette'
