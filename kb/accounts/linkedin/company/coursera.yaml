  bio: Coursera was launched in 2012 by Andrew Ng and Daphne Koller with a mission to provide universal
    access to world-class learning. Today, it is one of the largest online learning platforms in the world,
    with 197 million registered learners as of December 31, 2025. Coursera partners with over 375 leading
    university and industry partners to offer a broad catalog of content and credentials, including courses,
    Specializations, Professional Certificates, and degrees. Coursera’s platform innovations — including
    generative AI-powered features like Coach, Role Play, and Course Builder, and role-based solutions
    like Skills Tracks — enable instructors, partners, and companies to deliver scalable, personalized,
    and verified learning. Institutions worldwide rely on Coursera to upskill and reskill their employees,
    students, and citizens in high-demand fields such as GenAI, data science, technology, and business,
    while learners globally turn to Coursera to master the skills they need to advance their careers.
