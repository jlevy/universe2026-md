  bio: '🤝Ce qui fait notre singularité ? Chez Bouygues Telecom, nous croyons que les relations humaines
    sont un besoin vital. La qualité de nos relations avec notre famille, nos amis, ceux qui nous entourent
    est déterminante pour notre bien-être, notre santé et même notre espérance de vie. Ce sont ces relations
    qui nous épanouissent, nous font aller de l’avant et nous permettent de vivre plus heureux, plus longtemps.
    C’est pourquoi depuis notre création en 1996, les équipes Bouygues Telecom mettent toute leur énergie
    pour que la technologie soit avant tout au service de vos relations. Nous souhaitons agir pour faire
    grandir les relations humaines. En permettant à tous sans exception de garder le contact avec ses
    proches et la société. En devenant une source d’inspiration qui donne à chacun l’envie d’enrichir
    et d’améliorer la qualité de ses relations. Nos 10 500 collaborateurs relèvent tous ensemble au quotidien
    ce même défi : être engagés pour un numérique qui nous réunit. 💼 Nos métiers ? Quelles que soient
    vos aspirations il y aura forcément un métier pour vous chez Bouygues Telecom ! Plus de 150 métiers
    interagissent tous les jours : Télécom / Réseau, IT, Big Data, Innovation, Marketing, Commerce, Finance,
    Achats, Juridique… Nous avons besoin de tous les talents pour accomplir notre mission; car c’est cette
    richesse de profils et de compétences qui fait la qualité de nos services et contribue à la satisfaction
    de nos clients. 👉Alors si... Vous avez envie de mettre votre talent au service du développement numérique
    pour tous et de faire grandir les relations humaines : vous frappez à la bonne porte. Vous rêvez d’une
    entreprise qui donne le meilleur d’elle-même pour que vous puissiez donner le meilleur à votre tour
    : alors bienvenue ! #OnEstFaitPourEtreEnsemble'
