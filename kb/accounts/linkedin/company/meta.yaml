  bio: 'Meta''s mission is to build the future of human connection and the technology that makes it possible.
    Our technologies help people connect, find communities, and grow businesses. When Facebook launched
    in 2004, it changed the way people connect. Apps like Messenger, Instagram and WhatsApp further empowered
    billions around the world. Now, Meta is moving beyond 2D screens toward immersive and intelligent
    experiences like virtual reality, wearables and AI to help build the next evolution in social technology.
    To help create a safe and respectful online space, we encourage constructive conversations on this
    page. Please note the following: • Start with an open mind. Whether you agree or disagree, engage
    with empathy. • Comments violating our Community Standards will be removed or hidden. Please treat
    everybody with respect. • Keep it constructive. Use your interactions here to learn about and grow
    your understanding of others. • Our moderators are here to uphold these guidelines for the benefit
    of everyone, every day. • If you are seeking support for issues related to your Facebook account,
    please reference our Help Center (https://www.facebook.com/help) or Help Community (https://www.facebook.com/help/community).
    For a full listing of our jobs, visit https://www.metacareers.com'
