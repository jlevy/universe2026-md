    \  <a href=\"https://github.com/piyushsuthar/github-readme-quotes\">\n    <img src=\"https://quotes-github-readme.vercel.app/api?type=horizontal&theme=chartreuse-dark\"\
    \ alt=\"Readme Quotes\">\n  </a>\n</div>\n\n###\n\n<p align=\"left\">Nice to meet you everyone! I’m\
    \ a sophomore studying robotics and digital systems. I love to teach and learn new things from others,\
    \ usually networking always occurs at hackathons (lmk if you want to team up). I’ve also had like\
    \ 2 internships with local mexican companies. Then I became an MLH Fellow and started contributing\
    \ to open source. I then got a formal internship at Insulet and been working remotely as a Cloud Developer\
    \ since. I’m now an MLH Coach, love to assist and participate in hackathons as well as to stream tech\
    \ content. I enjoy random projects at midnight and always love collaboration with a multiskilled team.</p>\n\
    \n<p align=\"center\">\n  <a href=\"https://www.github.com/JocelynVelarde\" target=\"_blank\" rel=\"\
    noreferrer\">\n    <img src=\"https://img.shields.io/github/followers/JocelynVelarde?logo=github&style=for-the-badge&color=ff69b4&labelColor=1c1917\"\
