  profile_readme: |-
    ### Hey, I'm Sam

    I'm a Senior Software Engineer at [GitHub](https://github.com), building tools that help developers work with AI.

    ## Current Focus

    **[GitHub MCP Server](https://github.com/github/github-mcp-server)** - I build and maintain GitHub's official Model Context Protocol server, enabling AI agents to interact with GitHub.

    **[Model Context Protocol](https://github.com/modelcontextprotocol/modelcontextprotocol)** - Contributing to the MCP specification including SEPs for [Tool Resolution](https://github.com/modelcontextprotocol/modelcontextprotocol/pull/1862) and [Trust Annotations](https://github.com/modelcontextprotocol/modelcontextprotocol/pull/1913), plus security docs on [session hijacking](https://github.com/modelcontextprotocol/modelcontextprotocol/pull/641).

    ## Talks & Appearances

    [VS Code Live: Extending Agent Mode](https://youtu.be/T44T55wvDD0) - Interview and live demo

    [The Context: GitHub & Microsoft Special](https://www.youtube.com/watch?v=rtht8dbwe5U) - Live demo with MCP community hosts

    [LastMile AI: MCP at Hyperscale](https://www.youtube.com/watch?v=0d9TR91iLx0) - Building servers that serve millions

    ## Projects

    [reMarkable MCP Server](https://github.com/SamMorrowDrums/remarkable-mcp) - An MCP server for accessing reMarkable tablet data

    **MCP Starter Templates** - Getting started with MCP? I've created starter templates:
    - [mcp-python-starter](https://github.com/SamMorrowDrums/mcp-python-starter)
    - [mcp-go-starter](https://github.com/SamMorrowDrums/mcp-go-starter)
    - [mcp-typescript-starter](https://github.com/SamMorrowDrums/mcp-typescript-starter)

    ## Open Source

    I enjoy contributing across the ecosystem:
    - [Participate in issues](https://github.com/search?q=commenter%3ASamMorrowDrums+-user%3ASamMorrowDrums&type=issues) to help get them closed
    - Contribute [documentation](https://github.com/search?q=author%3ASamMorrowDrums+type%3Apr+is%3Amerged+docs+OR+documentation&type=pullrequests) to projects
    - Work in [Rust](https://github.com/ruffle-rs/ruffle/pulls?q=is%3Apr+author%3ASamMorrowDrums), [Go](https://github.com/github/github-mcp-server/pulls?q=is%3Apr+author%3ASamMorrowDrums+is%3Amerged), [TypeScript](https://github.com/palantir/plottable/pull/3087), [Python](https://github.com/SamMorrowDrums/remarkable-mcp), and more

    ### [Read my blog →](https://sam-morrow.com/blog)
