  profile_readme: "## Hey, this is us \U0001F44B\n\n![An illustration showing a variety of differently\
    \ themed Octocats. Monuments from different cities are indicated in the background like the Space\
    \ Needle, Berlin Fernsehturm and Transamerica Pyramid.](https://user-images.githubusercontent.com/3369400/133268513-5bfe2f93-4402-42c9-a403-81c9e86934b6.jpeg)\n\
    \nYes, we are building GitHub on GitHub. In fact, we’ve been doing this since **October 19th, 2007**.\
    \ That's when we made our first commit. Since then we pushed **over 2.5 million commits**, opened\
    \ **over 1 million issues**, submitted roughly **650k pull requests** across **4357 repositories**\
    \ from over **50 countries**. \U0001F92F But that's just us. We are proud  to be part of the work\
    \ of millions of developers, companies and robots across the solar system. \U0001FA90 Yes, [Robots](https://github.com/readme/featured/nasa-ingenuity-helicopter)!\n\
    \n### \U0001F37F An interconnected community\n\nThe open source community is the \U0001F497 heart\
    \ of GitHub and fundamental to how we build software today. See for yourself:\n\n- [GitHub Sponsors](https://github.com/sponsors)\
    \ helped support more than **5k** individuals and projects around the world \U0001F30D\n- Open source\
    \ projects on GitHub received a stunning **218 million** contributions \U0001F680 in the last year\
    \ alone\n- **Every minute** a developer creates a new release \U0001F3C4 for a public project on GitHub\n\
    \nNow that we are talking about the important things, ☝️ are you contributing to open source? Yes?\
    \ Okay, you rock! \U0001F3B8 If not, we can help you get started! Open source software is made by\
    \ people just like you. Learn more about [how to contribute](https://opensource.guide/).\n\n### \U0001F9A6\
    \ Contributing to the ecosystem\n\nWe contribute to the tools \U0001F527 we rely on to build and run\
    \ GitHub, while also maintaining \U0001F9D9‍♂️ our own open source projects like:\n\n- [GitHub CLI](https://github.com/cli/cli)\
    \ - A command line tool for GitHub\n- [GitHub Desktop](https://github.com/desktop/desktop) - A visual\
    \ approach to using Git with GitHub\n- [Git Large File Storage](https://github.com/git-lfs/git-lfs)\
    \ - A Git extension for versioning large files\n- [Primer](https://github.com/primer/css) - The GitHub\
    \ design system\n\n### \U0001F453 Appendix\n\nSee what's next on our [public roadmap](https://github.com/github/roadmap)\
    \ ✨ and [let us know](https://github.com/github/feedback) if you have any suggestions. \U0001F647\
    ‍♂️ Oh, and by the way, we are always hiring talented, passionate people to [join our team](https://github.com/about/careers).\
    \ \U0001F64C\n\n<details> \n\t<summary>\"Tell me more, I can't get enough!\"</summary>\n\t<br>\n\t\
    <ul>\n\t<li>GitHub is built using mighty \U0001F528 open source technologies like <a href=\"https://github.com/rails\"\
    >Ruby on Rails</a>, <a href=\"https://github.com/golang\">Go</a>, <a href=\"https://github.com/primer\"\
    >Primer</a>, <a href=\"https://github.com/reactjs\">React</a> and <a href=\"https://github.com/apache/kafka\"\
    >Kafka</a> among others.</li>\n\t\t<li>The three open source projects GitHub members have most contributed\
    \ \U0001F469‍\U0001F4BB to are:\n\t\t\t<ul>\n\t\t\t\t<li><a href=\"https://github.com/microsoft/vscode\"\
    >Visual Studio Code</a></li>\n\t\t\t\t<li><a href=\"https://github.com/rails/rails\">Ruby on Rails</a></li>\n\
    \t\t\t\t<li><a href=\"https://github.com/Homebrew\">Homebrew</a></li>\n\t\t\t</ul>\n\t\t</li>\n\t\t\
    <li>By the way, our <a href=\"https://github.com/github/docs\">documentation</a> \U0001F913 is also\
    \ open sourced.</li>\n\t</ul>\n</details>\n\n---\n\n<sub>\U0001F92B Psst! You can create your own\
    \ [organization README](https://docs.github.com/en/organizations/collaborating-with-groups-in-organizations/customizing-your-organizations-profile).</sub>\n\
    \n<!--\nMade with \U0001F5A4\n\U0001F647‍♂️\U0001F3A4⬇️\n-->"
