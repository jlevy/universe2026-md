  profile_readme: "![github-universe-platinum-plus-sponsor-2000-x-800](https://github.com/xebia/.github/assets/6085745/60859019-799e-442f-a367-5a3bcb741290)\n\
    \n## Introducing Xebia: Your GitHub-Powered Technology Partner \n\nInnovation knows no boundaries,\
    \ and neither do we. While we span the globe, our roots are deeply embedded in the technology we love.\
    \ Our mission is clear: to deliver cutting-edge solutions to businesses worldwide, and our tool of\
    \ choice is GitHub. We are a global collective of technology experts who are passionate about GitHub's\
    \ potential as a catalyst for progress. \n\nOur drive comes from both people and innovation, as we\
    \ collaborate closely with industry leaders like AWS, Google, Scrum.org, Microsoft, and GitHub to\
    \ raise development to new heights. We empower companies to adopt GitHub, enhance Developer Experience\
    \ with AI, and prioritize top-notch security and compliance. \n\nBut we're not just any partner –\
    \ we are a Global Verified GitHub Partner. We are a driving force in the GitHub ecosystem, dedicated\
    \ to unlocking the potential of organizations worldwide, enabling them to build better and more secure\
    \ software. \n\nGitHub is the cornerstone of Xebia's operations. It not only drives our internal processes\
    \ but also powers collaboration with our valued customers. Whether you're seeking generative AI, end-to-end\
    \ security, or streamlined collaboration through version control and CI/CD, GitHub, coupled with our\
    \ expertise, is the answer. \n\n## GitHub Global Partner of the Year 2024-2025\n\nXebia has been awarded\
    \ as GitHub's Global Partner of the Year for 2024-2025, highlighting its expertise in security, AI,\
    \ and platform engineering. This recognition underscores Xebia's commitment to delivering innovative\
    \ solutions and driving business success through GitHub's platform. In addition to the global award,\
    \ Xebia received several key distinctions:\n\n<img src=\"https://github.com/user-attachments/assets/40a5d67e-9070-48d4-9523-964ad58096ae\"\
    \ width=\"200\" alt=\"GitHub Overall Channel Partner of the Year 2024 badge\"/> \n<img src=\"https://github.com/user-attachments/assets/453fe5fd-ec2b-4d6f-9d96-238b2d1ba8f7\"\
    \ width=\"200\" alt=\"GitHub Security Channel Partner of the Year 2024 badge\"/> \n\n- Winner, EMEA\
    \ Security\n- Winner, AMER Security\n- Finalist, EMEA Platform & AI\n- Finalist, AMER AI\n\nThese\
    \ accolades reflect Xebia's ability to provide secure, AI-powered solutions and drive platform innovation\
    \ for clients worldwide. The journey to this achievement began in 2020 when Xebia became the first\
    \ European GitHub Verified Partner. Since then, Xebia has evolved into a global leader in digital\
    \ transformation, utilizing GitHub's tools to deliver high-performance IT solutions.\n\nMarcel de\
    \ Vries, Global Managing Director & CTO of Xebia Microsoft Services, stated, \"_GitHub is not just\
    \ a platform for us—it’s a strategic enabler that allows our customers to unlock innovation, accelerate\
    \ development, and enhance security._\"\n\n## Cultivating Engineering Excellence with GitHub \n\n\
    We harness the full potential of GitHub's features for every organization. With tools like GitHub\
    \ Actions, GitHub Codespaces, GitHub Advanced Security and GitHub Copilot for Business we automate\
    \ software workflows and development environments, enhance security, and foster seamless collaboration.\
    \ \n\n## Empowering DevOps with GitHub \n\nDevOps is all about team empowerment and seamless software\
    \ delivery. We guide clients through a strategic journey. Our Agile approach follows key principles,\
    \ including empowering developers, prioritizing meaningful metrics, ensuring comprehensive security,\
    \ and automating wherever possible. \n\n## Why Xebia \n\nWe offer cutting-edge solutions powered by\
    \ GitHub, spanning Development, App & Infra Modernization, Data & AI, and major cloud platforms. We\
    \ bring unique expertise, specialized training, and a strong security focus to the table. \n\nXebia\
    \ is your partner of choice for driving technology innovation and transformation. \n\n## Partnerships\n\
