# People to add to the knowledge base by hand: attendees, organizers, sponsor staff, or
# anyone else involved who is not in the official catalog.
#
# The build merges each entry with an existing person when any account matches (GitHub,
# X, LinkedIn, Bluesky or website), or when the name matches and the entry claims a
# speaking role. Otherwise it creates a new person.
#
# Every entry must cite a public source that states the person's part, such as their own
# post saying they will attend. The build refuses an entry without one: nobody is listed
# on inference, and a like, a follow or someone else's post is not enough.
#
# Fields:
#   name:              required
#   role:              attendee | speaker | organizer | sponsor_representative | host |
#                      volunteer
#   status:            confirmed (the organizer published it) | self_reported (the person
#                      said so publicly); required
#   inclusion_basis:   public_self_report | curated
#                      (published_by_event is reserved for the official catalog)
#   evidence:          list of {url, quote, observed_at}; at least one public URL
#   affiliation:       {organization, title}
#   accounts:          {github, x, linkedin, bluesky, website}, as handles or URLs
#   bio, photo_url:    optional public text and image
#
# Example (not active):
#
#   - name: Ada Example
#     role: attendee
#     status: self_reported
#     inclusion_basis: public_self_report
#     evidence:
#       - url: https://x.com/adaexample/status/123
#         quote: "See you at GitHub Universe!"
#         observed_at: "2026-10-20"
#     affiliation: {organization: Example Corp, title: Staff Engineer}
#     accounts: {github: adaexample, x: adaexample, website: https://ada.example.com}

# Listed names to replace, keyed exactly as the catalog lists them. The build already
# reorders "Last, First" names and drops directory codes; use this for what no rule can
# tell, and say why.
names:
  # The 2024 catalog's spelling; the 2025 catalog lists the same GitHub International
  # Developer Relations Director as "Karan M V".
  MV Karan: Karan M V
  # The 2024 listing gives only the GitHub handle; the global profile's family name is
  # Teixeira and the event bio's given name is Guilherme.
  gateixeira: Guilherme Teixeira

# Links a source made that are wrong. The build drops them, and everything learned
# through them (an X profile's website, a homepage's feeds).
rejected_links:
  # The 2024 catalog lists "oedevon", a camping retailer; 2023 lists "joedevon".
  - person: joe-devon
    link: acct:x/oedevon
  # The GitHub profile's website now serves another person's portfolio.
  - person: rohan-varma
    link: site:rohan.rocks
  # The domain linked from LinkedIn now serves an online gaming spam page.
  - person: oren-melamed
    link: site:promptboost.dev
  # Product and employer pages linked from X or LinkedIn, not personal websites.
  - person: greg-larkin
    link: site:puppet.com
  - person: josh-scriven
    link: site:neudesic.com
  # The owner's own profiles describe this account as personal.
  - person: idan-gazit
    link: acct:mastodon/idan@babka.social

people: []

# People left out of the knowledge base: at their request, or because a source wrongly
# took them for someone involved. The build leaves each one out of every record, search
# document and graph export, collection skips their accounts, and `universe-kb scrub`
# deletes their raw data and bios. Fingerprint each full typed person ID and every
# account/website key that identifies them. Do not repeat a request's content.
#
# Store only SHA-256 fingerprints of normalized person/account/website keys here.
# Keep identifiers and request context private. Fingerprints can be dictionary-tested;
# they are pseudonymous matching keys, not anonymization. See pipeline/README.md.
exclude:
  - sha256: b5409c154b3deeed8e9dde67d39b31361ed0f2dff5fd1f78997613b19342ff10
  - sha256: 3dd056493548e96812c194e8202d1960a411ab38bc2d0609ab099dbce7e62d98

