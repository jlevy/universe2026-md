    vendor: github
    product_term: GitHub Secret Protection
    aliases: [GitHub Secret Protection, Secret Protection]
  - id: github-agentic-workflows
    name: GitHub Agentic Workflows
    kind: github_product
    vendor: github
    aliases: [GitHub Agentic Workflows, Agentic Workflows, gh-aw]
    repositories: [github/gh-aw]
  - id: github-mcp-server
    name: GitHub MCP Server
    kind: github_product
    vendor: github
