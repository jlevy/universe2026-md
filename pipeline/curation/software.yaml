    vendor: github
    aliases: [Spec Kit, spec-kit]
    repositories: [github/spec-kit]
  - id: codespaces
    name: GitHub Codespaces
    kind: github_product
    vendor: github
    product_term: Codespaces
    aliases: [GitHub Codespaces, Codespaces]
  - id: github-enterprise-cloud
    name: GitHub Enterprise Cloud
    kind: github_product
    vendor: github
    product_term: GitHub Enterprise Cloud
    aliases: [GitHub Enterprise Cloud]
  - id: github-enterprise-server
    name: GitHub Enterprise Server
    kind: github_product
    vendor: github
    product_term: GitHub Enterprise Server
    aliases: [GitHub Enterprise Server]
  - id: github-issues-projects
    name: GitHub Issues and Projects
    kind: github_product
    vendor: github
    product_term: Projects and Issues
    aliases: [GitHub Issues, GitHub Projects]
  - id: github-discussions
    name: GitHub Discussions
    kind: github_product
    vendor: github
    product_term: Discussions
    aliases: [GitHub Discussions]
  - id: github-marketplace
