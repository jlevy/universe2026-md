# Software gazetteer: products, projects, languages and protocols that session
# abstracts and speaker bios mention by name.
#
# Matching is case-sensitive, whole-word and longest-first across these aliases and all
# organization names, so "GitHub Copilot CLI" wins over "GitHub Copilot" and "The Linux
# Foundation" is an organization, not a mention of Linux. Names that are also ordinary
# words or sentence starters ("Go", "Spark", "Processing", "Projects") are left out on
# purpose. Companies whose product shares their name (Sentry, Figma, Postman) are
# matched as organizations instead.
#
# `repositories` and `packages` are claims; `universe-kb enrich` checks each one against
# GitHub, npm and PyPI, and the build keeps only those that resolve.

software:
  # GitHub products. `product_term` links to the catalog's "GitHub product" facet.
  - id: github-copilot
    name: GitHub Copilot
    kind: github_product
    vendor: github
    product_term: GitHub Copilot
    homepage: https://github.com/features/copilot
    aliases: [GitHub Copilot, Copilot, Copilot Chat]
  - id: copilot-cli
    name: GitHub Copilot CLI
    kind: github_product
    vendor: github
    aliases: [GitHub Copilot CLI, Copilot CLI]
    repositories: [github/copilot-cli]
    packages: ["npm:@github/copilot"]
  - id: copilot-sdk
    name: GitHub Copilot SDK
    kind: github_product
    vendor: github
    aliases: [GitHub Copilot SDK, Copilot SDK]
    repositories: [github/copilot-sdk]
  - id: copilot-coding-agent
    name: Copilot coding agent
    kind: github_product
    vendor: github
    aliases: [Copilot coding agent, GitHub Copilot coding agent]
  - id: github-actions
    name: GitHub Actions
    kind: github_product
    vendor: github
    product_term: Actions
    homepage: https://github.com/features/actions
    aliases: [GitHub Actions]
    repositories: [actions/runner, actions/toolkit]
  - id: dependabot
    name: Dependabot
    kind: github_product
    vendor: github
    product_term: Dependabot
    aliases: [Dependabot]
    repositories: [dependabot/dependabot-core]
  - id: codeql
    name: CodeQL
    kind: github_product
    vendor: github
    aliases: [CodeQL]
    repositories: [github/codeql]
  - id: github-advanced-security
    name: GitHub Advanced Security
    kind: github_product
    vendor: github
    aliases: [GitHub Advanced Security, Advanced Security, GHAS]
  - id: github-code-security
    name: GitHub Code Security
