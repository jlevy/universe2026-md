# Organizations that the program mentions but that no speaker, sponsor or host
# connects to the event. They join the knowledge base only when a mention is found.
mentioned_organizations:
  openssf:
    name: OpenSSF
    aliases: [OpenSSF, Open Source Security Foundation]
    website: https://openssf.org
    github: ossf

# Phrases that contain a known name but do not mention it.
ignore_phrases: [Salesforce Park, Salesforce Tower]

# Organization names that are also ordinary words; never matched as mentions.
ambiguous_org_names: [Port, Arm, Insight, Precisely, Galaxy, Rewind, Independent, Signal]
