# Hand-curated organization facts the sources cannot supply.
#
# - `aliases` merge spellings that legal-suffix stripping does not catch.
# - `split` turns one listed company string into several affiliations, primary first.
# - `none` lists company strings that do not name an organization.
# - `github` pins an organization's GitHub account when automatic matching would be
#   ambiguous or wrong.
# - `website` replaces a sponsor link that points somewhere else (Accenture's points at
#   Avanade).
# - `related` links parent, subsidiary and partner organizations.
# - `session_hosts` names the sponsor of a sponsor session whose speakers work elsewhere,
#   keyed by session code.
#
# Keys are organization slugs (the part after `org:`).

organizer: github

ambiguous_mentions: [Principal, Sonar]

none:
  - ""
  - Independent
  # Programs and communities people list as their GitHub "company"; not employers.
  - Microsoft MVP
  - GitHub Campus Experts
  - Home Assistant Community Apps
  # LinkedIn "current company" values that are statuses or personal brands.
  - Open to Work
  - Until
  - Afro Adventurer™

split:
  "Accenture and Avanade":
    - Accenture
    - Avanade
  "CREATE / University of Washington":
    - CREATE
    - University of Washington
  "Processing Foundation, University of Southern California":
    - Processing Foundation
    - University of Southern California
  "Flox and NixOS":
    - Flox
    - NixOS Foundation

session_hosts:
  BLD1916M: [accenture]
  LDR1872D: [novus]

